<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babyora — fase 2B</title>
<style>
  :root { color-scheme: dark light; }
  body {
    margin: 0; padding: 32px 20px 80px;
    background: #1E140C; color: #F1E9DA;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    max-width: 720px; margin-inline: auto;
  }
  h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .undertittel { color: #A79A82; margin: 0 0 40px; }
  figure { margin: 0 0 44px; }
  figcaption { margin-bottom: 12px; }
  .nr { font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #A79A82; }
  .tittel { font-weight: 700; font-size: 18px; margin: 4px 0 4px; }
  .forklaring { color: #CDC0AB; font-size: 15px; margin: 0; }
  img {
    display: block; width: 100%; height: auto; margin-top: 14px;
    border-radius: 14px; border: 1px solid rgba(241,233,218,.12);
  }
  .merke {
    display: inline-block; margin-top: 10px; padding: 4px 10px;
    border-radius: 999px; font-size: 12px; font-weight: 600;
    background: rgba(217,142,90,.16); color: #E7B087;
  }
  .par { display: grid; gap: 14px; }
  @media (min-width: 600px) { .par { grid-template-columns: 1fr 1fr; } }
  footer { color: #A79A82; font-size: 14px; border-top: 1px solid rgba(241,233,218,.12); padding-top: 20px; }
</style>
</head>
<body>

<h1>Fase 2B — det som er bygget</h1>
<p class="undertittel">Avstandsskala, knapp, ark og rad. Alle målt før de ble bygget.</p>

<figure>
  <figcaption>
    <div class="nr">1 · ekte i appen nå</div>
    <div class="tittel">Verktøyradene</div>
    <p class="forklaring">
      Disse radene var en ordrett kopi av stilene fra Innstillinger — seks stilblokker,
      tegn for tegn. Nå deler begge stedene samme komponent, så en endring ett sted
      ikke lar det andre drive fra hverandre i stillhet.
    </p>
  </figcaption>
  <div class="par">
    <img src="rader-dark.png" alt="Verktøyradene i mørk modus">
    <img src="rader-light.png" alt="Verktøyradene i lys modus">
  </div>
</figure>

<figure>
  <figcaption>
    <div class="nr">2 · før og etter</div>
    <div class="tittel">Fokusringen</div>
    <p class="forklaring">
      Ringen du får når du bruker tastatur i stedet for finger. Appen hadde ingen
      felles regel for den — flere skjermer fikk nettleserens hvite standard, andre
      fikk ingenting. Ringen måler 1,47:1 mot den oransje knappen og 10,12:1 mot
      bakgrunnen: den fungerer bare fordi den ligger utenfor kanten.
    </p>
  </figcaption>
  <div class="par">
    <img src="fokusring-for.png" alt="Før: nettleserens hvite standardring">
    <img src="fokusring-etter.png" alt="Etter: appens egen ring">
  </div>
</figure>

<figure>
  <figcaption>
    <div class="nr">3 · ikke koblet inn ennå</div>
    <div class="tittel">Knappen</div>
    <p class="forklaring">
      Hovedknapp, kant, slett, deaktivert, venter og stille. Appen hadde 37 ulike
      knappevarianter; dette er flaten de skal migreres til. Alle tilstandsfarger er
      regnet ut i begge temaer — laveste tall er 5,17:1 mot kravet 4,5.
      «Slett» hadde tidligere nøyaktig samme farge som hovedknappen.
    </p>
    <span class="merke">Ingen skjerm bruker den ennå — det er fase 3</span>
  </figcaption>
  <img src="knapp-varianter.png" alt="Knappens seks varianter og tilstander">
</figure>

<footer>
  Bildene lages av <code>tools/skjermbilde-primitiver.mjs</code> og kan genereres på nytt
  når som helst. Den ekte appen kjører på <a href="http://localhost:4180" style="color:#E7B087">localhost:4180</a>
  når forhåndsvisningen er startet.
</footer>

</body>
</html>
