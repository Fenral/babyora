<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta id="babyora-theme-color" name="theme-color" content="#F2F5F1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="Babyora — norsk påkledningsapp for foreldre med barn 0–3 år. Vær, aktivitet og ull-lag i ett."
    />
    <meta name="apple-mobile-web-app-title" content="Babyora" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Les persistert tema før React og ekstern CSS laster. Holdes synkront
         med theme-store.ts, slik at første frame får riktig lerretsfarge. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get('launch-preview') === 'slow') {
            root.setAttribute('data-launch-preview', 'slow');
            var syncPreviewPlayback = function () {
              if (document.hidden) {
                root.setAttribute('data-launch-preview-paused', 'true');
              } else {
                root.removeAttribute('data-launch-preview-paused');
              }
            };
            document.addEventListener('visibilitychange', syncPreviewPlayback);
            syncPreviewPlayback();
          }
        } catch (e) {
          /* query-preview er kun et designverktøy; normal launch fortsetter */
        }

        var themeMode = 'light';
        try {
          var raw = localStorage.getItem('babyora.theme');
          if (raw) {
            var parsed = JSON.parse(raw);
            var storedMode = parsed && parsed.state && parsed.state.mode;
            if (storedMode === 'auto' || storedMode === 'light' || storedMode === 'dark') {
              themeMode = storedMode;
            }
          }
        } catch (e) {
          /* Mineral Garden light er trygg fallback */
        }

        if (themeMode === 'auto') {
          root.removeAttribute('data-theme');
        } else {
          root.setAttribute('data-theme', themeMode);
        }

        try {
          var usesDarkChrome = themeMode === 'dark'
            || (themeMode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var themeMeta = document.getElementById('babyora-theme-color');
          if (themeMeta) {
            themeMeta.setAttribute('content', usesDarkChrome ? '#1E140C' : '#F2F5F1');
          }
        } catch (e) {
          /* nettleserkrom er ikke kritisk for appstart */
        }
      })();
    </script>

    <!-- ÅPNINGSFLATEN — eier-override 2026-08-08.

         Avatar, delvis skyet-vær og Babyora-skilt danner én sentrert signatur
         på et helt rolig lerret. Ingen ekstra slagord, lastingstekst eller
         dekorativ bakgrunn. Flaten har ingen visningstimer og slipper så
         snart React har malt sin første ekte frame. -->
    <style>
      #launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding:
          max(24px, env(safe-area-inset-top, 0px))
          max(20px, env(safe-area-inset-right, 0px))
          max(24px, env(safe-area-inset-bottom, 0px))
          max(20px, env(safe-area-inset-left, 0px));
        overflow: hidden;
        background: #F2F5F1;
        transition: opacity 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .launch-signature {
        --launch-optical-y: -1.74vmax;
        width: min(38.07vmax, 88vw, 360px);
        transform: translateY(var(--launch-optical-y));
      }

      .launch-hero {
        position: relative;
        width: 100%;
        aspect-ratio: 980 / 860;
        overflow: hidden;
      }

      .launch-signboard {
        position: absolute;
        z-index: 0;
        left: 0;
        top: 70.93%;
        width: 100%;
        height: 29.07%;
        opacity: 1;
      }

      .launch-signboard::before {
        content: '';
        position: absolute;
        left: 0.102%;
        top: 1.6%;
        width: 99.796%;
        height: 88%;
        box-sizing: border-box;
        border: 1px solid rgb(201 221 213 / 72%);
        border-radius: 3.7% / 16%;
        background: #164B43;
        box-shadow:
          0 2px 5px rgb(29 62 52 / 18%),
          0 12px 25px rgb(29 62 52 / 12%),
          inset 0 1px 0 rgb(250 255 253 / 34%);
      }

      .launch-signboard img {
        position: absolute;
        z-index: 1;
        left: 26.531%;
        top: 38%;
        display: block;
        width: 46.939%;
        height: auto;
      }

      .launch-avatar {
        position: absolute;
        left: 0;
        top: 0;
        width: 91.837%;
        height: 83.605%;
        opacity: 1;
      }

      .launch-avatar { z-index: 1; }

      .launch-avatar img {
        position: absolute;
        left: -8.598%;
        top: -9.623%;
        width: 115.888%;
        height: auto;
      }

      /* Samme pikselgeometri som den native kompositten: været males sist,
         direkte over avatarens hånd, slik at skyen dekker tommelen der de
         overlapper. Rammene tilsvarer synlige alpha-flater; originalenes
         transparente luft korrigeres på de indre bildene. */
      .launch-weather {
        position: absolute;
        z-index: 2;
        left: 75%;
        top: 51.744%;
        width: 21.429%;
        height: 18.256%;
        pointer-events: none;
        opacity: 0;
        animation: launch-weather-in 420ms cubic-bezier(0.22, 1, 0.36, 1) 180ms both;
      }

      .launch-weather img {
        position: absolute;
        left: -23.21%;
        top: -43.84%;
        width: 146.74%;
        height: auto;
      }

      @media (prefers-color-scheme: light) {
        #launch { background: #F2F5F1; }
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #launch { background: #1E140C; }
      }

      :root[data-theme="dark"] #launch { background: #1E140C; }
      :root[data-theme="light"] #launch { background: #F2F5F1; }

      @keyframes launch-weather-in {
        0% {
          opacity: 0;
          clip-path: circle(0% at 50% 88%);
          transform: translateY(-7px) scale(0.94);
        }
        0.1% { opacity: 1; }
        100% {
          opacity: 1;
          clip-path: circle(75% at 50% 50%);
          transform: translateY(0) scale(1);
        }
      }

      /* Design-review, aldri vanlig appstart. Barnet og navneskiltet er
         statiske; `?launch-preview=slow` spiller bare værets landing 5× sakte. */
      :root[data-launch-preview="slow"] .launch-weather {
        animation: launch-weather-in 2100ms cubic-bezier(0.22, 1, 0.36, 1) 900ms both;
      }

      :root[data-launch-preview="slow"][data-launch-preview-paused="true"] .launch-weather {
        animation-play-state: paused;
      }

      #launch[data-ferdig="true"] { opacity: 0; pointer-events: none; }

      @media (prefers-reduced-motion: reduce) {
        #launch { transition-duration: 100ms; }
        .launch-signboard,
        .launch-avatar,
        .launch-weather {
          animation: none;
          opacity: 1;
          transform: none;
        }

        :root[data-launch-preview="slow"] .launch-signboard,
        :root[data-launch-preview="slow"] .launch-avatar,
        :root[data-launch-preview="slow"] .launch-weather {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
    <title>Babyora</title>

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/schibsted-grotesk-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/fraunces-latin-wght-normal.woff2"
    />
    <!-- Bildene ligger i HTTP-cachen før Capacitor skjuler native splash. -->
    <link rel="preload" as="image" type="image/webp" href="/monter/maskot-resultat-sveip.webp" />
    <link rel="preload" as="image" type="image/webp" href="/monter/vaer-delvis-skyet.webp" />
    <link
      rel="preload"
      as="image"
      type="image/svg+xml"
      href="/brand/babyora-wordmark-reverse.svg"
    />
  </head>
  <body>
    <a href="#main" class="skip-link">Hopp til hovedinnhold</a>
    <!-- Fjernes av launch-handoff.ts når React har malt første ekte frame. -->
    <div id="launch" aria-hidden="true">
      <div class="launch-signature" data-launch-signature>
        <div class="launch-hero" data-launch-hero>
          <div class="launch-signboard" data-launch-signboard>
            <img
              src="/brand/babyora-wordmark-reverse.svg"
              alt=""
              draggable="false"
              data-launch-wordmark
            />
          </div>
          <div class="launch-weather" data-launch-weather>
            <img
              src="/monter/vaer-delvis-skyet.webp"
              alt=""
              draggable="false"
            />
          </div>
          <div class="launch-avatar" data-launch-avatar>
            <img
              src="/monter/maskot-resultat-sveip.webp"
              alt=""
              draggable="false"
            />
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
