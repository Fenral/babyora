    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- ÅPNINGSKONTRAKTEN §8: «ingen hvit, svart eller feil-tematisert
         mellomframe». Sto som #DBD8D2 — en grå fra systemet FØR Monter, i
         BEGGE temaer. Statuslinja var altså feil farge fra første frame.
         Nå to metaer, én per tema, med lerretstokenets faktiske verdi. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E140C" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F9F5EB" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="Babyora — norsk påkledningsapp for foreldre med barn 0–3 år. Vær, aktivitet og ull-lag i ett."
    />
    <meta name="apple-mobile-web-app-title" content="Babyora" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- FOUC-guard: les persistert theme-mode FØR React/CSS laster og
         sett data-theme="light|dark" på <html>. "auto" → ingen attributt,
         media-query tar over. Wrappet i try/catch så korrupt JSON aldri
         kræsjer initial render. Holdes synkront med theme-store.ts. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('babyora.theme');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var mode = parsed && parsed.state && parsed.state.mode;
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
        } catch (e) {
          /* swallow — auto-mode er trygg default */
        }
      })();
    </script>
    <!-- ÅPNINGSFLATEN (åpningskontrakt-2026-08-01 §1 + §8).

         Kritisk CSS står HER, inline, med vilje: en ekstern stilfil laster
         etter første maling, og da har brukeren allerede sett en hvit
         skjerm. #root er tom til React mounter, så uten dette er det hvite
         glimtet uunngåelig.

         Per §1: ren lerretsflate + ordmerket, VENSTREJUSTERT på det
         globale gridet. Aldri panel, aldri maskot — Apple HIG «Launching».

         Per §8: oppstart forsinkes ALDRI kunstig. Flaten har ingen timer;
         den fjernes i det appen har malt sin første ekte frame. Er appen
         rask, ser man den knapt — og det er riktig. -->
    <style>
      #launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        /* Venstrejustert, ikke sentrert — samme ankring som ordmerket har
           i onboarding og på Hjem, slik at det ikke hopper ved overlevering. */
        padding-inline-start: max(24px, env(safe-area-inset-left, 0px) + 24px);
        background: #1E140C;
        color: #F1E9DA;
        transition: opacity 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      @media (prefers-color-scheme: light) {
        #launch { background: #F9F5EB; color: #2A1D12; }
      }
      /* Temavelgeren stemples på <html> av FOUC-vakten over, og må vinne
         over medieforespørselen i BEGGE retninger. */
      :root[data-theme="dark"] #launch { background: #1E140C; color: #F1E9DA; }
      :root[data-theme="light"] #launch { background: #F9F5EB; color: #2A1D12; }

      /* Ordmerket materialiserer seg rolig. Appen brukes ved sovende barn
         (§3: lydløs oppstart) — åpningen skal være like stille visuelt.
         Ingen sprett, ingen skalering: opacity og 6 px løft, samme verdi
         som panelet setter seg med i §2. */
      #launch svg {
        width: min(58vw, 232px);
        height: auto;
        opacity: 0;
        transform: translateY(6px);
        animation: launch-inn 520ms cubic-bezier(0.22, 1, 0.36, 1) 60ms forwards;
      }
      @keyframes launch-inn {
        to { opacity: 1; transform: translateY(0); }
      }

      /* Monter-lyset kommer fra øvre venstre — også her. En svak varm
         glød i samme retning, så åpningen tilhører samme rom som Hjem.
         Dekorativ og pekerfri; den skal aldri ta et trykk. */
      #launch::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(72% 52% at 26% 16%,
          rgba(242, 192, 138, 0.10) 0%, transparent 62%);
        opacity: 0;
        animation: launch-lys 900ms ease-out 120ms forwards;
      }
      @keyframes launch-lys { to { opacity: 1; } }

      #launch[data-ferdig="true"] { opacity: 0; pointer-events: none; }

      /* Redusert bevegelse: ingen forflytning, ingen glød som toner inn.
         Ordmerket er der med én gang, og flaten forsvinner med ren opacity. */
      @media (prefers-reduced-motion: reduce) {
        #launch, #launch svg, #launch::before {
          animation: none !important;
          transition-duration: 100ms;
        }
        #launch svg { opacity: 1; transform: none; }
        #launch::before { opacity: 1; }
      }
    </style>
    <title>Babyora</title>
    <!-- T9A fontberedskap (aapningskontrakt §4): preload av NØYAKTIG de
         woff2-filene appen bruker — variable latin-subset self-hostet i
         public/fonts/ med stabile navn (deklarert i src/styles/fonts.css).
         crossorigin er påkrevd for font-preload (anonym modus) — uten den
         dobbeltlastes fonten. Dekker Schibsted Grotesk (alt UI, vekter
         400–700+650) og Fraunces (temperatur-hero 550, arktitler 560). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/schibsted-grotesk-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/fraunces-latin-wght-normal.woff2"
    />

         CDN er fjernet for raskere cold start + offline-feel (Capacitor). -->
