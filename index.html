<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E140C" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F9F5EB" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="Babyora — norsk påkledningsapp for foreldre med barn 0–3 år. Vær, aktivitet og ull-lag i ett."
    />
    <meta name="apple-mobile-web-app-title" content="Babyora" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Les persistert tema før React og ekstern CSS laster. Holdes synkront
         med theme-store.ts, slik at første frame får riktig lerretsfarge. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get('launch-preview') === 'slow') {
            root.setAttribute('data-launch-preview', 'slow');
            var syncPreviewPlayback = function () {
              if (document.hidden) {
                root.setAttribute('data-launch-preview-paused', 'true');
              } else {
                root.removeAttribute('data-launch-preview-paused');
              }
            };
            document.addEventListener('visibilitychange', syncPreviewPlayback);
            syncPreviewPlayback();
          }
        } catch (e) {
          /* query-preview er kun et designverktøy; normal launch fortsetter */
        }

        try {
          var raw = localStorage.getItem('babyora.theme');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var mode = parsed && parsed.state && parsed.state.mode;
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
        } catch (e) {
          /* auto-tema er trygg fallback */
        }
      })();
    </script>

    <!-- ÅPNINGSFLATEN — eier-override 2026-08-08.

         Avatar, delvis skyet-vær og Babyora-skilt danner én sentrert signatur
         på et helt rolig lerret. Ingen ekstra slagord, lastingstekst eller
         dekorativ bakgrunn. Flaten har ingen visningstimer og slipper så
         snart React har malt sin første ekte frame. -->
    <style>
      #launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding:
          max(24px, env(safe-area-inset-top, 0px))
          max(20px, env(safe-area-inset-right, 0px))
          max(24px, env(safe-area-inset-bottom, 0px))
          max(20px, env(safe-area-inset-left, 0px));
        overflow: hidden;
        background: #1E140C;
        transition: opacity 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .launch-signature {
        --launch-optical-y: -1.74vmax;
        width: min(38.07vmax, 88vw, 360px);
        transform: translateY(var(--launch-optical-y));
      }

      .launch-hero {
        position: relative;
        width: 100%;
        aspect-ratio: 980 / 860;
        overflow: hidden;
      }

      .launch-signboard {
        position: absolute;
        z-index: 0;
        left: 0;
        top: 70.93%;
        width: 100%;
        height: 29.07%;
        opacity: 0;
        animation: launch-signboard-in 360ms cubic-bezier(0.22, 1, 0.36, 1) 20ms both;
      }

      .launch-signboard::before {
        content: '';
        position: absolute;
        left: 0.102%;
        top: 1.6%;
        width: 99.796%;
        height: 88%;
        box-sizing: border-box;
        border: 1px solid rgb(242 192 138 / 42%);
        border-radius: 3.7% / 16%;
        background: #9E5529;
        box-shadow:
          0 8px 18px rgb(19 11 6 / 28%),
          inset 0 1px 0 rgb(247 213 178 / 22%);
      }

      .launch-signboard img {
        position: absolute;
        z-index: 1;
        left: 26.531%;
        top: 38%;
        display: block;
        width: 46.939%;
        height: auto;
      }

      .launch-avatar,
      .launch-hand {
        position: absolute;
        left: 0;
        top: 0;
        width: 91.837%;
        height: 83.605%;
        opacity: 0;
        animation: launch-avatar-in 480ms cubic-bezier(0.22, 1, 0.36, 1) 100ms both;
      }

      .launch-avatar { z-index: 1; }

      .launch-hand {
        z-index: 3;
        clip-path: polygon(
          91.667% 74.409%,
          100% 70.932%,
          100% 100%,
          88.889% 100%,
          87.778% 89.013%
        );
        pointer-events: none;
      }

      .launch-avatar img,
      .launch-hand img {
        position: absolute;
        left: -8.598%;
        top: -9.623%;
        width: 115.888%;
        height: auto;
      }

      /* Samme pikselgeometri som den native kompositten: været males over
         armen, mens et smalt håndlag legger fingertuppene tilbake foran.
         Rammene tilsvarer synlige alpha-flater; originalenes transparente
         luft korrigeres på de indre bildene. */
      .launch-weather {
        position: absolute;
        z-index: 2;
        left: 75%;
        top: 51.744%;
        width: 21.429%;
        height: 18.256%;
        pointer-events: none;
        opacity: 0;
        animation: launch-weather-in 420ms cubic-bezier(0.22, 1, 0.36, 1) 180ms both;
      }

      .launch-weather img {
        position: absolute;
        left: -23.21%;
        top: -43.84%;
        width: 146.74%;
        height: auto;
      }

      @media (prefers-color-scheme: light) {
        #launch { background: #F9F5EB; }
      }

      :root[data-theme="dark"] #launch { background: #1E140C; }
      :root[data-theme="light"] #launch { background: #F9F5EB; }

      @keyframes launch-signboard-in {
        from { opacity: 0; transform: translateY(5px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes launch-avatar-in {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes launch-weather-in {
        from { opacity: 0; transform: translateY(-7px) scale(0.94); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Design-review, aldri vanlig appstart. `?launch-preview=slow` spiller
         den samme lagrekkefølgen i en rolig 5,2 s loop: skilt → barn → vær. */
      :root[data-launch-preview="slow"] #launch { transition: none; }

      :root[data-launch-preview="slow"] .launch-signboard {
        animation: launch-preview-signboard 5200ms linear infinite both;
      }

      :root[data-launch-preview="slow"] .launch-avatar,
      :root[data-launch-preview="slow"] .launch-hand {
        animation: launch-preview-avatar 5200ms linear infinite both;
      }

      :root[data-launch-preview="slow"] .launch-weather {
        animation: launch-preview-weather 5200ms linear infinite both;
      }

      :root[data-launch-preview="slow"][data-launch-preview-paused="true"] .launch-signboard,
      :root[data-launch-preview="slow"][data-launch-preview-paused="true"] .launch-avatar,
      :root[data-launch-preview="slow"][data-launch-preview-paused="true"] .launch-hand,
      :root[data-launch-preview="slow"][data-launch-preview-paused="true"] .launch-weather {
        animation-play-state: paused;
      }

      @keyframes launch-preview-signboard {
        0%, 4% { opacity: 0; transform: translateY(10px) scale(0.98); }
        4% { animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        22% { opacity: 1; transform: translateY(0) scale(1); }
        84% {
          opacity: 1;
          transform: translateY(0) scale(1);
          animation-timing-function: cubic-bezier(0.4, 0, 1, 1);
        }
        94%, 100% { opacity: 0; transform: translateY(0) scale(1); }
      }

      @keyframes launch-preview-avatar {
        0%, 20% { opacity: 0; transform: translateY(-14px); }
        20% { animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        44% { opacity: 1; transform: translateY(0); }
        84% {
          opacity: 1;
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0.4, 0, 1, 1);
        }
        94%, 100% { opacity: 0; transform: translateY(0); }
      }

      @keyframes launch-preview-weather {
        0%, 43% { opacity: 0; transform: translateY(-18px) scale(0.88); }
        43% { animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        66% { opacity: 1; transform: translateY(0) scale(1); }
        84% {
          opacity: 1;
          transform: translateY(0) scale(1);
          animation-timing-function: cubic-bezier(0.4, 0, 1, 1);
        }
        94%, 100% { opacity: 0; transform: translateY(0) scale(1); }
      }

      #launch[data-ferdig="true"] { opacity: 0; pointer-events: none; }

      @media (prefers-reduced-motion: reduce) {
        #launch { transition-duration: 100ms; }
        .launch-signboard,
        .launch-avatar,
        .launch-hand,
        .launch-weather {
          animation: none;
          opacity: 1;
          transform: none;
        }

        :root[data-launch-preview="slow"] .launch-signboard,
        :root[data-launch-preview="slow"] .launch-avatar,
        :root[data-launch-preview="slow"] .launch-hand,
        :root[data-launch-preview="slow"] .launch-weather {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
    <title>Babyora</title>

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/schibsted-grotesk-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/fraunces-latin-wght-normal.woff2"
    />
    <!-- Bildene ligger i HTTP-cachen før Capacitor skjuler native splash. -->
    <link rel="preload" as="image" type="image/webp" href="/monter/maskot-resultat-sveip.webp" />
    <link rel="preload" as="image" type="image/webp" href="/monter/vaer-delvis-skyet.webp" />
    <link
      rel="preload"
      as="image"
      type="image/svg+xml"
      href="/brand/babyora-wordmark-reverse.svg"
    />
  </head>
  <body>
    <a href="#main" class="skip-link">Hopp til hovedinnhold</a>
    <!-- Fjernes av launch-handoff.ts når React har malt første ekte frame. -->
    <div id="launch" aria-hidden="true">
      <div class="launch-signature" data-launch-signature>
        <div class="launch-hero" data-launch-hero>
          <div class="launch-signboard" data-launch-signboard>
            <img
              src="/brand/babyora-wordmark-reverse.svg"
              alt=""
              draggable="false"
              data-launch-wordmark
            />
          </div>
          <div class="launch-weather" data-launch-weather>
            <img
              src="/monter/vaer-delvis-skyet.webp"
              alt=""
              draggable="false"
            />
          </div>
          <div class="launch-avatar" data-launch-avatar>
            <img
              src="/monter/maskot-resultat-sveip.webp"
              alt=""
              draggable="false"
            />
          </div>
          <div class="launch-hand" data-launch-hand>
            <img
              src="/monter/maskot-resultat-sveip.webp"
              alt=""
              draggable="false"
            />
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
