# Codemagic CI/CD for Babyora
# Gjenbruker mønster fra Ryddy + StrikeArc.
#
# Krever at Sivert kobler følgende i Codemagic UI før første grønne build:
# 1. Apple Developer-konto → Code signing identities (App Store distribution cert)
# 2. App Store Connect API key (for automatisk TestFlight-opplasting)
# 3. Google Play service account JSON (for Play Internal-opplasting)
# 4. Android keystore (upload + signing — kan gjenbrukes fra Ryddy)
#
# Workflow-trigger: push til main bygger og publiserer både iOS og Android
# som DRAFT (intern testing). Ingenting går automatisk til offentlig release.

workflows:
  ios-internal:
    name: Babyora iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ryddy-asc-key # eksisterende key (JQVPW4D944), brukt av Ryddy/StrikeArc
    environment:
      # 2026-06-12 (Sivert + Claude kontroll-runde): byttet fra ios_signing-blokk
      # til fetch-signing-files-pattern fordi babyora_distribution-cert ble
      # revoked/expired (build #20 + #21 feilet). Auto-generering via ASC API
      # eliminerer manuelt cert-vedlikehold — samme pattern som StrikeArc/Swinglab.
      groups:
        # klemeg_revenuecat er en TEAM-nivå-gruppe (VITE_REVENUECAT-nøklene).
        # IKKE legg til egne app-nivå-grupper på babyora-appen: appens egne
        # grupper SKYGGER for team-gruppene, og da slutter klemeg_revenuecat
        # å resolve (bevist av bygg 6a6e5762, «unknown variable group»).
        - klemeg_revenuecat   # VITE_REVENUECAT_PUBLIC_KEY_IOS, VITE_REVENUECAT_PUBLIC_KEY_ANDROID
      vars:
        XCODE_PROJECT: 'ios/App/App.xcodeproj'
        XCODE_SCHEME: 'App'
        BUNDLE_ID: 'no.klemeg.app'
        WIDGET_BUNDLE_ID: 'no.klemeg.app.widget'
        APP_STORE_APPLE_ID: '6776416135' # Babyora ASC-record; legacy bundle ID retained for continuity
        # Native (Capacitor) har ingen server på app-origin → met.no-proxyen
        # må peke på den absolutte Vercel-funksjonen. Web bruker relativ /api.
        VITE_FORECAST_PROXY: 'https://wool-app.vercel.app/api/forecast'
      node: 22
    # Warm-cache strategy: dependency downloads are the only safe, reusable
    # part of a TestFlight archive on ephemeral builders. Enable Dependency
    # caching once in Codemagic UI for this workflow to activate these paths.
    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/org.swift.swiftpm
        - $CM_BUILD_DIR/SourcePackages
    # BYGG BARE NAAR DET FINNES NOE A SE (eier 2026-08-04: «er det nodvendig
    # a starte nye bygg hver gang?»). Nei. Hver push til main startet for et
    # fullt iOS-bygg og en TestFlight-opplasting — ti bygg pa en dag med
    # designsystem-arbeid som ikke endrer noe synlig i appen.
    #
    # Na bygges det kun paa TAG. Slik lager du et bygg naar du vil ha et:
    #   git tag v1.0.12 && git push origin v1.0.12
    # Det gjor hvert bygg til en bevisst handling med et versjonsnummer,
    # i stedet for en bivirkning av a lagre arbeid.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          # npm bruker fortsatt sin lokale cache, men får revalidere metadata
          # mot registret. `--prefer-offline` ga ETARGET i Codemagic selv om
          # word-wrap@1.2.5 finnes i npm-registret.
          npm ci --no-audit
      - name: Verifiser env-keys (RevenueCat)
        script: |
          if [ -z "$VITE_REVENUECAT_PUBLIC_KEY_IOS" ]; then
            echo "ADVARSEL: VITE_REVENUECAT_PUBLIC_KEY_IOS er ikke satt. Build fortsetter med localStorage-mock."
          fi
      - name: Clean web + Capacitor cache
        script: |
          rm -rf dist
          rm -rf ios/App/App/public
      # Lar INTERNE bygg gaa igjennom, men skriver ut hva som gjenstaar.
      # Med LANSERING=1 i miljoet nekter steget i stedet. Flagget settes
      # naar det bygges for butikk — da kan widget-spike-panelet og alt
      # annet paa listen ikke bli med. Se filhodet i skriptet.
      - name: Verifiser lanseringsklar
        script: |
          node tools/verify-lanseringsklar.mjs
      - name: Build web
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      # P9.2 widget-target-injection FJERNET fra CI etter build #35-feil:
      # xcodeproj-Ruby-scriptet ga 'Unexpected duplicate tasks' og tomme
      # product-paths. scripts/add-widget-target.rb beholdes som referanse.
      #
      # Native spike (2026-08-06): widget-targetet BabyoraWidgetExtension er
      # nå lagt DIREKTE inn i project.pbxproj (håndredigert, ikke script).
      # Krever at App Groups-capability (group.no.klemeg.app) er aktivert på
      # BÅDE no.klemeg.app og no.klemeg.app.widget i developer.apple.com →
      # Identifiers, ellers feiler provisioning på entitlements.
      - name: Set build number + marketing version
        script: |
          cd ios/App
          # Codemagic-appen ble opprettet på nytt og dens interne BUILD_NUMBER
          # startet derfor på 1. Hent i stedet siste TestFlight-nummer fra Apple,
          # slik at serien fortsetter etter eksisterende bygg (157, 158, ...).
          NEXT_TESTFLIGHT_BUILD=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          agvtool new-version -all "$NEXT_TESTFLIGHT_BUILD"
          agvtool new-marketing-version 1.0.11
      - name: Initialize keychain
        script: |
          # Uten dette feiler codesign med errSecInternalComponent
          # senere i Build IPA (build #22 demonstrert).
          keychain initialize
      - name: Generate certificate private key
        script: |
          set -ex
          # fetch-signing-files --create trenger en privatnøkkel via
          # --certificate-key. Genereres per bygg. (En stabil nøkkel via
          # variabelgruppe ble forsøkt 2026-08-01, men klemeg_revenuecat er
          # en TEAM-nivå-gruppe som API-et ikke kan skrive til, og egne
          # app-nivå-grupper SKYGGER for team-gruppene — se bygg 6a6e5762.)
          openssl genrsa -out /tmp/cert_private_key.pem 2048
      - name: Fetch signing files (create cert + profile if missing)
        script: |
          set -ex
          # ASC API auto-genererer cert + provisioning profile og laster
          # begge ned til builderen. Fersk nøkkel per bygg betyr at det
          # opprettes et NYTT distribusjonssertifikat hver gang — Apple har
          # tak på 2, så ved 409 slettes det eldste foreldreløse CI-certet
          # (alle distribusjonscerts i kontoen er CI-genererte engangs-
          # nøkler) og forsøket gjentas. Sertifikatpoolen roterer dermed
          # selvhelbredende på taket. NB: certs er type DISTRIBUTION
          # (Apples universelle), IKKE IOS_DISTRIBUTION — feil filter gir
          # tom liste (bevist av bygg 6a6e589d).
          # Native spike (2026-08-06): widget-extension trenger EGEN
          # provisioning profile (no.klemeg.app.widget) — hentes/opprettes
          # i samme steg slik at use-profiles finner begge.
          fetch() {
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --certificate-key=@file:/tmp/cert_private_key.pem \
              --type IOS_APP_STORE \
              --create \
              --verbose
            app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
              --certificate-key=@file:/tmp/cert_private_key.pem \
              --type IOS_APP_STORE \
              --create \
              --verbose
          }
          if ! fetch; then
            OLDEST=$(app-store-connect certificates list \
              --type DISTRIBUTION --json \
              | python3 -c 'import sys,json;c=json.load(sys.stdin);c.sort(key=lambda x:x["attributes"]["expirationDate"]);print(c[0]["id"] if c else "")')
            if [ -n "$OLDEST" ]; then
              echo "Sert-tak nådd — sletter eldste foreldreløse cert: $OLDEST"
              app-store-connect certificates delete "$OLDEST"
            fi
            fetch
          fi
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Unlock keychain for non-interactive codesign
        script: |
          set -ex
          # Fix for errSecInternalComponent på SPM-resource-bundles
          # (RevenueCat_RevenueCat.bundle) — codesign trenger non-interactive
          # tilgang til private key uten password-prompt.
          KEYCHAIN_PATH=$(security list-keychains -d user | head -1 | tr -d '"' | xargs)
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "" \
            "$KEYCHAIN_PATH" || echo "set-key-partition-list ikke nødvendig (eldre keychain)"
      - name: Apply signing profiles to Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          # 2026-07-16: FJERNET --archive-flags=CODE_SIGNING_ALLOWED_FOR_EXTENSIONS_AND_FRAMEWORKS=NO.
          # Prosjektet er SPM-basert → RevenueCat + Capacitor-plugins lenkes som
          # DYNAMISKE frameworks som dyld laster ved oppstart. Det brede flagget
          # kunne etterlate dem usignert, som gir "code signature invalid" launch-
          # krasj på ekte enhet (ledende mistanke for TestFlight-krasjen). Den ekte
          # fiksen for errSecInternalComponent på RevenueCats resource-bundle er
          # keychain partition-list-steget lenger opp — ikke å droppe framework-
          # signering. Hvis .bundle-signering feiler igjen feiler BYGGET synlig
          # (ikke en bruker-krasj); da scoper vi CODE_SIGNING_ALLOWED=NO kun på
          # resource-bundle-targetet i stedet for hele framework-settet.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "-clonedSourcePackagesDirPath $CM_BUILD_DIR/SourcePackages"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false — manuell release først, etter feedback fra testere

  android-internal:
    name: Babyora Android · Play Internal
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - klemeg_keystore # opprettes i Codemagic UI med kode-signering for Play Store
      groups:
        - google_play          # service account JSON som CM_GOOGLE_PLAY_KEY_JSON
        - klemeg_revenuecat    # VITE_REVENUECAT_PUBLIC_KEY_IOS, VITE_REVENUECAT_PUBLIC_KEY_ANDROID
      vars:
        PACKAGE_NAME: 'no.klemeg.app'
      node: 22
      # Native spike (2026-08-06): Capacitor 8 genererer
      # sourceCompatibility 21 (capacitor.build.gradle) — java 17 ville
      # feilet i javac/kotlinc (jvmTarget 21).
      java: 21
    # Auto-trigger disabled inntil klemeg_keystore er opprettet i Codemagic UI.
    # Manuell trigger via Codemagic-dashboard fungerer fortsatt.
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      # Lar INTERNE bygg gaa igjennom, men skriver ut hva som gjenstaar.
      # Med LANSERING=1 i miljoet nekter steget i stedet. Flagget settes
      # naar det bygges for butikk — da kan widget-spike-panelet og alt
      # annet paa listen ikke bli med. Se filhodet i skriptet.
      - name: Verifiser lanseringsklar
        script: |
          node tools/verify-lanseringsklar.mjs
      - name: Build web
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Set build version
        script: |
          cd android
          ./gradlew bundleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName="1.0.11"
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $CM_GOOGLE_PLAY_KEY_JSON
        track: internal
        submit_as_draft: true # ny build går til Internal Testing som draft
