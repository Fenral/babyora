# Codemagic CI/CD for Babyora
# Gjenbruker mønster fra Ryddy + StrikeArc.
#
# Krever at Sivert kobler følgende i Codemagic UI før første grønne build:
# 1. Apple Developer-konto → Code signing identities (App Store distribution cert)
# 2. App Store Connect API key (for automatisk TestFlight-opplasting)
# 3. Google Play service account JSON (for Play Internal-opplasting)
# 4. Android keystore (upload + signing — kan gjenbrukes fra Ryddy)
#
# Workflow-trigger: push til main bygger og publiserer både iOS og Android
# som DRAFT (intern testing). Ingenting går automatisk til offentlig release.

workflows:
  ios-internal:
    name: Babyora iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ryddy-asc-key # eksisterende key (JQVPW4D944), brukt av Ryddy/StrikeArc
    environment:
      # 2026-06-12: byttet fra ios_signing-blokk til fetch-signing-files fordi
      # babyora_distribution-cert ble revoked/expired (build #20 + #21 feilet).
      #
      # 2026-07-25 (release-reparasjon, build #4-feil): den varianten genererte en
      # FERSK RSA-nøkkel per bygg og kjørte fetch-signing-files --create. Ingen
      # eksisterende sertifikat matcher en fersk nøkkel, så hvert bygg ba Apple om
      # et NYTT Apple Distribution-sertifikat. Apple tillater maks 2-3 aktive, og
      # returnerte til slutt 409 ("already an active or pending certificate
      # request"). Fiksen er å persistere ÉN privatnøkkel som matcher ÉT
      # gjenbrukbart sertifikat — se gruppen klemeg_ios_signing under.
      groups:
        - klemeg_revenuecat   # VITE_REVENUECAT_PUBLIC_KEY_IOS, VITE_REVENUECAT_PUBLIC_KEY_ANDROID
        # klemeg_ios_signing må opprettes i Codemagic UI (Environment variables)
        # med ÉN secure variabel:
        #   CERTIFICATE_PRIVATE_KEY = PEM-privatnøkkelen som hører til det
        #   Apple Distribution-sertifikatet Babyora skal signere med.
        # Nøkkelen ligger KUN i Codemagic (secure), aldri i Git.
        - klemeg_ios_signing  # CERTIFICATE_PRIVATE_KEY (secure)
      vars:
        XCODE_PROJECT: 'ios/App/App.xcodeproj'
        XCODE_SCHEME: 'App'
        BUNDLE_ID: 'no.klemeg.app'
        WIDGET_BUNDLE_ID: 'no.klemeg.app.widget'
        APP_STORE_APPLE_ID: '6776416135' # Babyora ASC-record; legacy bundle ID retained for continuity
        # Native (Capacitor) har ingen server på app-origin → met.no-proxyen
        # må peke på den absolutte Vercel-funksjonen. Web bruker relativ /api.
        VITE_FORECAST_PROXY: 'https://wool-app.vercel.app/api/forecast'
      node: 22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Verifiser env-keys (RevenueCat)
        script: |
          if [ -z "$VITE_REVENUECAT_PUBLIC_KEY_IOS" ]; then
            echo "ADVARSEL: VITE_REVENUECAT_PUBLIC_KEY_IOS er ikke satt. Build fortsetter med localStorage-mock."
          fi
      - name: Clean web + Capacitor cache
        script: |
          rm -rf dist
          rm -rf ios/App/App/public
      - name: Build web
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      # P9.2 widget-target-injection FJERNET fra CI etter build #35-feil:
      # xcodeproj-Ruby-scriptet ga 'Unexpected duplicate tasks' og tomme
      # product-paths. Widget-target legges til på Mac av widget-sesjonen
      # (feature/widget-ios) med Xcode-GUI istedenfor xcodeproj-gem.
      # scripts/add-widget-target.rb beholdes som referanse i repoet.
      - name: Set build number + marketing version
        script: |
          cd ios/App
          # Codemagic-appen ble opprettet på nytt og dens interne BUILD_NUMBER
          # startet derfor på 1. Hent i stedet siste TestFlight-nummer fra Apple,
          # slik at serien fortsetter etter eksisterende bygg (157, 158, ...).
          NEXT_TESTFLIGHT_BUILD=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          agvtool new-version -all "$NEXT_TESTFLIGHT_BUILD"
          agvtool new-marketing-version 1.0.11
      - name: Initialize keychain
        script: |
          # Uten dette feiler codesign med errSecInternalComponent
          # senere i Build IPA (build #22 demonstrert).
          keychain initialize
      - name: Verify persistent signing key is present
        script: |
          # Bevisst UTEN 'set -x': privatnøkkelen må aldri havne i byggloggen.
          set -e
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "FEIL: CERTIFICATE_PRIVATE_KEY er ikke satt."
            echo "Opprett env-gruppen 'klemeg_ios_signing' i Codemagic med denne"
            echo "secure variabelen (PEM-nøkkelen til Babyoras Apple Distribution-"
            echo "sertifikat). Uten den ville bygget be Apple om et nytt sertifikat"
            echo "for hvert kjør, og treffe 409-taket igjen."
            exit 1
          fi
          echo "CERTIFICATE_PRIVATE_KEY er satt (verdi ikke logget)."
      - name: List existing distribution certificates (diagnostikk)
        script: |
          set -e
          # Kun offentlig metadata (navn, utløp, serienummer) — ingen nøkler.
          # Gjør et framtidig 409 diagnoserbart direkte fra byggloggen.
          app-store-connect list-certificates --type IOS_DISTRIBUTION || \
            echo "Kunne ikke liste sertifikater (ikke-fatalt)."
      - name: Fetch signing files (gjenbruk eksisterende sertifikat)
        script: |
          set -e
          # app-store-connect leser CERTIFICATE_PRIVATE_KEY fra miljøet som
          # default for --certificate-key. Nøkkelen sendes derfor IKKE som
          # argument (ville kunne lekke i loggen).
          #
          # Med en persistent nøkkel matcher fetch-signing-files det EKSISTERENDE
          # sertifikatet og laster det ned. --create oppretter da kun manglende
          # provisioning profile — ikke et nytt sertifikat per bygg.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Unlock keychain for non-interactive codesign
        script: |
          set -ex
          # Fix for errSecInternalComponent på SPM-resource-bundles
          # (RevenueCat_RevenueCat.bundle) — codesign trenger non-interactive
          # tilgang til private key uten password-prompt.
          KEYCHAIN_PATH=$(security list-keychains -d user | head -1 | tr -d '"' | xargs)
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "" \
            "$KEYCHAIN_PATH" || echo "set-key-partition-list ikke nødvendig (eldre keychain)"
      - name: Apply signing profiles to Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          # 2026-07-16: FJERNET --archive-flags=CODE_SIGNING_ALLOWED_FOR_EXTENSIONS_AND_FRAMEWORKS=NO.
          # Prosjektet er SPM-basert → RevenueCat + Capacitor-plugins lenkes som
          # DYNAMISKE frameworks som dyld laster ved oppstart. Det brede flagget
          # kunne etterlate dem usignert, som gir "code signature invalid" launch-
          # krasj på ekte enhet (ledende mistanke for TestFlight-krasjen). Den ekte
          # fiksen for errSecInternalComponent på RevenueCats resource-bundle er
          # keychain partition-list-steget lenger opp — ikke å droppe framework-
          # signering. Hvis .bundle-signering feiler igjen feiler BYGGET synlig
          # (ikke en bruker-krasj); da scoper vi CODE_SIGNING_ALLOWED=NO kun på
          # resource-bundle-targetet i stedet for hele framework-settet.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false — manuell release først, etter feedback fra testere

  android-internal:
    name: Babyora Android · Play Internal
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - klemeg_keystore # opprettes i Codemagic UI med kode-signering for Play Store
      groups:
        - google_play          # service account JSON som CM_GOOGLE_PLAY_KEY_JSON
        - klemeg_revenuecat    # VITE_REVENUECAT_PUBLIC_KEY_IOS, VITE_REVENUECAT_PUBLIC_KEY_ANDROID
      vars:
        PACKAGE_NAME: 'no.klemeg.app'
      node: 22
      java: 17
    # Auto-trigger disabled inntil klemeg_keystore er opprettet i Codemagic UI.
    # Manuell trigger via Codemagic-dashboard fungerer fortsatt.
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Set build version
        script: |
          cd android
          ./gradlew bundleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName="1.0.11"
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $CM_GOOGLE_PLAY_KEY_JSON
        track: internal
        submit_as_draft: true # ny build går til Internal Testing som draft
