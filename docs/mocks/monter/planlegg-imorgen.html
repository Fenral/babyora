<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<title>Babyora Planlegg — I morgen (Monter)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,550&display=swap" rel="stylesheet" />
<style>
  :root {
    --dw-canvas: #1E140C;
    --dw-canvas-glow: #2B1D11;
    --dw-panel: #113B3E;
    --dw-raised: #2C1F13;
    --dw-ink-hi: #F1E9DA;
    --dw-ink-mid: #CDC0AB;
    --dw-ink-low: #A79A82;
    --dw-accent: #D98E5A;
    --dw-accent-pressed: #C57C46;
    --dw-ink-on-accent: #2A1708;
    --dw-edge-light: #F2C08A;
    --dw-focus: #E8B98C;
    --dw-w-rain: #0D3037;
    --dw-hairline: rgba(241, 233, 218, 0.12);
    --dw-r-pill: 999px;
    --dw-font-ui: 'Schibsted Grotesk', system-ui, sans-serif;
    --dw-font-hero: 'Fraunces', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  :focus-visible { outline: 2px solid var(--dw-focus); outline-offset: 3px; border-radius: 4px; }
  body { background: #0A0705; display: grid; place-items: center; min-height: 100vh; padding: 20px; }

  .stage {
    width: 390px; height: 844px;
    background: linear-gradient(168deg, var(--dw-canvas-glow) 0%, var(--dw-canvas) 46%);
    color: var(--dw-ink-hi);
    font-family: var(--dw-font-ui);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .top { padding: 52px 24px 0; }
  h1 { font-size: 26px; font-weight: 750; letter-spacing: -0.015em; }
  .ctx { font-size: 14px; color: var(--dw-ink-low); margin-top: 3px; }

  .seg {
    display: flex; background: rgba(241, 233, 218, 0.09);
    border-radius: var(--dw-r-pill); padding: 4px;
    margin: 12px 24px 0;
  }
  .seg button {
    flex: 1; border: 0; background: transparent;
    font-family: inherit; font-size: 14.5px; font-weight: 650;
    color: var(--dw-ink-mid); padding: 10px 0; min-height: 44px;
    border-radius: var(--dw-r-pill); cursor: pointer;
  }
  .seg button.on { background: var(--dw-ink-hi); color: var(--dw-canvas); }

  /* Morgendagens vær: petrol-instrument (regn-nyanse) */
  .hero {
    position: relative;
    margin: 14px 20px 0;
    background: var(--dw-w-rain);
    border-radius: 20px;
    padding: 16px 18px 14px;
    box-shadow: 0 16px 36px -18px rgba(0, 0, 0, 0.55);
  }
  .hero::before {
    content: ""; position: absolute; top: 0; left: 7%; right: 7%; height: 1.5px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--dw-edge-light), transparent);
    opacity: 0.9;
  }
  .h-day { font-size: 13.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #C6CFC4; }
  .h-row { display: flex; align-items: baseline; gap: 12px; margin-top: 6px; }
  .h-temp { font-family: var(--dw-font-hero); font-size: 50px; line-height: 1; font-weight: 550; font-variant-numeric: lining-nums tabular-nums; }
  .h-desc { font-size: 15px; font-weight: 600; }
  .h-meta { font-size: 13.5px; color: #DCD8C8; margin-top: 5px; }

  /* Forberedelses-widgeten: hevet flate med lyslogikk (dybdedoktrinen) */
  .prep {
    position: relative;
    margin: 13px 20px 0;
    background: var(--dw-raised);
    border-radius: 20px;
    padding: 18px 18px 14px;
    box-shadow: 0 1px 0 rgba(242, 192, 138, 0.14) inset, 0 16px 34px -18px rgba(0, 0, 0, 0.6);
  }
  .prep::before {
    content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1.5px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--dw-edge-light), transparent);
    opacity: 0.55;
  }
  .p-label { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dw-ink-low); }
  .p-head { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin-top: 6px; }
  .p-sub { font-size: 14px; color: var(--dw-ink-mid); margin-top: 4px; line-height: 1.5; }

  .p-thumbs { display: flex; gap: 10px; margin-top: 14px; }
  .p-thumb {
    width: 54px; height: 54px; border-radius: 12px;
    object-fit: cover; background: #3A2A1A;
    border: 1px solid rgba(242, 192, 138, 0.16);
    box-shadow: 0 1px 0 rgba(242, 192, 138, 0.22) inset, 0 6px 12px -6px rgba(0, 0, 0, 0.55);
  }
  .p-more {
    width: 54px; height: 54px; border-radius: 12px;
    display: grid; place-items: center;
    background: rgba(241, 233, 218, 0.07);
    border: 1px dashed rgba(241, 233, 218, 0.2);
    color: var(--dw-ink-mid); font-size: 13px; font-weight: 700;
  }
  .p-cta {
    margin-top: 14px; border: 0; border-radius: 12px; width: 100%;
    background: var(--dw-accent); color: var(--dw-ink-on-accent);
    font-family: inherit; font-size: 15.5px; font-weight: 700;
    padding: 12px 18px; min-height: 48px;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    cursor: pointer;
    box-shadow: 0 10px 22px -12px rgba(0, 0, 0, 0.55);
  }
  .p-cta:active { background: var(--dw-accent-pressed); transform: translateY(1px); }
  .p-cta svg { width: 17px; height: 17px; }

  /* Neste uke: kompakt avvik PA hevet flate (dybdedoktrinen D1) */
  .week { margin: 12px 20px 0; flex: 1; }
  .week-surface {
    position: relative;
    background: var(--dw-raised);
    border-radius: 20px;
    padding: 4px 16px 10px;
    margin-top: 10px;
    box-shadow: 0 1px 0 rgba(242, 192, 138, 0.14) inset, 0 12px 26px -16px rgba(0, 0, 0, 0.6);
  }
  .week-surface::before {
    content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1.5px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--dw-edge-light), transparent);
    opacity: 0.55;
  }
  .w-label { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dw-ink-low); }
  .w-row {
    display: flex; align-items: center; gap: 12px;
    width: 100%; border: 0; background: none; font-family: inherit; color: inherit;
    text-align: left; cursor: pointer;
    padding: 11px 0; min-height: 62px;
  }
  .w-row + .w-row { border-top: 1px solid var(--dw-hairline); }
  .w-row:active { background: rgba(241, 233, 218, 0.04); }
  .w-day { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--dw-ink-low); min-width: 34px; }
  .w-text { flex: 1; }
  .w-what { font-size: 15px; font-weight: 650; display: block; }
  .w-why { font-size: 12.5px; color: var(--dw-ink-low); display: block; margin-top: 1px; }
  .w-chev { width: 15px; height: 15px; color: var(--dw-ink-low); flex: none; }
  .w-quiet { font-size: 13.5px; color: var(--dw-ink-low); padding: 11px 0 2px; line-height: 1.5; border-top: 1px solid var(--dw-hairline); }

  .tabs { border-top: 1px solid var(--dw-hairline); display: flex; justify-content: space-around; padding: 8px 10px 4px; }
  .tab { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dw-ink-low); min-width: 74px; padding: 4px 0; }
  .tab.on { color: var(--dw-ink-hi); }
  .tab svg { width: 22px; height: 22px; }
  .tab span { font-size: 12px; font-weight: 600; }
  .homebar { width: 128px; height: 5px; border-radius: 3px; background: rgba(241, 233, 218, 0.28); margin: 6px auto 8px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="top">
      <h1>Planlegg</h1>
      <p class="ctx">Lillian · Trondheim</p>
    </div>

    <div class="seg" role="radiogroup" aria-label="Dag">
      <button type="button" role="radio" aria-checked="false">I dag</button>
      <button class="on" type="button" role="radio" aria-checked="true">I morgen</button>
    </div>

    <section class="hero" aria-label="Været i morgen">
      <span class="h-day">Fredag 1. august</span>
      <div class="h-row">
        <span class="h-temp">7°</span>
        <span class="h-desc">Regn fra kl. 12</span>
      </div>
      <p class="h-meta">Føles som 4° · Vind 5 m/s</p>
    </section>

    <section class="prep" aria-label="Forberedelse til i morgen">
      <h2 class="p-head">Ha ull, fleece og regntøy klart</h2>
      <p class="p-sub">Mer beskyttelse enn i dag. Legg også regnvotter og ekstra sokker i sekken.</p>
      <div class="p-thumbs">
        <img class="p-thumb" src="p1.png" alt="Tynn lue" />
        <img class="p-thumb" src="p2.png" alt="Kortermet ullbody" />
        <img class="p-thumb" src="p3.png" alt="Regndress" />
        <span class="p-more" aria-label="Fire plagg til">+4</span>
      </div>
      <button class="p-cta" type="button">
        Se hele antrekket
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </section>

    <section class="week" aria-label="Neste uke">
      <span class="w-label">Neste uke</span>
      <div class="week-surface">
      <button class="w-row" type="button">
        <span class="w-day">Tir</span>
        <span class="w-text">
          <span class="w-what">Kaldere, mot −2°</span>
          <span class="w-why">Vinterdress og votter kommer inn igjen</span>
        </span>
        <svg class="w-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="w-row" type="button">
        <span class="w-day">Tor</span>
        <span class="w-text">
          <span class="w-what">Mye regn hele dagen</span>
          <span class="w-why">Regndress og skiftetøy i sekken</span>
        </span>
        <svg class="w-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <p class="w-quiet">Resten av uka ligner på i morgen.</p>
      </div>
    </section>

    <nav class="tabs" aria-label="Hovednavigasjon">
      <a class="tab" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg><span>Hjem</span></a>
      <a class="tab on" href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg><span>Planlegg</span></a>
      <a class="tab" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 20c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="10" r="2.4"/><path d="M15.5 20c.4-2.2 1.6-3.6 3.3-3.9 1 .2 1.9.9 2.7 1.9"/></svg><span>Familie</span></a>
    </nav>
    <div class="homebar"></div>
  </div>
</body>
</html>
