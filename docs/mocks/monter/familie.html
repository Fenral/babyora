<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<title>Babyora Familie (Monter)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,550&display=swap" rel="stylesheet" />
<style>
  :root {
    --dw-canvas: #1E140C;
    --dw-canvas-glow: #2B1D11;
    --dw-raised: #2C1F13;
    --dw-ink-hi: #F1E9DA;
    --dw-ink-mid: #CDC0AB;
    --dw-ink-low: #A79A82;
    --dw-accent: #D98E5A;
    --dw-ink-on-accent: #2A1708;
    --dw-edge-light: #F2C08A;
    --dw-focus: #E8B98C;
    --dw-hairline: rgba(241, 233, 218, 0.12);
    --dw-r-pill: 999px;
    --dw-font-ui: 'Schibsted Grotesk', system-ui, sans-serif;
    --dw-font-hero: 'Fraunces', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  :focus-visible { outline: 2px solid var(--dw-focus); outline-offset: 3px; border-radius: 4px; }
  body { background: #0A0705; display: grid; place-items: center; min-height: 100vh; padding: 20px; }

  .stage {
    width: 390px; height: 844px;
    background: linear-gradient(168deg, var(--dw-canvas-glow) 0%, var(--dw-canvas) 46%);
    color: var(--dw-ink-hi);
    font-family: var(--dw-font-ui);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .top { padding: 52px 24px 0; }
  h1 { font-size: 26px; font-weight: 750; letter-spacing: -0.015em; }

  .scroll { flex: 1; overflow-y: auto; mask-image: linear-gradient(to bottom, black calc(100% - 24px), transparent 100%); padding: 4px 20px 28px; }

  .sec-label { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dw-ink-low); margin: 16px 4px 8px; }

  /* Gruppeflate (dybdedoktrinen: inset-gruppert liste, én flate per seksjon) */
  .group {
    position: relative;
    background: var(--dw-raised);
    border-radius: 20px;
    padding: 2px 14px;
    box-shadow: 0 1px 0 rgba(242, 192, 138, 0.14) inset, 0 10px 24px -16px rgba(0, 0, 0, 0.6);
  }
  .group::before {
    content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1.5px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--dw-edge-light), transparent);
    opacity: 0.45;
  }

  .row {
    display: flex; align-items: center; gap: 12px;
    width: 100%; border: 0; background: none; font-family: inherit; color: inherit;
    text-align: left; cursor: pointer;
    padding: 12px 2px; min-height: 60px;
  }
  .row + .row { border-top: 1px solid var(--dw-hairline); }
  .row:active { background: rgba(241, 233, 218, 0.04); }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: #3A2A1A;
    border: 1px solid rgba(242, 192, 138, 0.16);
    box-shadow: 0 1px 0 rgba(242, 192, 138, 0.22) inset;
    font-size: 18px; font-weight: 700;
  }
  .r-icon { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; background: rgba(241, 233, 218, 0.07); }
  .r-icon svg { width: 20px; height: 20px; color: var(--dw-ink-mid); }
  .r-text { flex: 1; min-width: 0; }
  .r-name { font-size: 15.5px; font-weight: 650; display: block; }
  .r-sub { font-size: 12.5px; color: var(--dw-ink-low); display: block; margin-top: 1px; }
  .chev { width: 15px; height: 15px; color: var(--dw-ink-low); flex: none; }
  .add { color: var(--dw-accent); font-size: 15px; font-weight: 650; }
  .add-icon { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; border: 1px dashed rgba(217, 142, 90, 0.5); }
  .add-icon svg { width: 18px; height: 18px; color: var(--dw-accent); }

  .status { font-size: 12.5px; font-weight: 650; color: var(--dw-ink-mid); }

  .legal { display: flex; justify-content: center; gap: 20px; padding: 18px 0 4px; }
  .legal button {
    background: none; border: 0; font-family: inherit;
    color: var(--dw-ink-low); font-size: 12.5px; font-weight: 600;
    text-decoration: underline; text-underline-offset: 3px;
    padding: 12px 6px; min-height: 44px; cursor: pointer;
  }
  .version { text-align: center; font-size: 11.5px; color: var(--dw-ink-low); opacity: 0.7; padding-bottom: 8px; font-variant-numeric: tabular-nums; }

  .tabs { border-top: 1px solid var(--dw-hairline); display: flex; justify-content: space-around; padding: 9px 10px 5px; }
  .tab { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dw-ink-low); min-width: 74px; padding: 4px 0; }
  .tab.on { color: var(--dw-ink-hi); }
  .tab svg { width: 22px; height: 22px; }
  .tab span { font-size: 12px; font-weight: 600; }
  .homebar { width: 128px; height: 5px; border-radius: 3px; background: rgba(241, 233, 218, 0.28); margin: 6px auto 8px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="top"><h1>Familie</h1></div>

    <div class="scroll">
      <p class="sec-label">Barn</p>
      <div class="group">
        <button class="row" type="button">
          <span class="avatar">L</span>
          <span class="r-text">
            <span class="r-name">Lillian</span>
            <span class="r-sub">9 måneder · født 3. oktober 2025</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button class="row" type="button">
          <span class="add-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="r-text"><span class="add">Legg til barn</span></span>
        </button>
      </div>

      <p class="sec-label">Sted</p>
      <div class="group">
        <button class="row" type="button">
          <span class="r-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.3-7-11a7 7 0 0 1 14 0c0 5.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
          <span class="r-text">
            <span class="r-name">Fast sted</span>
            <span class="r-sub">Trondheim</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <p class="sec-label">Verktøy</p>
      <div class="group">
        <button class="row" type="button">
          <span class="r-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 0 0 0 18c2.4 0 4.6-1.2 5.9-3.1A8 8 0 0 1 12 3z"/></svg></span>
          <span class="r-text">
            <span class="r-name">Soveguiden</span>
            <span class="r-sub">Riktig sovepose for romtemperaturen</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button class="row" type="button">
          <span class="r-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5v9.5a3.5 3.5 0 1 1-4-3.45V5a2 2 0 0 1 4 0z"/></svg></span>
          <span class="r-text">
            <span class="r-name">Varm eller kald?</span>
            <span class="r-sub">2-finger-testen i nakken</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button class="row" type="button">
          <span class="r-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M4 6l16 12M20 6 4 18M12 6l-2.5-1.5M12 6l2.5-1.5M12 18l-2.5 1.5M12 18l2.5 1.5"/></svg></span>
          <span class="r-text">
            <span class="r-name">Første vinter med baby</span>
            <span class="r-sub">Åtte korte leksjoner</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <p class="sec-label">Abonnement</p>
      <div class="group">
        <button class="row" type="button">
          <span class="r-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l4 4 4-6 4 6 4-4v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg></span>
          <span class="r-text">
            <span class="r-name">Administrer abonnement</span>
            <span class="r-sub">Årlig · Aktiv · fornyes 31. juli 2027</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="legal">
        <button type="button">Personvern</button>
        <button type="button">Vilkår</button>
        <button type="button">Gjenopprett kjøp</button>
      </div>
      <p class="version">Babyora 1.0 · bygg 2107</p>
    </div>

    <nav class="tabs" aria-label="Hovednavigasjon">
      <a class="tab" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg><span>Hjem</span></a>
      <a class="tab" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg><span>Planlegg</span></a>
      <a class="tab on" href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 20c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="10" r="2.4"/><path d="M15.5 20c.4-2.2 1.6-3.6 3.3-3.9 1 .2 1.9.9 2.7 1.9"/></svg><span>Familie</span></a>
    </nav>
    <div class="homebar"></div>
  </div>
</body>
</html>
