<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<title>Babyora Hjem — Monter (weather-ready)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,550&display=swap" rel="stylesheet" />
<style>
  :root {
    --dw-canvas: #1E140C;
    --dw-canvas-glow: #2B1D11;
    --dw-panel: #113B3E;
    --dw-raised: #2C1F13;
    --dw-ink-hi: #F1E9DA;
    --dw-ink-mid: #CDC0AB;
    --dw-ink-low: #A79A82;
    --dw-ink-panel-mid: #C6CFC4;
    --dw-accent: #D98E5A;
    --dw-accent-pressed: #C57C46;
    --dw-ink-on-accent: #2A1708;
    --dw-edge-light: #F2C08A;
    --dw-focus: #E8B98C;
    --dw-w-rain: #0D3037;
    --dw-hairline: rgba(241, 233, 218, 0.12);
    --dw-r-panel: 20px;
    --dw-r-control: 12px;
    --dw-r-pill: 999px;
    --dw-font-ui: 'Schibsted Grotesk', system-ui, sans-serif;
    --dw-font-hero: 'Fraunces', Georgia, serif;
    --dw-font-data: ui-monospace, 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #0A0705; display: grid; place-items: center; min-height: 100vh; padding: 20px; }

  .stage {
    width: 390px; height: 844px;
    background: linear-gradient(168deg, var(--dw-canvas-glow) 0%, var(--dw-canvas) 46%);
    color: var(--dw-ink-hi);
    font-family: var(--dw-font-ui);
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* Safe area + wordmark */
  .top { padding: 56px 24px 0; }
  .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.24em; color: var(--dw-ink-hi); }

  /* Maskot henger over panelet */
  .mascot {
    position: absolute;
    top: 50px; right: 8px;
    width: 205px; height: auto;
    z-index: 3;
    pointer-events: none;
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.45));
  }

  /* Panelet (instrumentet) — regn-nyanse */
  .panel {
    position: relative;
    margin: 130px 20px 0;
    background: var(--dw-w-rain);
    border-radius: var(--dw-r-panel);
    padding: 24px 22px 18px;
    z-index: 2;
    box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.55);
  }
  .panel::before {
    content: "";
    position: absolute; top: 0; left: 7%; right: 7%; height: 1.5px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--dw-edge-light), transparent);
    opacity: 1;
  }
  .loc-row { display: flex; align-items: center; justify-content: space-between; }
  .loc { font-size: 14px; font-weight: 600; color: #DCD8C8; letter-spacing: 0.01em; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; padding: 14px 6px; margin: -14px -6px; }
  .loc svg { width: 13px; height: 13px; opacity: 0.8; }
  .fresh { font-size: 12.5px; color: #DCD8C8; opacity: 0.85; display: inline-flex; align-items: center; gap: 5px; }
  .fresh i { width: 6px; height: 6px; border-radius: 50%; background: #DCD8C8; opacity: 0.7; display: inline-block; }

  .hero-row { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 10px; }
  .temp {
    font-family: var(--dw-font-hero);
    font-size: 74px; line-height: 0.94; font-weight: 550;
    letter-spacing: -0.015em;
    font-variant-numeric: lining-nums tabular-nums;
  }
  .temp sup { font-size: 34px; font-weight: 400; vertical-align: 30%; margin-left: 2px; }
  .wicon { width: 76px; height: auto; margin: 4px -2px 0 0; filter: saturate(0.8) brightness(0.96) drop-shadow(0 6px 14px rgba(0,0,0,0.35)); }

  .feels { font-size: 16.5px; font-weight: 600; color: var(--dw-ink-hi); margin-top: 6px; }
  .note { font-size: 14.5px; line-height: 1.5; color: #DCD8C8; margin-top: 5px; max-width: 24ch; text-wrap: balance; }

  .toggle {
    display: flex; background: rgba(241, 233, 218, 0.09);
    border-radius: var(--dw-r-pill); padding: 4px; margin-top: 18px;
  }
  .toggle button {
    flex: 1; border: 0; background: transparent;
    font-family: inherit; font-size: 14.5px; font-weight: 600;
    color: var(--dw-ink-panel-mid);
    padding: 12px 0; min-height: 46px; border-radius: var(--dw-r-pill);
    display: flex; align-items: center; justify-content: center; gap: 7px;
    cursor: pointer;
  }
  .toggle button.on { background: var(--dw-ink-hi); color: var(--dw-w-rain); }
  .toggle svg { width: 17px; height: 17px; flex: none; }

  /* Under panelet */
  .ask-block { padding: 10px 24px 30px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .ask { font-size: 24px; font-weight: 700; letter-spacing: -0.012em; }
  .child { font-size: 14px; color: var(--dw-ink-low); margin-top: 5px; }

  .cta {
    margin-top: 18px;
    border: 0; border-radius: 14px;
    background: var(--dw-accent); color: var(--dw-ink-on-accent);
    font-family: inherit; font-size: 17px; font-weight: 700;
    padding: 17px 22px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer;
    box-shadow: 0 10px 22px -12px rgba(0, 0, 0, 0.55);
  }
  .cta:active { background: var(--dw-accent-pressed); transform: translateY(1px); }
  .cta svg { width: 18px; height: 18px; }

  .trust { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 13px; font-size: 12.5px; color: var(--dw-ink-low); }
  .trust svg { width: 14px; height: 14px; color: #9DBF9A; flex: none; }

  /* Tab-bar */
  .tabs {
    border-top: 1px solid var(--dw-hairline);
    display: flex; justify-content: space-around;
    padding: 10px 10px 6px;
  }
  .tab { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dw-ink-low); min-width: 74px; padding: 4px 0; }
  .tab.on { color: var(--dw-ink-hi); }
  .tab svg { width: 22px; height: 22px; }
  .tab span { font-size: 12px; font-weight: 600; }
  .homebar { width: 128px; height: 5px; border-radius: 3px; background: rgba(241, 233, 218, 0.28); margin: 6px auto 8px; }

  /* Kompresjon for lave viewporter (SE-klassen): CTA skal nås uten scroll */
  @media (max-height: 700px) {
    .top { padding-top: 40px; }
    .mascot { width: 164px; top: 36px; }
    .panel { margin-top: 96px; padding-top: 18px; }
    .temp { font-size: 60px; }
    .ask-block { padding-top: 6px; padding-bottom: 16px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="top"><span class="brand">BABYORA</span></div>

    <img class="mascot" src="maskot.png" alt="" />

    <section class="panel" aria-label="Været nå">
      <div class="loc-row">
        <a class="loc" href="#">Trondheim · Fast sted
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <span class="fresh"><i></i>Oppdatert nå</span>
      </div>
      <div class="hero-row">
        <span class="temp">4<sup>°</sup></span>
        <img class="wicon" src="regn.png" alt="Lett regn" />
      </div>
      <p class="feels">Føles som 1°</p>
      <p class="note">Lett yr i lufta, kjølig og fuktig.</p>
      <div class="toggle" role="group" aria-label="Aktivitet">
        <button class="on" type="button">Utenfor vogn</button>
        <button type="button">I vogn</button>
      </div>
    </section>

    <div class="ask-block">
      <h1 class="ask">Klar for en liten tur?</h1>
      <p class="child">Lillian · 9 måneder · Utelek</p>
      <button class="cta" type="button">
        Finn dagens antrekk
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <p class="trust">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        Vær, sted og aktivitet vurderes sammen
      </p>
    </div>

    <nav class="tabs" aria-label="Hovednavigasjon">
      <a class="tab on" href="#" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        <span>Hjem</span>
      </a>
      <a class="tab" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>
        <span>Planlegg</span>
      </a>
      <a class="tab" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 20c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="10" r="2.4"/><path d="M15.5 20c.4-2.2 1.6-3.6 3.3-3.9 1 .2 1.9.9 2.7 1.9"/></svg>
        <span>Familie</span>
      </a>
    </nav>
    <div class="homebar"></div>
  </div>
</body>
</html>
