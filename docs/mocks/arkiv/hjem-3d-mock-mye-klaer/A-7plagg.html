<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strategi A · 7 plagg · Hovedplagg + telling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<link rel="stylesheet" href="frame-base.css">
</head>
<body>
  <div class="frame">
    <main class="screen" aria-label="Babyora Hjem">
      <h1 class="sr-only">Babyora hjem — anbefalt påkledning (Strategi A, 7 plagg)</h1>

      <div class="topbar">
        <div class="pill" aria-label="Sted: Karasjok"><span class="dot" aria-hidden="true"></span><span class="city">Karasjok</span></div>
        <button class="notif" aria-label="Varsler">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
      </div>

      <div class="temp-block" aria-label="Temperatur minus 22 grader, overskyet">
        <span class="temp-figure">−22°</span>
        <span class="cloud-anim" aria-hidden="true">
          <lottie-player
            src="https://assets2.lottiefiles.com/packages/lf20_ulkjvhsa.json"
            background="transparent"
            speed="1"
            style="width:46px;height:46px;"
            loop autoplay
            onerror="this.style.display='none'"
          ></lottie-player>
          <div class="cloud-fallback" aria-hidden="true">
            <div class="body"></div>
          </div>
        </span>
      </div>

      <div class="meta-row" aria-label="Nedbør 0 millimeter per time, vind 5 meter per sekund">
        <div class="meta-pill">
          <span class="meta-anim" aria-hidden="true">
            <div class="rain-fallback">
              <div class="cloud"></div>
              <span class="drop"></span><span class="drop"></span><span class="drop"></span>
            </div>
          </span>
          <span>0 mm/t</span>
        </div>
        <div class="meta-pill">
          <span class="meta-anim" aria-hidden="true">
            <div class="wind-fallback">
              <span class="streak"></span><span class="streak"></span><span class="streak"></span>
            </div>
          </span>
          <span>5 m/s</span>
        </div>
      </div>

      <div class="toggle" role="tablist" aria-label="Velg situasjon">
        <div class="seg active" role="tab" aria-selected="true">Utenfor vogn</div>
        <div class="seg inactive" role="tab" aria-selected="false">I vogn</div>
      </div>

      <div class="hero">
        <div class="avatar-stage" aria-label="Avatar kledd for ekstrem kulde">
          <div class="glow" aria-hidden="true"></div>
          <div class="shadow" aria-hidden="true"></div>
          <div class="float"><div class="avatar-img avatar-a7" role="img" aria-label="Avatar i full vinterutrustning"></div></div>
        </div>
        <div class="eyebrow">ANBEFALT NÅ</div>
        <!-- STRATEGI A · 7 PLAGG: hovedplagg + telling av rest -->
        <h2 class="recommendation">Vinterdress + 6 lag til</h2>
        <div class="subtitle">for −22° overskyet</div>
      </div>

      <button class="cta" aria-label="Se påkledning">
        <span>Se påkledning</span>
        <svg width="22" height="13" viewBox="0 0 26 14" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7h20"/><path d="M17 2l5 5-5 5"/></svg>
      </button>

      <nav class="tabbar" aria-label="Hovedmeny">
        <button class="tab active" aria-current="page" aria-label="Hjem">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"/></svg>
          <span class="tab-label">Hjem</span>
        </button>
        <button class="tab" aria-label="Uke">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span class="tab-label">Uke</span>
        </button>
        <button class="tab" aria-label="Garderobe">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l2 12H4z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
          <span class="tab-label">Garderobe</span>
        </button>
        <button class="tab" aria-label="Meg">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span class="tab-label">Meg</span>
        </button>
      </nav>
    </main>
  </div>
  <script src="frame-base.js"></script>
</body>
</html>
