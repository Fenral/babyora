<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Påkledning · P5-Whering Outfit Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg-canvas:#DBD8D2;
  --bg-canvas-soft:#E5E2DC;
  --bg-canvas-deep:#CFCBC2;
  --terracotta-500:#C0632F;
  --terracotta-600:#B4502E;
  --terracotta-700:#A9492A;
  --terracotta-100:#F4E4D8;
  --terracotta-700-on-100:#8A3618;

  /* Lag-farger fra brief */
  --layer-ytterst:#C0632F;
  --layer-mellom:#5E8C6A;
  --layer-innerst:#3F5A78;

  --ink-900:#2B2B2B;
  --ink-700:#5A514C;
  --ink-500:#A89E97;
  --ink-300:#C9C3BD;

  --card-bg:#FFFFFF;
  --card-shadow:0 1px 2px rgba(43,37,34,.05),0 8px 18px rgba(43,37,34,.09);

  --font-sans:'Schibsted Grotesk',-apple-system,system-ui,sans-serif;
  --font-serif:'DM Serif Display',Georgia,serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#1a1a1a;font-family:var(--font-sans);}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink-900);}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* iPhone-frame 390×844 */
.frame{
  position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 12px #1f1f1f, 0 0 0 13px #333;
  background:linear-gradient(180deg,#C7D6E1 0%,#DEE1DD 45%,#E9E1D6 100%);
}

/* main fyller hele frame; intern scroll skjer i .scroll-area */
.screen{
  position:relative;height:100%;width:100%;display:flex;flex-direction:column;
  font-family:var(--font-sans);color:var(--ink-900);
  padding-top:env(safe-area-inset-top,0px);
  background:var(--bg-canvas);
}
.screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 46% at 50% -8%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%);
}

/* Topbar — sticky-top, 44px */
.topbar{
  position:relative;z-index:5;flex:none;
  height:calc(44px + 8px);
  margin-top:46px;
  padding:0 16px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(43,43,43,.06);
  background:rgba(219,216,210,.0);
}
.back-btn{
  width:36px;height:36px;flex:none;border-radius:11px;
  background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.06);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  padding:0;
}
.back-btn:active{transform:scale(.96);}
.topbar-title{
  flex:1;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.3px;
  color:var(--ink-900);
}
.meta-pill{
  flex:none;display:flex;align-items:center;gap:6px;
  padding:7px 11px;border-radius:11px;
  background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.06);
  font-size:12px;font-weight:600;color:var(--ink-700);letter-spacing:.1px;
}
.meta-pill .temp-fig{font-family:var(--font-serif);font-weight:400;font-size:13.5px;letter-spacing:-.2px;color:var(--ink-900);}

/* Scroll-area */
.scroll-area{
  position:relative;z-index:3;
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:14px 16px 130px;
  scrollbar-width:none;
}
.scroll-area::-webkit-scrolllbar{display:none;}
.scroll-area::-webkit-scrollbar{display:none;}

/* Canvas-intro — kort meta-linje over selve outfit-canvasen */
.canvas-intro{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 4px 10px;
}
.canvas-intro .label{
  font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--ink-500);
}
.canvas-intro .who{
  font-size:12.5px;font-weight:600;color:var(--ink-700);letter-spacing:-.1px;
}

/* Outfit Canvas — selve stacken */
.outfit-canvas{
  position:relative;
  width:100%;
  border-radius:24px;
  background:linear-gradient(180deg, var(--bg-canvas-soft) 0%, var(--bg-canvas) 60%, var(--bg-canvas-deep) 100%);
  border:1px solid rgba(43,43,43,.05);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 1px 2px rgba(43,37,34,.04);
  padding:18px 14px 22px;
  margin-bottom:16px;
}

/* Subtil grid-tekstur for canvas-feel */
.outfit-canvas::before{
  content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(43,43,43,.05) 1px, transparent 0);
  background-size:18px 18px;
  opacity:.55;
  mask-image:linear-gradient(180deg, rgba(0,0,0,.4), rgba(0,0,0,.15) 70%, transparent);
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.4), rgba(0,0,0,.15) 70%, transparent);
}

/* Stack-container — overlap mellom plagg */
.stack{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  list-style:none;margin:0;padding:0;
}

/* Hvert stack-item: plagg-PNG sentered + label-pill under */
.stack-item{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  width:100%;
  /* Overlap: hvert plagg trekkes opp så stacken føles som ett antrekk */
  margin-top:-34px;
}
.stack-item:first-child{margin-top:0;}

/* Plagg-PNG container — gir oss space for shadow + animation */
.plagg-wrap{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  width:160px;height:140px;
}
.plagg-img{
  width:140px;height:140px;
  background-size:contain;background-repeat:no-repeat;background-position:center;
  filter:drop-shadow(2px 12px 14px rgba(74,68,58,.22)) drop-shadow(0 2px 3px rgba(74,68,58,.18));
  pointer-events:none;
  animation:plaggFloat 7s ease-in-out infinite;
}
.stack-item:nth-child(1) .plagg-img{animation-delay:0s;}
.stack-item:nth-child(2) .plagg-img{animation-delay:.4s;}
.stack-item:nth-child(3) .plagg-img{animation-delay:.8s;}
.stack-item:nth-child(4) .plagg-img{animation-delay:1.2s;}
.stack-item:nth-child(5) .plagg-img{animation-delay:1.6s;}

@keyframes plaggFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}

/* Pin-ikon — hint-til-tap, plassert øvre høyre hjørne av plagg-wrap */
.pin{
  position:absolute;
  top:4px;right:4px;
  width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,.95);
  border:1px solid rgba(43,43,43,.08);
  box-shadow:0 2px 6px rgba(43,37,34,.12);
  display:flex;align-items:center;justify-content:center;
  z-index:2;
}
.pin svg{display:block;}
.pin.ytterst{box-shadow:0 0 0 2px rgba(192,99,47,.18), 0 2px 6px rgba(43,37,34,.12);}
.pin.mellom{box-shadow:0 0 0 2px rgba(94,140,106,.18), 0 2px 6px rgba(43,37,34,.12);}
.pin.innerst{box-shadow:0 0 0 2px rgba(63,90,120,.18), 0 2px 6px rgba(43,37,34,.12);}

/* Label-pill under plagget */
.label-pill{
  margin-top:2px;
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:10px;
  background:var(--card-bg);
  box-shadow:0 1px 2px rgba(43,37,34,.06),0 3px 8px rgba(43,37,34,.07);
  font-size:11.5px;letter-spacing:-.1px;
  white-space:nowrap;
  position:relative;z-index:3;
}
.label-pill .cat{
  font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
}
.label-pill .cat.ytterst{color:var(--layer-ytterst);}
.label-pill .cat.mellom{color:var(--layer-mellom);}
.label-pill .cat.innerst{color:var(--layer-innerst);}
.label-pill .dot{
  display:inline-block;width:3px;height:3px;border-radius:50%;
  background:var(--ink-300);
}
.label-pill .name{font-weight:600;color:var(--ink-900);}

/* PLUSS-section — horisontal scroll-rad med 3 tilbehør */
.pluss-section{
  margin-top:6px;
}
.pluss-eyebrow{
  font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--ink-500);margin:0 4px 10px;
  display:flex;align-items:center;gap:8px;
}
.pluss-eyebrow::after{
  content:"";flex:1;height:1px;background:rgba(43,43,43,.1);
}

.pluss-scroller{
  display:flex;gap:10px;
  overflow-x:auto;overflow-y:visible;
  padding:2px 2px 12px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x mandatory;
}
.pluss-scroller::-webkit-scrollbar{display:none;}

.mini-card{
  flex:none;
  width:104px;
  border-radius:18px;
  background:var(--card-bg);
  box-shadow:0 1px 2px rgba(43,37,34,.04),0 4px 12px rgba(43,37,34,.06);
  padding:12px 8px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;
  cursor:pointer;border:none;
  font-family:var(--font-sans);
  scroll-snap-align:start;
  transition:transform 120ms ease;
}
.mini-card:active{transform:scale(.97);}
.mini-card .mini-img{
  width:60px;height:60px;
  background-size:contain;background-repeat:no-repeat;background-position:center;
  filter:drop-shadow(0 4px 6px rgba(74,68,58,.18));
}
.mini-card .mini-title{
  font-size:12.5px;font-weight:700;color:var(--ink-900);letter-spacing:-.1px;
  text-align:center;margin-top:2px;
}
.mini-card .mini-spec{
  font-size:10.5px;font-weight:500;color:rgba(43,43,43,.55);
  text-align:center;line-height:1.3;
}

/* Sticky CTA — bottom of frame */
.sticky-cta{
  position:absolute;left:0;right:0;bottom:0;
  z-index:10;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:linear-gradient(180deg,rgba(219,216,210,0) 0%, rgba(219,216,210,.92) 28%, rgba(219,216,210,.98) 100%);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.cta-btn{
  width:100%;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:17px 24px;border-radius:18px;border:none;cursor:pointer;
  background:linear-gradient(140deg,var(--terracotta-500) 0%,var(--terracotta-700) 100%);
  box-shadow:0 1px 2px rgba(43,43,43,.06),0 12px 24px rgba(169,73,42,.32);
  font-family:var(--font-sans);
  transition:transform 120ms ease;
}
.cta-btn:active{transform:translateY(1px) scale(.99);}
.cta-btn span{font-size:16px;font-weight:600;color:#FFF;letter-spacing:.1px;}
.cta-btn svg{flex:none;}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  .plagg-img{animation:none !important;}
  .pluss-scroller{scroll-snap-type:none !important;}
  .mini-card,.cta-btn,.back-btn{transition:none !important;}
}
</style>
</head>
<body>
  <div class="frame">
    <main class="screen" aria-label="Slik kler du Liv">
      <h1 class="sr-only">Påkledning — Slik kler du Liv (Whering Outfit Canvas)</h1>

      <!-- Topbar -->
      <div class="topbar" role="banner">
        <button class="back-btn" aria-label="Tilbake">
          <svg width="9" height="16" viewBox="0 0 12 20" fill="none" stroke="#2B2B2B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2L2 10l8 8"/></svg>
        </button>
        <div class="topbar-title">Slik kler du Liv</div>
        <div class="meta-pill" aria-label="Minus 22 grader, ekstrem kulde">
          <span class="temp-fig">−22°</span>
          <span aria-hidden="true">·</span>
          <span>Karasjok</span>
        </div>
      </div>

      <!-- Scroll-area -->
      <div class="scroll-area">

        <!-- Canvas-intro -->
        <div class="canvas-intro">
          <span class="label">Antrekk</span>
          <span class="who">Liv · 14 mnd · Utelek</span>
        </div>

        <!-- OUTFIT CANVAS — vertikal stack ovenfra-ned, lag-rekkefølge -->
        <div class="outfit-canvas">
          <ul class="stack" role="list" aria-label="Antrekk i lag-rekkefølge, ytterst først">

            <!-- 1. YTTERST: Vinterdress (på toppen av stacken) -->
            <li class="stack-item" role="listitem" aria-label="Ytterst: Vinterdress">
              <div class="plagg-wrap">
                <span class="pin ytterst" aria-hidden="true">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="#C0632F" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg>
                </span>
                <div class="plagg-img" style="background-image:url(../illustrations/garments/vinterdress.png);" aria-hidden="true"></div>
              </div>
              <div class="label-pill">
                <span class="cat ytterst">Ytterst</span>
                <span class="dot" aria-hidden="true"></span>
                <span class="name">Vinterdress</span>
              </div>
            </li>

            <!-- 2. MELLOM: Fleecejakke -->
            <li class="stack-item" role="listitem" aria-label="Mellom: Fleecejakke">
              <div class="plagg-wrap">
                <span class="pin mellom" aria-hidden="true">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="#5E8C6A" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg>
                </span>
                <div class="plagg-img" style="background-image:url(../illustrations/garments/ull-jakke.png);" aria-hidden="true"></div>
              </div>
              <div class="label-pill">
                <span class="cat mellom">Mellom</span>
                <span class="dot" aria-hidden="true"></span>
                <span class="name">Fleecejakke</span>
              </div>
            </li>

            <!-- 3. MELLOM: Ullsett tykt -->
            <li class="stack-item" role="listitem" aria-label="Mellom: Ullsett tykt">
              <div class="plagg-wrap">
                <span class="pin mellom" aria-hidden="true">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="#5E8C6A" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg>
                </span>
                <div class="plagg-img" style="background-image:url(../illustrations/garments/ullsett-tykt.png);" aria-hidden="true"></div>
              </div>
              <div class="label-pill">
                <span class="cat mellom">Mellom</span>
                <span class="dot" aria-hidden="true"></span>
                <span class="name">Ullsett tykt</span>
              </div>
            </li>

            <!-- 4. INNERST: Ullbody langermet -->
            <li class="stack-item" role="listitem" aria-label="Innerst: Ullbody langermet">
              <div class="plagg-wrap">
                <span class="pin innerst" aria-hidden="true">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="#3F5A78" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg>
                </span>
                <div class="plagg-img" style="background-image:url(../illustrations/garments/langermet-ullbody.png);" aria-hidden="true"></div>
              </div>
              <div class="label-pill">
                <span class="cat innerst">Innerst</span>
                <span class="dot" aria-hidden="true"></span>
                <span class="name">Ullbody langermet</span>
              </div>
            </li>

            <!-- 5. INNERST: Tynn bukse -->
            <li class="stack-item" role="listitem" aria-label="Innerst: Tynn bukse">
              <div class="plagg-wrap">
                <span class="pin innerst" aria-hidden="true">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="#3F5A78" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg>
                </span>
                <div class="plagg-img" style="background-image:url(../illustrations/garments/tynn-bukse.png);" aria-hidden="true"></div>
              </div>
              <div class="label-pill">
                <span class="cat innerst">Innerst</span>
                <span class="dot" aria-hidden="true"></span>
                <span class="name">Tynn bukse</span>
              </div>
            </li>

          </ul>
        </div>

        <!-- PLUSS — horisontal scroll med tilbehør -->
        <div class="pluss-section" aria-label="Pluss tilbehør">
          <div class="pluss-eyebrow">Pluss</div>
          <div class="pluss-scroller" role="list">
            <button class="mini-card" type="button" role="listitem" aria-label="Lue med ull">
              <div class="mini-img" style="background-image:url(../illustrations/garments/lue-m-ull.png);" aria-hidden="true"></div>
              <div class="mini-title">Lue</div>
              <div class="mini-spec">Med ull</div>
            </button>
            <button class="mini-card" type="button" role="listitem" aria-label="Vindvotter med skall">
              <div class="mini-img" style="background-image:url(../illustrations/garments/vindvotter-skall.png);" aria-hidden="true"></div>
              <div class="mini-title">Votter</div>
              <div class="mini-spec">Vindtett skall</div>
            </button>
            <button class="mini-card" type="button" role="listitem" aria-label="Ullsokker">
              <div class="mini-img" style="background-image:url(../illustrations/garments/ullsokker.png);" aria-hidden="true"></div>
              <div class="mini-title">Ullsokker</div>
              <div class="mini-spec">Holder tær varme</div>
            </button>
          </div>
        </div>

      </div>

      <!-- Sticky CTA bottom -->
      <div class="sticky-cta">
        <button class="cta-btn" type="button" aria-label="Klar for tur">
          <span>Klar for tur</span>
          <svg width="22" height="13" viewBox="0 0 26 14" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7h20"/><path d="M17 2l5 5-5 5"/></svg>
        </button>
      </div>
    </main>
  </div>
</body>
</html>
