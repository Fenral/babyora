<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V2 · Tekst-hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-canvas:#DBD8D2;
    --terracotta-600:#B4502E;
    --terracotta-700:#9B4326;
    --ink-900:#2B2B2B;
    --ink-700:#5A514C;
    --ink-500:#A89E97;
    --font-sans:'Schibsted Grotesk',-apple-system,system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#1a1a1a;font-family:var(--font-sans);}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .frame{
    position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 12px #1f1f1f, 0 0 0 13px #333;
    background:var(--bg-canvas);
  }
  .screen{
    position:relative;height:100%;width:100%;overflow:hidden;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top, 0px) + 56px) 22px calc(env(safe-area-inset-bottom, 0px) + 92px);
    font-family:var(--font-sans);color:var(--ink-900);
    background:var(--bg-canvas);
  }

  /* Topbar */
  .topbar{flex:none;display:flex;align-items:center;justify-content:space-between;}
  .pill{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:13px;background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.05);}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--terracotta-600);}
  .pill .city{font-size:13.5px;font-weight:600;color:var(--ink-900);}
  .notif{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.05);display:flex;align-items:center;justify-content:center;cursor:pointer;}

  /* Hero = tekst */
  .eyebrow{flex:none;margin-top:34px;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-500);}
  .recommendation{
    flex:none;margin-top:12px;
    font-family:var(--font-sans);
    font-size:32px;
    font-weight:600;
    line-height:1.15;
    letter-spacing:-.4px;
    color:var(--ink-900);
  }
  .recommendation .lo{display:block;}
  .context{
    flex:none;margin-top:10px;
    font-size:13px;
    font-weight:500;
    color:var(--ink-700);
    letter-spacing:.1px;
  }

  /* Avatar lateral (under tekst) */
  .avatar-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-top:8px;}
  .avatar-stage{position:relative;width:170px;height:170px;}
  .shadow{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:130px;height:20px;border-radius:50%;background:rgba(96,90,80,.16);filter:blur(10px);}
  .avatar-img{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    width:160px;height:160px;
    background-image:url(../avatars/avatar-A6.png);
    background-size:contain;background-repeat:no-repeat;background-position:center bottom;
    filter:drop-shadow(0 14px 18px rgba(74,68,58,.22));
  }

  /* Toggle */
  .toggle{flex:none;display:flex;margin-top:14px;padding:4px;border-radius:13px;background:rgba(43,37,34,.06);}
  .toggle .seg{flex:1;text-align:center;padding:10px 0;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;}
  .toggle .seg.active{background:#FFF;color:var(--ink-900);box-shadow:0 1px 3px rgba(43,43,43,.1);}
  .toggle .seg.inactive{color:rgba(43,43,43,.45);}

  /* CTA */
  .cta{
    flex:none;display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;margin-top:14px;padding:17px 24px;border-radius:18px;border:none;cursor:pointer;
    background:var(--terracotta-600);
    box-shadow:0 1px 2px rgba(43,43,43,.06),0 10px 22px rgba(180,80,46,.30);
    font-family:var(--font-sans);
  }
  .cta:active{background:var(--terracotta-700);}
  .cta span{font-size:16px;font-weight:600;color:#FFF;letter-spacing:.1px;}

  /* BottomTabBar */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;
    height:calc(env(safe-area-inset-bottom, 0px) + 72px);
    padding:8px 22px calc(env(safe-area-inset-bottom, 0px) + 10px);
    background:rgba(219,216,210,.92);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(43,43,43,.06);
    display:flex;align-items:center;justify-content:space-around;
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;background:none;border:none;cursor:pointer;font-family:var(--font-sans);}
  .tab svg{stroke:rgba(43,43,43,.42);}
  .tab .tab-label{font-size:10.5px;font-weight:600;color:rgba(43,43,43,.5);letter-spacing:.3px;}
  .tab.active svg{stroke:var(--terracotta-600);}
  .tab.active .tab-label{color:var(--terracotta-600);}
</style>
</head>
<body>
  <div class="frame">
    <main class="screen" aria-label="Babyora Hjem">
      <h1 class="sr-only">Babyora hjem — anbefalt påkledning</h1>

      <div class="topbar">
        <div class="pill" aria-label="Sted: Elverum"><span class="dot" aria-hidden="true"></span><span class="city">Elverum</span></div>
        <button class="notif" aria-label="Varsler">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
      </div>

      <div class="eyebrow">Anbefalt nå</div>
      <h2 class="recommendation">
        <span class="lo">Vinterdress, lue</span>
        <span class="lo">og votter</span>
      </h2>
      <div class="context">for −4° klarvær</div>

      <div class="avatar-wrap" aria-label="Avatar kledd for anbefalingen">
        <div class="avatar-stage">
          <div class="shadow" aria-hidden="true"></div>
          <div class="avatar-img" role="img" aria-label="Avatar i vinterdress"></div>
        </div>
      </div>

      <div class="toggle" role="tablist" aria-label="Velg situasjon">
        <div class="seg active" role="tab" aria-selected="true">Utenfor vogn</div>
        <div class="seg inactive" role="tab" aria-selected="false">I vogn</div>
      </div>

      <button class="cta" aria-label="Se påkledning">
        <span>Se påkledning</span>
        <svg width="22" height="13" viewBox="0 0 26 14" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7h20"/><path d="M17 2l5 5-5 5"/></svg>
      </button>

      <nav class="tabbar" aria-label="Hovedmeny">
        <button class="tab active" aria-current="page" aria-label="Hjem">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"/></svg>
          <span class="tab-label">Hjem</span>
        </button>
        <button class="tab" aria-label="Uke">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span class="tab-label">Uke</span>
        </button>
        <button class="tab" aria-label="Garderobe">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l2 12H4z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
          <span class="tab-label">Garderobe</span>
        </button>
        <button class="tab" aria-label="Meg">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span class="tab-label">Meg</span>
        </button>
      </nav>
    </main>
  </div>
</body>
</html>
