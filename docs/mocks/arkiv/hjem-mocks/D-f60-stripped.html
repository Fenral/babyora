<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D · F60 stripped (minimalist)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#1a1a1a;font-family:'Schibsted Grotesk',-apple-system,system-ui,sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .frame{
    position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 12px #1f1f1f, 0 0 0 13px #333;
    background:#DBD8D2;
  }
  /* Ingen AtmosphereBackground, ingen gradient. Flat warm-grey. */
  .screen{
    position:relative;height:100%;width:100%;overflow:hidden;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top, 0px) + 56px) 22px 26px;
    font-family:'Schibsted Grotesk',sans-serif;color:#2B2B2B;
    background:#DBD8D2;
  }

  .topbar{flex:none;display:flex;align-items:center;justify-content:space-between;}
  .pill{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:13px;background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.05);}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:#C0632F;}
  .pill .city{font-size:13.5px;font-weight:600;}
  .notif{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.05);display:flex;align-items:center;justify-content:center;}

  .hero{flex:none;display:flex;flex-direction:column;align-items:center;margin-top:34px;}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:2.6px;text-transform:uppercase;color:rgba(43,43,43,.4);}
  .temp{display:inline-flex;align-items:flex-start;font-family:'Schibsted Grotesk',sans-serif;font-size:112px;font-weight:500;line-height:1;letter-spacing:-3.5px;margin-top:8px;font-variant-numeric:tabular-nums;color:#2B2B2B;}
  .temp .deg{color:rgba(43,43,43,.4);font-weight:500;}

  /* Enkel condition-rad, ingen pill, ingen glass */
  .cond-row{flex:none;text-align:center;margin-top:10px;font-size:13px;font-weight:600;color:rgba(43,43,43,.7);letter-spacing:.2px;}

  .toggle{flex:none;display:flex;margin-top:26px;padding:4px;border-radius:13px;background:rgba(43,37,34,.06);}
  .toggle .seg{flex:1;text-align:center;padding:10px 0;border-radius:10px;font-weight:600;font-size:14px;}
  .toggle .seg.active{background:#FFF;color:#2B2B2B;box-shadow:0 1px 3px rgba(43,43,43,.1);}
  .toggle .seg.inactive{color:rgba(43,43,43,.45);}

  .avatar-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  .avatar-stage{position:relative;width:230px;height:230px;}
  .shadow{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:186px;height:28px;border-radius:50%;background:rgba(96,90,80,.16);filter:blur(12px);}
  .float{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);}
  .avatar-img{width:200px;height:200px;background-image:url(../avatars/avatar-A6.png);background-size:contain;background-repeat:no-repeat;background-position:center bottom;filter:drop-shadow(0 16px 20px rgba(74,68,58,.22));}

  .cta{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 24px;border-radius:18px;border:none;cursor:pointer;background:linear-gradient(140deg,#C0632F 0%,#A9492A 100%);box-shadow:0 1px 2px rgba(43,43,43,.06),0 10px 22px rgba(169,73,42,.26);font-family:'Schibsted Grotesk',sans-serif;}
  .cta span{font-size:16px;font-weight:600;color:#FFF;letter-spacing:.1px;}
</style>
</head>
<body>
  <div class="frame">
    <div class="screen">

      <div class="topbar">
        <div class="pill"><span class="dot"></span><span class="city">Elverum</span></div>
        <div class="notif">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </div>
      </div>

      <div class="hero">
        <div class="eyebrow">Akkurat nå</div>
        <div class="temp"><span>−4</span><span class="deg">°</span></div>
      </div>

      <div class="cond-row">Klarvær · føles −5°</div>

      <div class="toggle">
        <div class="seg active">Utenfor vogn</div>
        <div class="seg inactive">I vogn</div>
      </div>

      <div class="avatar-wrap">
        <div class="avatar-stage">
          <div class="shadow"></div>
          <div class="float"><div class="avatar-img"></div></div>
        </div>
      </div>

      <button class="cta">
        <span>Se påkledning</span>
        <svg width="22" height="13" viewBox="0 0 26 14" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7h20"/><path d="M17 2l5 5-5 5"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
