<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A · F60 current (live)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#1a1a1a;font-family:'Schibsted Grotesk',-apple-system,system-ui,sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .frame{
    position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 12px #1f1f1f, 0 0 0 13px #333;
    background:#DBD8D2;
  }
  .screen{
    position:relative;height:100%;width:100%;overflow:hidden;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top, 0px) + 56px) 22px 26px;
    font-family:'Schibsted Grotesk',sans-serif;color:#2B2B2B;
    background:linear-gradient(180deg,rgb(199,214,225) 0%,rgb(222,225,221) 45%,rgb(233,225,214) 100%);
  }
  .bloom{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 46% at 50% -8%, rgba(255,255,255,.5), rgba(255,255,255,0) 60%);}
  .topbar{position:relative;z-index:3;flex:none;display:flex;align-items:center;justify-content:space-between;}
  .pill{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:13px;background:rgba(255,255,255,.5);border:1px solid rgba(43,43,43,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:#C0632F;}
  .pill .city{font-size:13.5px;font-weight:600;}
  .notif{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5);border:1px solid rgba(43,43,43,.05);display:flex;align-items:center;justify-content:center;}
  .hero{position:relative;z-index:3;flex:none;display:flex;flex-direction:column;align-items:center;margin-top:18px;}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:2.6px;text-transform:uppercase;color:rgba(43,43,43,.4);}
  .temp{display:inline-flex;align-items:flex-start;font-size:96px;font-weight:500;line-height:1;letter-spacing:-3px;margin-top:6px;font-variant-numeric:tabular-nums;}
  .temp .deg{color:rgba(43,43,43,.4);font-weight:500;}
  .cond{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:19px;font-weight:600;letter-spacing:-.2px;}
  .meta{position:relative;z-index:3;flex:none;margin-top:18px;display:flex;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.5);box-shadow:0 1px 2px rgba(43,37,34,.04),0 6px 16px rgba(43,37,34,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden;}
  .meta > div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:13px 6px;}
  .meta .lbl{font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:rgba(43,43,43,.42);}
  .meta .val{font-size:17px;font-weight:600;letter-spacing:-.2px;}
  .meta .sep{flex:0 0 1px;background:rgba(43,43,43,.08);margin:11px 0;padding:0;}
  .toggle{position:relative;z-index:3;flex:none;display:flex;margin-top:12px;padding:4px;border-radius:13px;background:rgba(43,37,34,.06);}
  .toggle .seg{flex:1;text-align:center;padding:10px 0;border-radius:10px;font-weight:600;font-size:14px;}
  .toggle .seg.active{background:#FFF;color:#2B2B2B;box-shadow:0 1px 3px rgba(43,43,43,.1);}
  .toggle .seg.inactive{color:rgba(43,43,43,.45);}
  .avatar-wrap{position:relative;z-index:2;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  .avatar-stage{position:relative;width:230px;height:230px;}
  .glow{position:absolute;left:50%;top:54%;width:280px;height:120px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side at 50% 58%, rgba(255,255,255,.72), rgba(255,255,255,0) 72%);}
  .shadow{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:186px;height:28px;border-radius:50%;background:rgba(96,90,80,.16);filter:blur(12px);}
  .float{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);}
  .avatar-img{width:200px;height:200px;background-image:url(../avatars/avatar-A6.png);background-size:contain;background-repeat:no-repeat;background-position:center bottom;filter:drop-shadow(0 16px 20px rgba(74,68,58,.22));}
  .cta{position:relative;z-index:3;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 24px;border-radius:18px;border:none;cursor:pointer;background:linear-gradient(140deg,#C0632F 0%,#A9492A 100%);box-shadow:0 1px 2px rgba(43,43,43,.06),0 10px 22px rgba(169,73,42,.26);font-family:'Schibsted Grotesk',sans-serif;}
  .cta span{font-size:16px;font-weight:600;color:#FFF;letter-spacing:.1px;}
</style>
</head>
<body>
  <div class="frame">
    <div class="screen">
      <div class="bloom"></div>

      <div class="topbar">
        <div class="pill"><span class="dot"></span><span class="city">Elverum</span></div>
        <div class="notif">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </div>
      </div>

      <div class="hero">
        <div class="eyebrow">Akkurat nå</div>
        <div class="temp"><span>−4</span><span class="deg">°</span></div>
        <div class="cond">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C7A24E" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.3"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/></svg>
          <span>Klarvær</span>
        </div>
      </div>

      <div class="meta">
        <div><span class="lbl">Føles</span><span class="val">−5°</span></div>
        <div class="sep"></div>
        <div><span class="lbl">Vind</span><span class="val">2 m/s</span></div>
        <div class="sep"></div>
        <div><span class="lbl">Fukt</span><span class="val">78%</span></div>
      </div>

      <div class="toggle">
        <div class="seg active">Utenfor vogn</div>
        <div class="seg inactive">I vogn</div>
      </div>

      <div class="avatar-wrap">
        <div class="avatar-stage">
          <div class="glow"></div>
          <div class="shadow"></div>
          <div class="float"><div class="avatar-img"></div></div>
        </div>
      </div>

      <button class="cta">
        <span>Se påkledning</span>
        <svg width="22" height="13" viewBox="0 0 26 14" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7h20"/><path d="M17 2l5 5-5 5"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
