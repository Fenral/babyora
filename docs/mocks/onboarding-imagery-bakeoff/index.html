<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Babyora · onboarding bake-off</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="lab" aria-label="Testoppsett">
      <div>
        <span class="lab__eyebrow">DESIGN LAB · IKKE PRODUKSJON</span>
        <strong>Onboarding bake-off</strong>
      </div>
      <label>Kandidat <select id="arm-select"></select></label>
      <label>Ramme <select id="frame-select"></select></label>
      <label>Tema
        <select id="theme-select">
          <option value="dark">Mørk</option>
          <option value="light">Lys</option>
        </select>
      </label>
      <label>Tilstand
        <select id="scenario-select">
          <option value="normal">Normal</option>
          <option value="offline">Offline</option>
          <option value="slow">Treg media</option>
          <option value="error">Feil</option>
        </select>
      </label>
      <label>Tekst
        <select id="text-select">
          <option value="normal">Standard</option>
          <option value="large">Stor</option>
        </select>
      </label>
      <label>Motion
        <select id="motion-select">
          <option value="full">Full</option>
          <option value="reduce">Redusert</option>
        </select>
      </label>
      <button id="compare-button" type="button">K0–K3 side om side</button>
    </aside>

    <main id="stage" class="stage" aria-live="polite"></main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
