<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Funksjon</title>
<script>var q=location.search;var d=document.documentElement;
if(q.indexOf('naken')>-1)d.classList.add('naken');
if(q.indexOf('gra')>-1)d.classList.add('gra');</script>
<style>
  :root{
    --petrol:#143A38;
    --espresso:#2A211C;
    --ullkrem:#F2EADD;
    --ullkremlys:#FBF7F0;
    --aksent:#C8794A;
    --hairline:#C9BBA8;
    --easeOut:cubic-bezier(0.22,1,0.36,1);
    --easeOutSoft:cubic-bezier(0.16,1,0.3,1);
    --easeOutExpo:cubic-bezier(0.19,1,0.22,1);
    --iosDrawer:cubic-bezier(0.32,0.72,0,1);
  }
  html,body{margin:0;padding:0;background:var(--ullkrem);}
  body{width:600px;height:600px;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  svg{display:block;}

  /* ---- naken: KUN tekst forsvinner, formene blir staaende ---- */
  html.naken text{fill:transparent !important;}
  html.naken .tekst{color:transparent !important;}
  html.gra{filter:grayscale(1);}

  /* ---- motion ---- */
  .field{opacity:0;animation:fade 460ms var(--easeOutSoft) both;}
  .field-b{animation-delay:60ms;}
  .seam{opacity:0;animation:fade 400ms var(--easeOut) 120ms both;}

  .band{opacity:0;transform-box:view-box;transform-origin:186px 288px;
        transform:scale(.84);
        animation:bloom 560ms var(--easeOutSoft) both;}
  .b1{animation-delay:140ms}
  .b2{animation-delay:180ms}
  .b3{animation-delay:220ms}
  .b4{animation-delay:260ms}

  .halo{opacity:0;transform-box:view-box;transform-origin:186px 288px;transform:scale(.9);
        animation:haloIn 620ms var(--easeOutSoft) 160ms both;}

  .glow{opacity:0;animation:glowIn 480ms var(--easeOutExpo) 520ms both;}

  .plate{opacity:0;transform-box:view-box;transform:translateX(52px);
         animation:slab 600ms var(--iosDrawer) 300ms both;}

  .arc{opacity:0;transform-box:view-box;transform:translateX(-12px);
       animation:push 420ms var(--easeOut) both;}
  .a1{animation-delay:640ms}
  .a2{animation-delay:680ms}
  .a3{animation-delay:720ms}

  .lab{opacity:0;animation:fade 380ms var(--easeOut) 760ms both;}

  @keyframes fade{to{opacity:1}}
  @keyframes bloom{to{opacity:1;transform:scale(1)}}
  @keyframes haloIn{to{opacity:.30;transform:scale(1)}}
  @keyframes glowIn{to{opacity:1}}
  @keyframes slab{to{opacity:1;transform:translateX(0)}}
  @keyframes push{to{opacity:1;transform:translateX(0)}}

  @media (prefers-reduced-motion: reduce){
    .field,.seam,.band,.glow,.plate,.arc,.lab{
      animation:none !important;opacity:1 !important;transform:none !important;}
    .halo{animation:none !important;opacity:.30 !important;transform:none !important;}
  }
</style>
</head>
<body>
<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <radialGradient id="varme" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#C8794A" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#C8794A" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#C8794A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skall" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0%"   stop-color="#143A38"/>
      <stop offset="58%"  stop-color="#1B4A47"/>
      <stop offset="100%" stop-color="#123230"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="#F2EADD"/>

  <!-- ===== FELT A : ISOLASJON (myk, lagvis, holder varmen inne) ===== -->
  <rect class="field" x="44" y="84" width="284" height="424" rx="46" fill="#FBF7F0"/>

  <!-- myk uskarp aura: materialet er plysj/ull -->
  <g class="halo" filter="url(#soft)">
    <rect x="72" y="152" width="228" height="272" rx="82" fill="#143A38" fill-opacity=".30"/>
  </g>

  <!-- varmen som holdes inne (eneste bruk av varm aksent) -->
  <ellipse class="glow" cx="186" cy="288" rx="62" ry="72" fill="url(#varme)"/>

  <!-- 4 plagg som gjoer jobben ISOLASJON: fire tette, myke lag -->
  <g fill="none" stroke="#143A38" stroke-linejoin="round">
    <rect class="band b1" x="78"  y="158" width="216" height="260" rx="76" stroke-width="15" stroke-opacity=".38"/>
    <rect class="band b2" x="102" y="186" width="168" height="204" rx="60" stroke-width="15" stroke-opacity=".56"/>
    <rect class="band b3" x="125" y="213" width="122" height="150" rx="44" stroke-width="15" stroke-opacity=".78"/>
    <rect class="band b4" x="147" y="238" width="78"  height="100" rx="30" stroke-width="15" stroke-opacity="1"/>
  </g>

  <!-- ===== skille mellom de to jobbene ===== -->
  <line class="seam" x1="338" y1="112" x2="338" y2="480" stroke="#C9BBA8" stroke-width="1.5" stroke-opacity=".55"/>

  <!-- ===== FELT B : VIND & VANN (hard, glatt, ubrutt flate) ===== -->
  <rect class="field field-b" x="348" y="84" width="208" height="424" rx="46" fill="#143A38" fill-opacity="0.055"/>

  <!-- 1 plagg som gjoer jobben VIND & VANN: en ubrutt skallflate -->
  <g class="plate">
    <path d="M 410,144 h 40 c 42,52 42,264 0,312 h -40 a 14,14 0 0 1 -14,-14 v -284 a 14,14 0 0 1 14,-14 z"
          fill="url(#skall)"/>
    <path d="M 450,144 c 42,52 42,264 0,312"
          fill="none" stroke="#FBF7F0" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
    <path d="M 400,168 v 264" fill="none" stroke="#FBF7F0" stroke-width="1.6" stroke-linecap="round" opacity=".16"/>
  </g>

  <!-- vaeret preller av: stiplede, aapne spor (ikke plagg) -->
  <g fill="none" stroke="#C9BBA8" stroke-linecap="round" stroke-dasharray="9 11">
    <path class="arc a1" d="M 496,204 C 523,250 523,352 496,398" stroke-width="3" stroke-opacity=".72"/>
    <path class="arc a2" d="M 518,188 C 549,246 549,356 518,414" stroke-width="2.6" stroke-opacity=".48"/>
    <path class="arc a3" d="M 539,175 C 573,240 573,362 539,427" stroke-width="2.2" stroke-opacity=".30"/>
  </g>

  <!-- ===== 3 ord totalt ===== -->
  <g class="lab" fill="#2A211C" font-size="14.5" letter-spacing="2.6"
     text-anchor="middle" font-weight="600" fill-opacity=".78">
    <text x="186" y="546">ISOLASJON</text>
    <text x="452" y="546">VIND &amp; VANN</text>
  </g>
</svg>
</body>
</html>
