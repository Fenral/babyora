<meta charset="utf-8">
<title>Termometer</title>
<script>var q=location.search;var d=document.documentElement;
if(q.indexOf('naken')>-1)d.classList.add('naken');
if(q.indexOf('gra')>-1)d.classList.add('gra');</script>
<style>
  :root{
    --petrol:#143A38;
    --espresso:#2A211C;
    --ullkrem:#F2EADD;
    --ullkrem-lys:#FBF7F0;
    --aksent:#C8794A;
    --hairline:#C9BBA8;
    --easeOut:cubic-bezier(0.22, 1, 0.36, 1);
    --easeOutSoft:cubic-bezier(0.16, 1, 0.3, 1);
    --easeOutExpo:cubic-bezier(0.19, 1, 0.22, 1);
  }
  html,body{margin:0;padding:0;}
  body{
    background:var(--ullkrem);
    width:600px;height:600px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  svg{display:block;width:600px;height:600px;background:var(--ullkrem);}

  /* ---- naken: BARE tekst forsvinner, formene staar ---- */
  html.naken text{fill:transparent !important;}
  html.naken .tekst{color:transparent !important;}
  /* ---- graatone ---- */
  html.gra{filter:grayscale(1);}

  /* ---- bevegelse: maks 1200ms totalt ---- */
  .rail{
    stroke-dasharray:420;stroke-dashoffset:420;
    animation:tegn 420ms var(--easeOut) 0ms forwards;
  }
  @keyframes tegn{to{stroke-dashoffset:0;}}

  .tick{opacity:0;animation:kom 200ms var(--easeOutSoft) both;animation-delay:var(--d);}
  @keyframes kom{from{opacity:0}to{opacity:1}}

  .kolonne{
    transform-box:fill-box;transform-origin:center bottom;
    transform:scaleY(0.12);opacity:0;
    animation:stige 420ms var(--easeOut) 80ms both;
  }
  @keyframes stige{
    from{transform:scaleY(0.12);opacity:0;}
    to{transform:scaleY(1);opacity:1;}
  }

  .band{
    transform-box:fill-box;transform-origin:left center;
    transform:scaleX(0.05);opacity:0;
    animation:vokse 520ms var(--easeOutExpo) both;
    animation-delay:var(--d);
  }
  @keyframes vokse{
    from{transform:scaleX(0.05);opacity:0;}
    to{transform:scaleX(1);opacity:1;}
  }

  .mark{
    transform-box:fill-box;transform-origin:right center;
    transform:translateX(-12px);opacity:0;
    animation:peke 240ms var(--easeOutSoft) 960ms both;
  }
  @keyframes peke{
    from{transform:translateX(-12px);opacity:0;}
    to{transform:translateX(0);opacity:1;}
  }
  .avlesning{opacity:0;animation:kom 240ms var(--easeOutSoft) 980ms both;}

  @media (prefers-reduced-motion: reduce){
    .rail{stroke-dashoffset:0;animation:none;}
    .tick,.avlesning{opacity:1;animation:none;}
    .band{transform:scaleX(1);opacity:1;animation:none;}
    .kolonne{transform:scaleY(1);opacity:1;animation:none;}
    .mark{transform:translateX(0);opacity:1;animation:none;}
  }
</style>

<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fem lag stablet langs en temperaturskala">

    <line class="tick" style="--d:320ms" x1="167" y1="254" x2="181" y2="254"/>
    <line class="tick" style="--d:360ms" x1="161" y1="284" x2="181" y2="284"/>
    <line class="tick" style="--d:400ms" x1="167" y1="314" x2="181" y2="314"/>
    <line class="tick" style="--d:440ms" x1="167" y1="344" x2="181" y2="344"/>
    <line class="tick" style="--d:480ms" x1="161" y1="374" x2="181" y2="374"/>
    <line class="tick" style="--d:520ms" x1="167" y1="404" x2="181" y2="404"/>
    <line class="tick" style="--d:560ms" x1="167" y1="434" x2="181" y2="434"/>
  </g>

  <!-- soeylen: staar noeyaktig ved punktet der lagene begynner -->

  </g>

  <!-- ============ LAGENE ============ -->
  <!-- nederst = innerst (smalest, lysest). oeverst = ytterst (bredest, moerkest). -->

  <!-- 1  tynt ullsett : innerst, ull -->

    <rect x="183" y="436" width="132" height="34" rx="17" fill="#B8BCB2"/>

  </g>

  <!-- 2  fleecesett : mellomlag, fleece -->
  <g class="band" style="--d:420ms">
    <rect x="183" y="388" width="162" height="34" rx="17" fill="#909D94"/>
    <rect x="183" y="388" width="162" height="34" rx="17" fill="url(#fleeceFloss)"/>
    <rect x="183.9" y="388.9" width="160.2" height="32.2" rx="16.1" fill="none" stroke="#143A38" stroke-opacity="0.16" stroke-width="1"/>

  <!-- 3  vinddress : ytterst, skall (glatt, ingen tekstur) -->

    <rect x="183" y="292" width="222" height="34" rx="17" fill="url(#ullLysTraad)"/>
  </g>

  <!-- 5  ullsokker : foetter, ull -->
  <g class="band" style="--d:540ms">
    <rect x="183" y="244" width="252" height="34" rx="17" fill="#143A38"/>
    <rect x="183" y="244" width="252" height="34" rx="17" fill="url(#ullLysTraad)"/>
  </g>

  <!-- ============ PUNKTET VI STAAR PAA ============ -->
  <!-- eneste bruk av varm aksent -->
  <path class="mark" d="M153 457 L178 470 L153 483 Z" fill="#C8794A"/>

  <g class="avlesning">
    <text x="208" y="520" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="17" font-weight="500" letter-spacing="0.02em" fill="#2A211C">11°</text>
  </g>

  </g>
</svg>
