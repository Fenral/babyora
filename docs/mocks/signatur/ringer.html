<script>var q=location.search;var d=document.documentElement;
if(q.indexOf('naken')>-1)d.classList.add('naken');
if(q.indexOf('gra')>-1)d.classList.add('gra');</script>
<title>Ringer</title>
<style>
  :root{
    --petrol:#143A38;
    --espresso:#2A211C;
    --ullkrem:#F2EAdD;
    --ullkrem-lys:#FBF7F0;
    --aksent:#C8794A;
    --hairline:#C9BBA8;
    --easeOut:cubic-bezier(0.22, 1, 0.36, 1);
    --easeOutSoft:cubic-bezier(0.16, 1, 0.3, 1);
    --easeOutExpo:cubic-bezier(0.19, 1, 0.22, 1);
    --iosDrawer:cubic-bezier(0.32, 0.72, 0, 1);
  }
  html,body{margin:0;padding:0;background:var(--ullkrem);}
  body{width:600px;height:600px;overflow:hidden;}
  svg{display:block;width:600px;height:600px;}

  /* ---- former: fargen settes via klasse, ikke via arvet fill ---- */
  .form{fill:none;}
  .ull   {stroke:rgba(20,58,56,0.42);}
  .fleece{stroke:rgba(42,33,28,0.58);}
  .skall {stroke:#143A38;}
  .kjerne{fill:#C8794A;}
  .tekstur{stroke:#FBF7F0;fill:none;stroke-linecap:round;}

  /* ---- tegne-inn: innerst -> ytterst, staggerStep 40ms, easeOutExpo ---- */
  .tegn{stroke-dasharray:1;stroke-dashoffset:1;
        animation:tegn 560ms var(--easeOutExpo) forwards;
        animation-delay:calc(var(--i) * 40ms);}
  @keyframes tegn{to{stroke-dashoffset:0;}}

  .tekstur{opacity:0;animation:mykInn 320ms var(--easeOutSoft) forwards;
           animation-delay:calc(220ms + var(--i) * 40ms);}
  @keyframes mykInn{to{opacity:var(--o);}}

  .kjerne{transform-origin:300px 288px;transform:scale(0.2);opacity:0;
          animation:kjerneInn 320ms var(--easeOut) forwards;}
  @keyframes kjerneInn{to{transform:scale(1);opacity:1;}}

  .ikon{opacity:0;animation:mykInn 300ms var(--iosDrawer) 760ms forwards;--o:1;}

  /* ---- varianter ---- */
  html.naken text{fill:transparent !important;}
  html.naken .tekst{color:transparent !important;}
  html.gra{filter:grayscale(1);}

  @media (prefers-reduced-motion: reduce){
    .tegn,.tekstur,.kjerne,.ikon{animation:none !important;}
    .tegn{stroke-dashoffset:0;}
    .tekstur{opacity:var(--o);}
    .kjerne{transform:scale(1);opacity:1;}
    .ikon{opacity:1;}
  }
</style>

<svg viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Fem lag">

  <!-- ============ STORT GREP: 5 konsentriske lag ============ -->
  <g transform="translate(0,-12)">

    <!-- kjerne: barnet, innerst mot hud (eneste aksentbruk) -->
    <circle class="kjerne" cx="300" cy="300" r="13"/>

    <!-- 1 - tynt ullsett (innerst, ull: strikk-stipling) -->
    <circle class="form ull tegn" style="--i:0" cx="300" cy="300" r="58"
            pathLength="1" stroke-width="16" stroke-linecap="butt"/>
    <circle class="tekstur" style="--i:0;--o:.55" cx="300" cy="300" r="58"
            stroke-width="6.5" stroke-dasharray="2 7"/>

    <!-- 2 - fleecesett (mellomlag, tykkest, luggtekstur) -->
    <circle class="form fleece tegn" style="--i:1" cx="300" cy="300" r="94"
            pathLength="1" stroke-width="28" stroke-linecap="butt"/>
    <circle class="tekstur" style="--i:1;--o:.34" cx="300" cy="300" r="94"
            stroke-width="28" stroke-dasharray="3.5 11" stroke-linecap="butt"/>

    <!-- 3 - vinddress (ytterste hele ring: tynn, glatt, hard skall) -->
    <circle class="form skall tegn" style="--i:2" cx="300" cy="300" r="136"
            pathLength="1" stroke-width="11" stroke-linecap="butt"/>

    <!-- 4 - tynn lue (hode: sammenhengende bue OVER toppen) -->
    <path class="form ull tegn" style="--i:3"
          d="M 160.7 206.1 A 168 168 0 0 1 439.3 206.1"
          pathLength="1" stroke-width="19" stroke-linecap="round"/>
    <path class="tekstur" style="--i:3;--o:.55"
          d="M 160.7 206.1 A 168 168 0 0 1 439.3 206.1"
          stroke-width="7.5" stroke-dasharray="2 7"/>

    <!-- 5 - ullsokker (foetter: to korte buer NEDERST, ett par) -->
    <path class="form ull tegn" style="--i:4"
          d="M 452.3 423.3 A 196 196 0 0 1 337.4 492.4"
          pathLength="1" stroke-width="19" stroke-linecap="round"/>
    <path class="form ull tegn" style="--i:4"
          d="M 262.6 492.4 A 196 196 0 0 1 147.7 423.3"
          pathLength="1" stroke-width="19" stroke-linecap="round"/>
    <path class="tekstur" style="--i:4;--o:.55"
          d="M 452.3 423.3 A 196 196 0 0 1 337.4 492.4"
          stroke-width="7.5" stroke-dasharray="2 7"/>
    <path class="tekstur" style="--i:4;--o:.55"
          d="M 262.6 492.4 A 196 196 0 0 1 147.7 423.3"
          stroke-width="7.5" stroke-dasharray="2 7"/>
  </g>

  <!-- ============ 32px-BEVIS (samme grep, optisk justert) ============ -->
  <g class="ikon" transform="translate(536,536)">
    <g class="form" transform="translate(0,-1.2)">
      <circle class="ull"    cx="16" cy="16" r="3.0" fill="none" stroke-width="2.0"/>
      <circle class="fleece" cx="16" cy="16" r="6.2" fill="none" stroke-width="2.8"/>
      <circle class="skall"  cx="16" cy="16" r="9.3" fill="none" stroke-width="1.6"/>
      <path class="ull" fill="none" stroke-width="2.1" stroke-linecap="round"
            d="M 5.97 9.23 A 12.1 12.1 0 0 1 26.03 9.23"/>
      <path class="ull" fill="none" stroke-width="2.1" stroke-linecap="round"
            d="M 27.35 25.19 A 14.6 14.6 0 0 1 18.79 30.33"/>
      <path class="ull" fill="none" stroke-width="2.1" stroke-linecap="round"
            d="M 13.21 30.33 A 14.6 14.6 0 0 1 4.65 25.19"/>
    </g>
  </g>
</svg>
