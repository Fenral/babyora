<style>
:root{
  --petrol:#143A38;
  --espresso:#2A211C;
  --krem:#F2EADD;
  --kremlys:#FBF7F0;
  --aksent:#C8794A;
  --hair:#C9BBA8;
}
html,body{margin:0;padding:0;background:var(--krem);}
body{width:600px;height:600px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
svg{display:block;width:600px;height:600px;}

.post{stroke:var(--hair);stroke-width:3;stroke-linecap:round;fill:none;}
.line{stroke:var(--espresso);stroke-width:2.6;stroke-linecap:round;fill:none;opacity:.62;
  stroke-dasharray:760;stroke-dashoffset:760;
  animation:draw 520ms cubic-bezier(0.16,1,0.3,1) forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}

.f1{fill:#607670;}
.f2{fill:#375652;}
.f3{fill:var(--petrol);}
.f4{fill:var(--espresso);}
.pin{fill:var(--espresso);}
.pin-start{fill:var(--aksent);}
.detalj{stroke:var(--kremlys);stroke-opacity:.42;stroke-width:2;stroke-linecap:round;fill:none;}
.rib{stroke:var(--kremlys);stroke-opacity:.26;stroke-width:1.6;stroke-linecap:round;fill:none;}

.plagg{opacity:0;transform-box:view-box;animation:sving 640ms cubic-bezier(0.22,1,0.36,1) forwards;}
#p1{transform-origin:105px 200px;animation-delay:300ms;}
#p2{transform-origin:200px 252px;animation-delay:340ms;}
#p3{transform-origin:316px 250px;animation-delay:380ms;}
#p4{transform-origin:405px 224px;animation-delay:420ms;}
#p5{transform-origin:478px 193px;animation-delay:460ms;}
@keyframes sving{
  0%{opacity:0;transform:rotate(-7deg) translateY(-7px);}
  55%{opacity:1;}
  100%{opacity:1;transform:rotate(0deg) translateY(0);}
}

.tekst{fill:var(--espresso);fill-opacity:.5;font-family:Georgia,'Times New Roman',serif;
  font-size:13px;letter-spacing:.2em;}

html.naken text{fill:transparent !important;}
html.naken .tekst{color:transparent !important;fill:transparent !important;}
html.gra{filter:grayscale(1);}

@media (prefers-reduced-motion: reduce){
  .plagg{animation:none !important;opacity:1 !important;transform:none !important;}
  .line{animation:none !important;stroke-dashoffset:0 !important;}
}
</style>
