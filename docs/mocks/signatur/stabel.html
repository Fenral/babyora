<title>Stabel</title>
<script>var q=location.search;var d=document.documentElement;
if(q.indexOf('naken')>-1)d.classList.add('naken');
if(q.indexOf('gra')>-1)d.classList.add('gra');</script>
<style>
  html,body{margin:0;padding:0;background:#F2EADD;}
  body{width:600px;height:600px;overflow:hidden;}
  svg{display:block;width:600px;height:600px;}

  html.naken text { fill: transparent !important; }
  html.naken .tekst { color: transparent !important; }
  html.gra { filter: grayscale(1); }

  @keyframes land {
    from { opacity: 0; transform: translateY(-34px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .el { animation: land 620ms cubic-bezier(0.16, 1, 0.3, 1) both; }

  @media (prefers-reduced-motion: reduce) {
    .el { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
<svg id="c" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('c');

  var defs = document.createElementNS(NS,'defs');
  defs.innerHTML =
    '<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="9"/>' +
    '</filter>' +
    '<filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="5"/>' +
    '</filter>';
  svg.appendChild(defs);

  function lerp(p,q,t){ return [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t]; }
  function n(a){ return a[0].toFixed(2)+' '+a[1].toFixed(2); }

  // Isometrisk avrundet plate (rombe med myke hjoerner)
  function iso(cx,cy,w,d,f){
    var A=[cx,cy-d], B=[cx+w,cy], C=[cx,cy+d], D=[cx-w,cy];
    var s = 'M '+n(lerp(A,B,f));
    s += ' L '+n(lerp(A,B,1-f))+' Q '+n(B)+' '+n(lerp(B,C,f));
    s += ' L '+n(lerp(B,C,1-f))+' Q '+n(C)+' '+n(lerp(C,D,f));
    s += ' L '+n(lerp(C,D,1-f))+' Q '+n(D)+' '+n(lerp(D,A,f));
    s += ' L '+n(lerp(D,A,1-f))+' Q '+n(A)+' '+n(lerp(A,B,f))+' Z';
    return s;
  }

  function el(name, attrs){
    var e = document.createElementNS(NS,name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // p: {cx,cy,w,d,t,f,top,side,edge,tex,delay,shadow}
  function plate(p){
    var g = el('g', {'class':'el'});
    g.style.animationDelay = p.delay + 'ms';

    if (p.shadow){
      g.appendChild(el('ellipse',{
        cx:p.shadow.cx, cy:p.shadow.cy, rx:p.shadow.rx, ry:p.shadow.ry,
        fill:'#C9BBA8', opacity:p.shadow.o, filter:'url(#'+(p.shadow.f||'soft')+')'
      }));
    }

    var dTop = iso(p.cx, p.cy, p.w, p.d, p.f);

    // ekstrudering: kopier 1px av gangen -> massiv tykkelse med myke hjoerner
    for (var i = p.t; i >= 1; i--){
      var a = { d: dTop, fill: p.side, transform: 'translate(0 '+i+')' };
      if (p.edge && i === p.t){ a.stroke = p.edge; a['stroke-width'] = 1.5; }
      g.appendChild(el('path', a));
    }

    var topAttrs = { d: dTop, fill: p.top };
    if (p.edge){ topAttrs.stroke = p.edge; topAttrs['stroke-width'] = 1.5; }
    g.appendChild(el('path', topAttrs));

    // materialkarakter i kanten
    if (p.tex === 'ull'){
      g.appendChild(el('path',{
        d: iso(p.cx, p.cy, p.w-7, p.d-3, p.f),
        fill:'none', stroke:'#C9BBA8', 'stroke-width':2.6,
        'stroke-dasharray':'0.1 6', 'stroke-linecap':'round', opacity:0.5
      }));
    } else if (p.tex === 'fleece'){
      g.appendChild(el('path',{
        d: iso(p.cx, p.cy, p.w-15, p.d-7, p.f),
        fill:'none', stroke:'#FBF7F0', 'stroke-width':1.8,
        'stroke-dasharray':'7 8', 'stroke-linecap':'round', opacity:0.55
      }));
      g.appendChild(el('path',{
        d: iso(p.cx, p.cy, p.w-30, p.d-14, p.f),
        fill:'none', stroke:'#FBF7F0', 'stroke-width':1.4,
        'stroke-dasharray':'5 9', 'stroke-linecap':'round', opacity:0.35
      }));
    } else if (p.tex === 'skall'){
      g.appendChild(el('path',{
        d: iso(p.cx, p.cy, p.w-13, p.d-6, 0.09),
        fill:'none', stroke:'#143A38', 'stroke-width':1, opacity:0.4
      }));
    }
    return g;
  }

  var plates = [
    // 5 ullsokker - hoerer til foettene, nederst i bildet. Ull: tykk, myk kant.
    { cx:352, cy:443, w:50, d:22, t:16, f:0.42, top:'#143A38', side:'#2A211C', tex:'ull',
      delay:0,   shadow:{cx:352, cy:465, rx:54, ry:23, o:0.26, f:'soft2'} },
    { cx:250, cy:429, w:50, d:22, t:16, f:0.42, top:'#143A38', side:'#2A211C', tex:'ull',
      delay:40,  shadow:{cx:250, cy:451, rx:54, ry:23, o:0.26, f:'soft2'} },

    // 1 tynt ullsett - innerst, nederst i stabelen. Tykkest plate, mykeste hjoerner.
    { cx:300, cy:283, w:160, d:67, t:24, f:0.40, top:'#143A38', side:'#2A211C', tex:'ull',
      delay:80,  shadow:{cx:300, cy:323, rx:165, ry:60, o:0.26} },

    // 2 fleecesett - mellomlag. Luftig loft, mellomtykk.
    { cx:300, cy:265, w:120, d:50, t:18, f:0.32, top:'#C9BBA8', side:'#2A211C', tex:'fleece',
      delay:120, shadow:{cx:300, cy:285, rx:122, ry:48, o:0.12, f:'soft2'} },

    // 3 vinddress - ytterst, oeverst. Tynn og hard kant.
    { cx:300, cy:256, w:82, d:34, t:9, f:0.10, top:'#FBF7F0', side:'#C9BBA8',
      edge:'#143A38', tex:'skall',
      delay:160, shadow:{cx:300, cy:267, rx:84, ry:34, o:0.10, f:'soft2'} },

    // 4 tynn lue - hoerer til hodet, oeverst i bildet. Tynn plate.
    { cx:300, cy:143, w:58, d:24, t:11, f:0.46, top:'#C8794A', side:'#2A211C',
      delay:200, shadow:{cx:300, cy:162, rx:62, ry:25, o:0.26, f:'soft2'} }
  ];

  plates.forEach(function(p){ svg.appendChild(plate(p)); });
})();
</script>
