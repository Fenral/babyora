<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Påkledning · P3 Postmates-rad (fold-safe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg-canvas:#DBD8D2;
  --bg-canvas-soft:#E5E2DC;
  --surface:#FFFFFF;
  --surface-soft:#F4F1EC;

  --terracotta-500:#C0632F;
  --terracotta-600:#B4502E;
  --terracotta-700:#A9492A;
  --terracotta-100:#F4E4D8;
  --terracotta-700-on-100:#8A3618;

  /* Lag-farger */
  --layer-ytterst:#C0632F;
  --layer-mellom:#5E8C6A;
  --layer-innerst:#3F5A78;
  --layer-tilbehor:#7A6E63;

  --ink-900:#2B2B2B;
  --ink-700:#5A514C;
  --ink-500:#A89E97;
  --ink-300:#C9C3BD;
  --ink-200:#E3DED7;

  --font-sans:'Schibsted Grotesk',-apple-system,system-ui,sans-serif;
  --font-serif:'DM Serif Display',Georgia,serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#1a1a1a;font-family:var(--font-sans);}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink-900);}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* iPhone-frame 390×844 */
.frame{
  position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 12px #1f1f1f, 0 0 0 13px #333;
  background:linear-gradient(180deg,#C7D6E1 0%,#DEE1DD 45%,#E9E1D6 100%);
}

.screen{
  position:relative;height:100%;width:100%;display:flex;flex-direction:column;
  font-family:var(--font-sans);color:var(--ink-900);
  padding-top:env(safe-area-inset-top,0px);
}
.screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 46% at 50% -8%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%);
}

/* Topbar */
.topbar{
  position:relative;z-index:5;flex:none;
  height:calc(44px + 8px);
  margin-top:46px;
  padding:0 16px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(43,43,43,.08);
}
.back-btn{
  width:36px;height:36px;flex:none;border-radius:11px;
  background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.06);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  padding:0;
}
.back-btn:active{transform:scale(.96);}
.topbar-title{
  flex:1;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.3px;
  color:var(--ink-900);
}
.meta-pill{
  flex:none;display:flex;align-items:center;gap:6px;
  padding:7px 11px;border-radius:11px;
  background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.06);
  font-size:12px;font-weight:600;color:var(--ink-700);letter-spacing:.1px;
}
.meta-pill .temp-fig{font-family:var(--font-serif);font-weight:400;font-size:13.5px;letter-spacing:-.2px;color:var(--ink-900);}

/* Kontekst-linje under topbar — kort, ikke avatar-tung */
.context-band{
  position:relative;z-index:4;flex:none;
  padding:14px 20px 10px;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
}
.context-band .who{
  font-size:15px;font-weight:600;color:var(--ink-900);letter-spacing:-.1px;
}
.context-band .mode{
  font-size:12.5px;font-weight:500;color:var(--ink-700);
}

/* Section header — Postmates-vibe ("Cooking Instructions"-pattern) */
.section-head{
  position:relative;z-index:3;flex:none;
  padding:6px 20px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.section-head .h-title{
  font-family:var(--font-serif);
  font-size:22px;font-weight:400;letter-spacing:-.4px;
  color:var(--ink-900);
  line-height:1.1;
}
.section-head .h-count{
  font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--ink-500);
}

/* Scroll-area — uniform høyde-rader, ingen scroll-snap */
.scroll-area{
  position:relative;z-index:3;
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:4px 0 120px;
  scrollbar-width:none;
}
.scroll-area::-webkit-scrollbar{display:none;}

/* Rad-container (kjerne i Postmates-mønsteret) */
.row-list{
  display:flex;flex-direction:column;
  padding:0 20px;
}

/* Hver rad: 3-kolonne [kategori 56px] [navn 1fr] [bilde 56px] */
.row{
  display:grid;
  grid-template-columns:56px 1fr 56px;
  column-gap:14px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--ink-200);
  text-align:left;
  background:transparent;border-left:none;border-right:none;border-top:none;
  cursor:pointer;
  font-family:var(--font-sans);
  transition:background 120ms ease;
  width:100%;
  min-height:82px;
}
.row:active{background:rgba(43,43,43,.03);}
.row:last-of-type{border-bottom:none;}

/* Kategori-label (venstre) */
.row .cat{
  font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  line-height:1.15;
  text-align:left;
}
.row .cat.ytterst{color:var(--layer-ytterst);}
.row .cat.mellom{color:var(--layer-mellom);}
.row .cat.innerst{color:var(--layer-innerst);}
.row .cat.tilbehor{color:var(--layer-tilbehor);}

/* Navn + sub (midten) */
.row .body{
  min-width:0;
  display:flex;flex-direction:column;gap:3px;
}
.row .name{
  font-size:16px;font-weight:600;color:var(--ink-900);letter-spacing:-.2px;
  line-height:1.2;
}
.row .spec{
  font-size:12px;font-weight:500;color:var(--ink-500);
  line-height:1.3;
}

/* Plagg-bilde (høyre) — 56×56 rounded surface */
.row .thumb{
  width:56px;height:56px;flex:none;
  border-radius:12px;
  background-color:var(--surface);
  background-size:42px 42px;background-repeat:no-repeat;background-position:center;
  box-shadow:0 1px 2px rgba(43,37,34,.04),inset 0 0 0 1px rgba(43,43,43,.04);
  filter:none;
  position:relative;
}
.row .thumb::after{
  /* drop-shadow på innholdet via filter på pseudo, men her bruker vi simple shadow på selve thumb */
  content:"";
}

/* Section divider (mellom hovedlag og tilbehør) */
.subhead{
  display:flex;align-items:center;gap:12px;
  padding:18px 20px 6px;
}
.subhead .label{
  font-family:var(--font-serif);
  font-size:18px;font-weight:400;letter-spacing:-.3px;
  color:var(--ink-900);
}
.subhead .line{flex:1;height:1px;background:var(--ink-200);}
.subhead .count{
  font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--ink-500);
}

/* Footnote (subtil, Postmates-style) */
.foot-note{
  padding:14px 20px 4px;
  font-size:11.5px;font-weight:500;color:var(--ink-500);
  line-height:1.4;
}

/* Sticky CTA */
.sticky-cta{
  position:absolute;left:0;right:0;bottom:0;
  z-index:10;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:linear-gradient(180deg,rgba(219,216,210,0) 0%, rgba(219,216,210,.92) 28%, rgba(219,216,210,.98) 100%);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.cta-btn{
  width:100%;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:17px 24px;border-radius:18px;border:none;cursor:pointer;
  background:linear-gradient(140deg,var(--terracotta-500) 0%,var(--terracotta-700) 100%);
  box-shadow:0 1px 2px rgba(43,43,43,.06),0 12px 24px rgba(169,73,42,.32);
  font-family:var(--font-sans);
  transition:transform 120ms ease;
}
.cta-btn:active{transform:translateY(1px) scale(.99);}
.cta-btn span{font-size:16px;font-weight:600;color:#FFF;letter-spacing:.1px;}
.cta-btn svg{flex:none;}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  .row,.cta-btn,.back-btn{transition:none !important;}
}
</style>
</head>
<body>
  <div class="frame">
    <main class="screen" aria-label="Slik kler du Liv">
      <h1 class="sr-only">Påkledning — Slik kler du Liv</h1>

      <!-- Topbar -->
      <div class="topbar" role="banner">
        <button class="back-btn" aria-label="Tilbake">
          <svg width="9" height="16" viewBox="0 0 12 20" fill="none" stroke="#2B2B2B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2L2 10l8 8"/></svg>
        </button>
        <div class="topbar-title">Slik kler du Liv</div>
        <div class="meta-pill" aria-label="Minus 22 grader, ekstrem kulde">
          <span class="temp-fig">−22°</span>
          <span aria-hidden="true">·</span>
          <span>Ekstrem kulde</span>
        </div>
      </div>

      <!-- Kontekst: hvem + modus -->
      <div class="context-band" aria-label="Liv, 14 måneder, utenfor vogn">
        <div class="who">Liv · 14 mnd</div>
        <div class="mode">Utenfor vogn · Karasjok</div>
      </div>

      <!-- Section head — "Påkledning" som hovedtittel à la Postmates Cooking Instructions -->
      <div class="section-head">
        <div class="h-title">Påkledning</div>
        <div class="h-count">5 lag</div>
      </div>

      <!-- Scroll-area — uniform rad-liste -->
      <div class="scroll-area">

        <div class="row-list" role="list" aria-label="Anbefalte plagg i lag fra ytterst til innerst">

          <!-- YTTERST -->
          <button class="row" type="button" role="listitem" aria-label="Ytterst: Vinterdress, vind- og vanntett ytterskall">
            <div class="cat ytterst">Ytterst</div>
            <div class="body">
              <div class="name">Vinterdress</div>
              <div class="spec">Vind- og vanntett ytterskall</div>
            </div>
            <div class="thumb" style="background-image:url(../illustrations/garments/vinterdress.png);" aria-hidden="true"></div>
          </button>

          <!-- MELLOM (1 av 2) -->
          <button class="row" type="button" role="listitem" aria-label="Mellom: Ullsett tykt, holder på varmen og puster">
            <div class="cat mellom">Mellom</div>
            <div class="body">
              <div class="name">Ullsett, tykt</div>
              <div class="spec">Holder på varmen, puster</div>
            </div>
            <div class="thumb" style="background-image:url(../illustrations/garments/ullsett-tykt.png);" aria-hidden="true"></div>
          </button>

          <!-- MELLOM (2 av 2) -->
          <button class="row" type="button" role="listitem" aria-label="Mellom: Fleecejakke, ekstra isolasjon">
            <div class="cat mellom">Mellom</div>
            <div class="body">
              <div class="name">Fleecejakke</div>
              <div class="spec">Ekstra isolasjon i ekstrem kulde</div>
            </div>
            <div class="thumb" style="background-image:url(../illustrations/garments/ull-jakke.png);" aria-hidden="true"></div>
          </button>

          <!-- INNERST (1 av 2) -->
          <button class="row" type="button" role="listitem" aria-label="Innerst: Ullbody langermet, mykt mot huden">
            <div class="cat innerst">Innerst</div>
            <div class="body">
              <div class="name">Ullbody, langermet</div>
              <div class="spec">Mykt mot huden, fukttransport</div>
            </div>
            <div class="thumb" style="background-image:url(../illustrations/garments/langermet-ullbody.png);" aria-hidden="true"></div>
          </button>

          <!-- INNERST (2 av 2) -->
          <button class="row" type="button" role="listitem" aria-label="Innerst: Tynn bukse i ull, base-lag">
            <div class="cat innerst">Innerst</div>
            <div class="body">
              <div class="name">Tynn bukse</div>
              <div class="spec">Ullbase under vinterdress</div>
            </div>
            <div class="thumb" style="background-image:url(../illustrations/garments/tynn-bukse.png);" aria-hidden="true"></div>
          </button>

        </div>

        <!-- Tilbehør — egen seksjon, samme rad-format -->
        <div class="subhead">
          <span class="label">Pluss tilbehør</span>
          <span class="line" aria-hidden="true"></span>
          <span class="count">3 ting</span>
        </div>

        <div class="row-list" role="list" aria-label="Tilbehør">
          <button class="row" type="button" role="listitem" aria-label="Tilbehør: Lue med ull">
            <div class="cat tilbehor">Tilbehør</div>
            <div class="body">
              <div class="name">Lue</div>
              <div class="spec">Med ull, dekker ører</div>
            </div>
            <div class="thumb" style="background-image:url(../illustrations/garments/lue-m-ull.png);" aria-hidden="true"></div>
          </button>

          <button class="row" type="button" role="listitem" aria-label="Tilbehør: Vindvotter med skall">
            <div class="cat tilbehor">Tilbehør</div>
            <div class="body">
              <div class="name">Votter</div>
              <div class="spec">Vindtett skall</div>
            </div>
            <div class="thumb" style="background-image:url(../illustrations/garments/vindvotter-skall.png);" aria-hidden="true"></div>
          </button>

          <button class="row" type="button" role="listitem" aria-label="Tilbehør: Ullsokker">
            <div class="cat tilbehor">Tilbehør</div>
            <div class="body">
              <div class="name">Ullsokker</div>
              <div class="spec">Holder tær varme</div>
            </div>
            <div class="thumb" style="background-image:url(../illustrations/garments/ullsokker.png);" aria-hidden="true"></div>
          </button>
        </div>

        <p class="foot-note">Skalerer fra 3 til 20+ plagg uten brudd. Hver rad er like høy.</p>

      </div>

      <!-- Sticky CTA -->
      <div class="sticky-cta">
        <button class="cta-btn" type="button" aria-label="Klar for tur">
          <span>Klar for tur</span>
          <svg width="22" height="13" viewBox="0 0 26 14" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7h20"/><path d="M17 2l5 5-5 5"/></svg>
        </button>
      </div>
    </main>
  </div>
</body>
</html>
