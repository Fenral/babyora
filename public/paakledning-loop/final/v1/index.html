<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Påkledning · Final V1 — Anatomisk ro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg-canvas:#DBD8D2;
  --bg-canvas-soft:#E5E2DC;
  --bg-canvas-deep:#CFCBC2;

  /* Terracotta-familien — innerlag av merke-paletten */
  --terracotta-500:#C0632F;
  --terracotta-600:#B4502E;
  --terracotta-700:#A9492A;
  --terracotta-100:#F4E4D8;
  --terracotta-700-on-100:#8A3618;

  /* Eksklusiv CTA-orange — skjøvet bort fra ytterst-laget */
  --cta-orange:#E85A1F;
  --cta-orange-deep:#B83F12;

  /* Lag-territorier — bred hue-spread, kontrollerte L* (alle ≈48) */
  --layer-ytterst:#B45A24;     /* burnt sienna · oklch(.52 .14 50) */
  --layer-mellom:#5E8C6A;      /* sage · oklch(.55 .07 145) */
  --layer-innerst:#3F5A78;     /* slate-blue · oklch(.48 .07 245) */
  --layer-tilbehor:#7B6A58;    /* warm taupe · oklch(.52 .03 60) */

  /* Pro/Con — pro=sage (matcher mellom), con=mørk amber (ikke terracotta) */
  --pro-green:#3D6048;
  --con-amber:#946018;

  --ink-900:#2B2B2B;
  --ink-700:#5A514C;
  --ink-500:#A89E97;
  --ink-300:#C9C3BD;

  --card-bg:#FFFFFF;
  --card-shadow:0 1px 2px rgba(43,37,34,.05),0 8px 18px rgba(43,37,34,.09);

  --font-sans:'Schibsted Grotesk',-apple-system,system-ui,sans-serif;
  --font-serif:'DM Serif Display',Georgia,serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#1a1a1a;font-family:var(--font-sans);}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink-900);}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

.frame{
  position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 12px #1f1f1f, 0 0 0 13px #333;
  background:var(--bg-canvas);
}
.screen{
  position:relative;height:100%;width:100%;display:flex;flex-direction:column;
  color:var(--ink-900);
  padding-top:env(safe-area-inset-top,0px);
  background:var(--bg-canvas);
}
.screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 46% at 50% -8%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%);
}

/* Topbar */
.topbar{
  position:relative;z-index:5;flex:none;
  height:52px;margin-top:46px;padding:0 16px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(43,43,43,.06);
}
.back-btn{
  width:44px;height:44px;flex:none;border-radius:11px;
  background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.06);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.back-btn:active{transform:scale(.96);}
.topbar-title{
  flex:1;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--ink-900);
}
.meta-pill{
  flex:none;display:flex;align-items:center;gap:6px;
  padding:7px 11px;border-radius:11px;
  background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.06);
  font-size:12px;font-weight:600;color:var(--ink-700);letter-spacing:.1px;
}
.meta-pill .temp-fig{font-family:var(--font-serif);font-weight:400;font-size:13.5px;letter-spacing:-.2px;color:var(--ink-900);}

.scroll-area{
  position:relative;z-index:3;
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:14px 16px 130px;scrollbar-width:none;
}
.scroll-area::-webkit-scrollbar{display:none;}

.canvas-intro{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 4px 10px;
}
.canvas-intro .label{
  font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-500);
}
.canvas-intro .who{
  font-size:12.5px;font-weight:600;color:var(--ink-700);letter-spacing:-.1px;
}

/* Helper-banner */
.helper-banner{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-radius:14px;background:var(--card-bg);
  box-shadow:0 1px 2px rgba(43,37,34,.04),0 4px 10px rgba(43,37,34,.06);
  margin-bottom:14px;
}
.helper-banner svg{flex:none;}
.helper-banner .text{
  flex:1;font-size:12.5px;color:var(--ink-700);line-height:1.35;letter-spacing:-.1px;
}
.helper-banner .text b{color:var(--ink-900);font-weight:600;}

/* ============================================================
   ANATOMISK STACK — én lag-koding (kun anchor-dot på kant)
   Ingen rail, ingen connector-lines, ingen legend.
   Lag-info bor i bottom-sheet ved tap.
   ============================================================ */
.stack-canvas{
  position:relative;
  width:100%;min-height:600px;
  border-radius:24px;
  background:linear-gradient(180deg, var(--bg-canvas-soft) 0%, var(--bg-canvas) 60%, var(--bg-canvas-deep) 100%);
  border:1px solid rgba(43,43,43,.05);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 1px 2px rgba(43,37,34,.04);
  margin-bottom:16px;
  overflow:hidden;
  padding:22px 0 26px;
}
.stack-canvas::before{
  content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 18%);
}

/* Vertikal subtil “kropp-akse” for å forsterke anatomisk metafor */
.body-axis{
  position:absolute;left:50%;top:14px;bottom:18px;width:1px;
  transform:translateX(-50%);
  background:linear-gradient(180deg, rgba(43,37,34,0) 0%, rgba(43,37,34,.06) 12%, rgba(43,37,34,.06) 88%, rgba(43,37,34,0) 100%);
  z-index:1;pointer-events:none;
}

.stack-list{
  position:relative;z-index:3;
  --col-w:300px;
  display:flex;flex-direction:column;align-items:center;
  list-style:none;padding:0;margin:0;
}

.stack-item{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  width:100%;
}

.garment-btn{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  min-width:44px;min-height:44px;
  transition:transform 180ms ease;
}
.garment-btn:focus-visible{outline:2px solid var(--terracotta-500);outline-offset:6px;border-radius:14px;}
.garment-btn:active{transform:scale(.97);}

.garment-img{
  background-size:contain;background-repeat:no-repeat;background-position:center;
  filter:drop-shadow(2px 6px 12px rgba(74,68,58,.22)) drop-shadow(0 2px 3px rgba(74,68,58,.14));
  pointer-events:none;
}

/* ENESTE lag-koding: liten farget anchor-dot på siden av plagget */
.anchor-dot{
  position:absolute;
  width:10px;height:10px;border-radius:50%;
  z-index:4;
  box-shadow:0 0 0 2px #FBFAF7, 0 1px 3px rgba(43,37,34,.22);
}
.anchor-dot.ytterst {background:var(--layer-ytterst);}
.anchor-dot.mellom  {background:var(--layer-mellom);}
.anchor-dot.innerst {background:var(--layer-innerst);}
.anchor-dot.tilbehor{background:var(--layer-tilbehor);}

/* Pulse */
.pulse-ring{
  position:absolute;inset:-6px;
  border-radius:24px;pointer-events:none;opacity:0;z-index:1;
}
.stack-item[data-lag="ytterst"] .pulse-ring {box-shadow:0 0 0 3px var(--layer-ytterst), 0 0 16px 6px rgba(180,90,36,.4);}
.stack-item[data-lag="mellom"]  .pulse-ring {box-shadow:0 0 0 3px var(--layer-mellom),  0 0 16px 6px rgba(94,140,106,.4);}
.stack-item[data-lag="innerst"] .pulse-ring {box-shadow:0 0 0 3px var(--layer-innerst), 0 0 16px 6px rgba(63,90,120,.4);}
.stack-item[data-lag="tilbehor"] .pulse-ring {box-shadow:0 0 0 3px var(--layer-tilbehor),0 0 16px 6px rgba(123,106,88,.4);}
.stack-item.pulsing .pulse-ring{animation:pulseRing .6s ease-out;}
@keyframes pulseRing{
  0%{opacity:.6;transform:scale(.92);}
  100%{opacity:0;transform:scale(1.18);}
}

/* Swap-flash */
.swap-flash{
  position:absolute;inset:-10px;border-radius:28px;pointer-events:none;opacity:0;
  background:radial-gradient(circle, rgba(255,255,255,.85), rgba(255,255,255,0) 70%);
  z-index:1;
}
.stack-item.swapping .swap-flash{animation:swapFlash .55s ease-out;}
@keyframes swapFlash{
  0%{opacity:0;transform:scale(.85);}
  35%{opacity:1;}
  100%{opacity:0;transform:scale(1.08);}
}

/* ============================================================
   DATADREVET størrelser via CSS custom properties (Tiltak iter-3 #3)
   Hvert plagg: --h (høyde), --w (bredde), --overlap (negativ margin, unit-less)
   ============================================================ */
.stack-item .garment-img{
  width:calc(var(--w,140) * 1px);
  height:calc(var(--h,140) * 1px);
}
.stack-item{
  margin-top:calc(var(--overlap,-20) * 1px);
}

/* Items */
.item-lue          { --w:80;  --h:80;  --overlap:0;   z-index:9; }
.item-vinterdress  { --w:160; --h:180; --overlap:-25; z-index:8; }
.item-fleecejakke  { --w:150; --h:150; --overlap:-28; z-index:7; }
.item-ullsett-tykt { --w:150; --h:150; --overlap:-28; z-index:6; }
.item-ullbody      { --w:140; --h:140; --overlap:-25; z-index:5; }
.item-tynn-bukse   { --w:130; --h:140; --overlap:-25; z-index:4; }
.item-ullsokker    { --w:90;  --h:80;  --overlap:-20; z-index:3; }

/* Anchor-dot på vekslende sider (data-side) */
.stack-item[data-side="left"]  .anchor-dot{ left:6px;  top:50%; transform:translateY(-50%); }
.stack-item[data-side="right"] .anchor-dot{ right:6px; top:50%; transform:translateY(-50%); }

/* Votter — egen layout */
.item-votter{ --overlap:-30; z-index:7; }
.votter-row{display:flex;align-items:center;justify-content:center;gap:14px;position:relative;}
.votter-row .garment-img{width:62px;height:62px;}
.votter-row .garment-img.right{transform:scaleX(-1);}
.item-votter .anchor-dot{ top:4px;left:50%;transform:translateX(48px); }

/* Sticky CTA — RENERE: solid CTA-orange, lett inset-highlight, ingen glow-clash */
.sticky-cta{
  position:absolute;left:0;right:0;bottom:0;z-index:10;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:linear-gradient(180deg,rgba(219,216,210,0) 0%, rgba(219,216,210,.92) 28%, rgba(219,216,210,.98) 100%);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.cta-btn{
  width:100%;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:17px 24px;border-radius:18px;border:none;cursor:pointer;
  background:var(--cta-orange);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.32),
    0 1px 2px rgba(43,43,43,.08),
    0 6px 14px rgba(232,90,31,.22);
  font-family:var(--font-sans);
  transition:transform 120ms ease, background 120ms ease;
}
.cta-btn:active{transform:translateY(1px) scale(.99);background:var(--cta-orange-deep);}
.cta-btn span{font-size:16px;font-weight:600;color:#FFF;letter-spacing:.1px;}

/* ========== BOTTOM SHEET ========== */
dialog.detail-sheet{
  position:absolute;bottom:0;left:0;right:0;top:auto;margin:0;
  width:100%;max-width:100%;border:none;padding:0;background:transparent;
  overflow:visible;max-height:92%;
}
dialog.detail-sheet::backdrop{
  background:rgba(20,18,16,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.sheet-inner{
  background:#FBFAF7;border-radius:24px 24px 0 0;
  padding:14px 20px 0;box-shadow:0 -8px 30px rgba(43,37,34,.3);
  animation:sheetSlide .32s cubic-bezier(.2,.8,.2,1);
  max-height:92vh;display:flex;flex-direction:column;
}
@keyframes sheetSlide{ from{transform:translateY(100%);} to{transform:translateY(0);} }
.sheet-handle{
  width:38px;height:4px;border-radius:2px;background:var(--ink-300);
  margin:0 auto 14px;flex:none;
}
.sheet-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  margin-bottom:12px;flex:none;
}
.sheet-titles{flex:1;min-width:0;}
.lag-tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:6px;
  font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  margin-bottom:6px;
}
.lag-tag.ytterst {background:#F2DECF;color:#7A3C1A;}
.lag-tag.mellom  {background:#E0EBE2;color:#33543E;}
.lag-tag.innerst {background:#DDE5EE;color:#243B57;}
.lag-tag.tilbehor{background:#EAE3DA;color:#473C30;}
.sheet-title{
  font-family:var(--font-serif);font-weight:400;
  font-size:22px;color:var(--ink-900);
  margin:0;line-height:1.15;letter-spacing:-.4px;
}
.reset-btn{
  flex:none;display:none;align-items:center;gap:6px;
  padding:6px 10px;border-radius:8px;
  background:transparent;border:1px solid rgba(43,43,43,.18);
  font-size:11.5px;font-weight:600;color:var(--ink-700);letter-spacing:-.05px;
  cursor:pointer;font-family:var(--font-sans);
}
.reset-btn.visible{display:inline-flex;}
.reset-btn:active{transform:scale(.97);background:rgba(43,43,43,.04);}
.sheet-close{
  flex:none;width:36px;height:36px;border-radius:50%;
  background:rgba(43,43,43,.05);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;margin-left:6px;
}
.sheet-close:active{transform:scale(.94);}

.sheet-scroll{
  flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:12px;
}
.sheet-scroll::-webkit-scrollbar{display:none;}

.sheet-hero{
  display:flex;align-items:center;justify-content:center;
  height:150px;
  background:linear-gradient(180deg,#F5F1EC 0%,#EDE8E1 100%);
  border-radius:18px;margin-bottom:12px;position:relative;
}
.sheet-hero-img{
  width:140px;height:140px;
  background-size:contain;background-repeat:no-repeat;background-position:center;
  filter:drop-shadow(2px 8px 12px rgba(74,68,58,.18));
  transition:opacity .25s ease;
}
.sheet-hero.swapping .sheet-hero-img{opacity:.3;}

.spec-line{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:#fff;border-radius:12px;padding:10px 14px;
  box-shadow:0 1px 2px rgba(43,37,34,.04);
  margin-bottom:12px;
  font-size:12px;color:var(--ink-700);
  flex-wrap:nowrap;overflow:hidden;
}
.spec-line .spec-item{display:flex;align-items:baseline;gap:6px;min-width:0;}
.spec-line .spec-item + .spec-item{position:relative;padding-left:14px;}
.spec-line .spec-item + .spec-item::before{
  content:"";position:absolute;left:6px;top:50%;width:1px;height:11px;
  background:rgba(43,43,43,.12);transform:translateY(-50%);
}
.spec-label{font-size:9.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-500);}
.spec-value{font-size:12.5px;font-weight:600;color:var(--ink-900);letter-spacing:-.1px;}

.proscons-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;
}
.proscons-col{
  background:#fff;border-radius:14px;padding:11px 12px;
  box-shadow:0 1px 2px rgba(43,37,34,.04);
}
.proscons-head{
  display:flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
  margin-bottom:8px;
}
.proscons-col.pros .proscons-head{color:var(--pro-green);}
.proscons-col.cons .proscons-head{color:var(--con-amber);}
.proscons-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;}
.proscons-list li{
  display:flex;align-items:flex-start;gap:6px;
  font-size:13.5px;color:var(--ink-700);line-height:1.32;letter-spacing:-.05px;
}
.proscons-list li svg{flex:none;margin-top:3px;}
.proscons-col.pros .proscons-list li svg{color:var(--pro-green);}
.proscons-col.cons .proscons-list li svg{color:var(--con-amber);}

.swap-section{
  background:#fff;border-radius:14px;padding:13px 14px;
  box-shadow:0 1px 2px rgba(43,37,34,.04);margin-bottom:14px;
}
.swap-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;
}
.swap-label{
  display:flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-700);
}
.swap-label svg{flex:none;color:var(--terracotta-700-on-100);}
.swap-hint{font-size:11px;color:var(--ink-500);font-weight:500;}
.swap-cards{
  display:flex;gap:10px;overflow-x:auto;
  margin:0 -14px;padding:2px 14px 4px;scrollbar-width:none;
}
.swap-cards::-webkit-scrollbar{display:none;}
.swap-card{
  flex:none;width:118px;
  display:flex;flex-direction:column;align-items:center;
  background:#F5F1EC;border:1px solid rgba(43,43,43,.06);
  border-radius:12px;padding:10px 8px 9px;cursor:pointer;
  font-family:var(--font-sans);
  -webkit-tap-highlight-color:transparent;
  transition:transform 140ms ease, background 140ms ease, border-color 140ms ease;
  text-align:center;position:relative;
}
.swap-card:active{transform:scale(.97);}
.swap-card:focus-visible{outline:2px solid var(--terracotta-500);outline-offset:2px;}
.swap-card-img{
  width:62px;height:62px;
  background-size:contain;background-repeat:no-repeat;background-position:center;
  filter:drop-shadow(1px 3px 6px rgba(74,68,58,.18));
  margin-bottom:6px;
}
.swap-card-name{
  font-size:11.5px;font-weight:600;color:var(--ink-900);line-height:1.2;letter-spacing:-.1px;
  margin-bottom:3px;
}
.swap-card-meta{font-size:10px;font-weight:500;color:var(--ink-500);}
.swap-card.current{
  background:#FFF3E8;border-color:rgba(180,90,36,.35);
}
.swap-card.current::after{
  content:"Valgt nå";
  position:absolute;top:4px;right:6px;
  font-size:8.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:#7A3C1A;background:#F2DECF;padding:2px 5px;border-radius:4px;
}

/* SHEET FOOTER — ÉN primær handling (tiltak iter-3 #2) */
.sheet-footer{
  flex:none;
  padding:12px 0 calc(env(safe-area-inset-bottom,0px) + 12px);
  border-top:1px solid rgba(43,43,43,.06);
  background:#FBFAF7;
  display:flex;align-items:stretch;gap:8px;
}
.footer-primary{
  flex:1;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:14px;border:none;cursor:pointer;
  background:var(--terracotta-700);color:#FFF;
  font-family:var(--font-sans);font-size:15px;font-weight:600;letter-spacing:-.05px;
  box-shadow:0 1px 2px rgba(43,43,43,.06),0 8px 18px rgba(169,73,42,.22);
  transition:transform 120ms ease, background 120ms ease;
}
.footer-primary:active{transform:translateY(1px) scale(.99);background:#923D22;}

/* Undo toast */
.undo-toast{
  position:absolute;left:16px;right:16px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-radius:14px;
  background:rgba(43,37,34,.95);color:#FBFAF7;
  font-size:13px;font-weight:500;letter-spacing:-.05px;
  box-shadow:0 8px 24px rgba(43,37,34,.35);
  transform:translateY(140%);opacity:0;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
}
.undo-toast.show{transform:translateY(0);opacity:1;}
.undo-toast .toast-text{flex:1;}
.undo-toast .toast-text b{font-weight:700;}
.undo-btn{
  background:transparent;border:none;cursor:pointer;
  color:var(--cta-orange);font-weight:700;font-size:13px;letter-spacing:.2px;
  padding:4px 6px;font-family:var(--font-sans);text-transform:uppercase;
}
.undo-btn:active{opacity:.7;}

@media (prefers-reduced-motion: reduce){
  .pulse-ring,.garment-btn,.swap-flash,.sheet-inner,.undo-toast,
  .cta-btn,.back-btn,.sheet-close,.swap-card,.footer-primary{
    animation:none !important;transition:none !important;
  }
}
</style>
</head>
<body>
  <div class="frame">
    <main class="screen" aria-label="Slik kler du Liv — Final V1 Anatomisk ro">
      <h1 class="sr-only">Påkledning — Final V1: Anatomisk ro, én lag-koding, datadrevet layout</h1>

      <div class="topbar" role="banner">
        <button class="back-btn" aria-label="Tilbake">
          <svg width="9" height="16" viewBox="0 0 12 20" fill="none" stroke="#2B2B2B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2L2 10l8 8"/></svg>
        </button>
        <div class="topbar-title">Slik kler du Liv</div>
        <div class="meta-pill" aria-label="Minus 22 grader, Karasjok">
          <span class="temp-fig">−22°</span>
          <span aria-hidden="true">·</span>
          <span>Karasjok</span>
        </div>
      </div>

      <div class="scroll-area">
        <div class="canvas-intro">
          <span class="label">Antrekk</span>
          <span class="who">Liv · 14 mnd · Utelek</span>
        </div>

        <div class="helper-banner" role="note">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5E8C6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/>
          </svg>
          <div class="text"><b>Trykk på et plagg</b> for å se hvorfor det er valgt — eller bytt det ut.</div>
        </div>

        <div class="stack-canvas" id="stack-canvas" role="region" aria-label="Antrekk vist som anatomisk stack fra topp til bunn">
          <div class="body-axis" aria-hidden="true"></div>

          <ul class="stack-list" id="stack-list" role="list">

            <li class="stack-item item-lue" data-lag="tilbehor" data-side="right">
              <button class="garment-btn" type="button" aria-label="Vis detalj for Lue (tilbehør)" data-target="lue">
                <div class="garment-img" style="background-image:url(../../illustrations/garments/lue-m-ull.png);" aria-hidden="true"></div>
                <span class="anchor-dot tilbehor" aria-hidden="true"></span>
              </button>
              <span class="pulse-ring" aria-hidden="true"></span>
              <span class="swap-flash" aria-hidden="true"></span>
            </li>

            <li class="stack-item item-vinterdress" data-lag="ytterst" data-side="left">
              <button class="garment-btn" type="button" aria-label="Vis detalj for Vinterdress (ytterst)" data-target="vinterdress">
                <div class="garment-img" style="background-image:url(../../illustrations/garments/vinterdress.png);" aria-hidden="true"></div>
                <span class="anchor-dot ytterst" aria-hidden="true"></span>
              </button>
              <span class="pulse-ring" aria-hidden="true"></span>
              <span class="swap-flash" aria-hidden="true"></span>
            </li>

            <li class="stack-item item-votter" data-lag="tilbehor" data-side="right">
              <button class="garment-btn" type="button" aria-label="Vis detalj for Votter (tilbehør)" data-target="votter">
                <div class="votter-row">
                  <div class="garment-img" style="background-image:url(../../illustrations/garments/vindvotter-skall.png);" aria-hidden="true"></div>
                  <div class="garment-img right" style="background-image:url(../../illustrations/garments/vindvotter-skall.png);" aria-hidden="true"></div>
                </div>
                <span class="anchor-dot tilbehor" aria-hidden="true"></span>
              </button>
              <span class="pulse-ring" aria-hidden="true"></span>
              <span class="swap-flash" aria-hidden="true"></span>
            </li>

            <li class="stack-item item-fleecejakke" data-lag="mellom" data-side="right">
              <button class="garment-btn" type="button" aria-label="Vis detalj for Fleecejakke (mellom)" data-target="fleecejakke">
                <div class="garment-img" style="background-image:url(../../illustrations/garments/ull-jakke.png);" aria-hidden="true"></div>
                <span class="anchor-dot mellom" aria-hidden="true"></span>
              </button>
              <span class="pulse-ring" aria-hidden="true"></span>
              <span class="swap-flash" aria-hidden="true"></span>
            </li>

            <li class="stack-item item-ullsett-tykt" data-lag="mellom" data-side="left">
              <button class="garment-btn" type="button" aria-label="Vis detalj for Ullsett tykt (mellom)" data-target="ullsett-tykt">
                <div class="garment-img" style="background-image:url(../../illustrations/garments/ullsett-tykt.png);" aria-hidden="true"></div>
                <span class="anchor-dot mellom" aria-hidden="true"></span>
              </button>
              <span class="pulse-ring" aria-hidden="true"></span>
              <span class="swap-flash" aria-hidden="true"></span>
            </li>

            <li class="stack-item item-ullbody" data-lag="innerst" data-side="right">
              <button class="garment-btn" type="button" aria-label="Vis detalj for Ullbody (innerst)" data-target="ullbody">
                <div class="garment-img" style="background-image:url(../../illustrations/garments/langermet-ullbody.png);" aria-hidden="true"></div>
                <span class="anchor-dot innerst" aria-hidden="true"></span>
              </button>
              <span class="pulse-ring" aria-hidden="true"></span>
              <span class="swap-flash" aria-hidden="true"></span>
            </li>

            <li class="stack-item item-tynn-bukse" data-lag="innerst" data-side="left">
              <button class="garment-btn" type="button" aria-label="Vis detalj for Tynn ullbukse (innerst)" data-target="tynn-bukse">
                <div class="garment-img" style="background-image:url(../../illustrations/garments/tynn-bukse.png);" aria-hidden="true"></div>
                <span class="anchor-dot innerst" aria-hidden="true"></span>
              </button>
              <span class="pulse-ring" aria-hidden="true"></span>
              <span class="swap-flash" aria-hidden="true"></span>
            </li>

            <li class="stack-item item-ullsokker" data-lag="tilbehor" data-side="right">
              <button class="garment-btn" type="button" aria-label="Vis detalj for Ullsokker (tilbehør)" data-target="ullsokker">
                <div class="garment-img" style="background-image:url(../../illustrations/garments/ullsokker.png);" aria-hidden="true"></div>
                <span class="anchor-dot tilbehor" aria-hidden="true"></span>
              </button>
              <span class="pulse-ring" aria-hidden="true"></span>
              <span class="swap-flash" aria-hidden="true"></span>
            </li>

          </ul>
        </div>

      </div>

      <div class="sticky-cta">
        <button class="cta-btn" type="button" aria-label="Klar for tur">
          <span>Klar for tur</span>
          <svg width="22" height="13" viewBox="0 0 26 14" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7h20"/><path d="M17 2l5 5-5 5"/></svg>
        </button>
      </div>

      <div class="undo-toast" id="undo-toast" role="status" aria-live="polite">
        <span class="toast-text">Byttet til <b id="undo-name">—</b></span>
        <button class="undo-btn" type="button" id="undo-btn">Angre</button>
      </div>

      <dialog class="detail-sheet" id="detail-sheet" aria-labelledby="sheet-title">
        <div class="sheet-inner">
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="sheet-head">
            <div class="sheet-titles">
              <span class="lag-tag" id="sheet-lag-tag">Lag</span>
              <h2 class="sheet-title" id="sheet-title">Plagg</h2>
            </div>
            <button class="reset-btn" id="reset-btn" type="button" aria-label="Tilbakestill til original">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.5"/><path d="M3 3v3h3"/></svg>
              Tilbakestill
            </button>
            <button class="sheet-close" id="sheet-close" type="button" aria-label="Lukk detalj">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
          </div>

          <div class="sheet-scroll">
            <div class="sheet-hero" id="sheet-hero">
              <div class="sheet-hero-img" id="sheet-hero-img" aria-hidden="true"></div>
            </div>

            <div class="spec-line" aria-label="Plagg-spesifikasjoner">
              <div class="spec-item">
                <span class="spec-label">Material</span>
                <span class="spec-value" id="sheet-material">—</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">Vekt</span>
                <span class="spec-value" id="sheet-weight">—</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">Kat.</span>
                <span class="spec-value" id="sheet-category">—</span>
              </div>
            </div>

            <div class="proscons-grid" aria-label="Styrker og hensyn ved valget">
              <div class="proscons-col pros">
                <div class="proscons-head">
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l3 3 7-7"/></svg>
                  Styrker
                </div>
                <ul class="proscons-list" id="sheet-pros"><li>—</li></ul>
              </div>
              <div class="proscons-col cons">
                <div class="proscons-head">
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"/></svg>
                  Hensyn
                </div>
                <ul class="proscons-list" id="sheet-cons"><li>—</li></ul>
              </div>
            </div>

            <div class="swap-section" id="swap-section" aria-label="Bytt til et alternativ">
              <div class="swap-head">
                <span class="swap-label">
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7l-2-2M12 12H5l2 2"/></svg>
                  Bytte til
                </span>
                <span class="swap-hint" id="swap-hint">—</span>
              </div>
              <div class="swap-cards" id="swap-cards" role="listbox" aria-label="Alternative plagg i samme kategori">
              </div>
            </div>
          </div>

          <div class="sheet-footer">
            <button class="footer-primary" type="button" id="footer-ok-btn">
              <span>Behold valg</span>
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l3 3 7-7"/></svg>
            </button>
          </div>
        </div>
      </dialog>

    </main>
  </div>

<script>
(function(){
  const garments = {
    'vinterdress':{
      name:'Vinterdress', lag:'ytterst', lagLabel:'Ytterst',
      img:'../../illustrations/garments/vinterdress.png',
      material:'Polyester m/ dun', weight:'480 g', category:'Heldress',
      pros:['Vindtett skall stopper kald luft','Heldress hindrer kuldebro over magen'],
      cons:['Lang tørketid hvis våt','For varm i +5° eller varmere'],
      alternatives:[
        {key:'parkdress-skall',name:'Parkdress (skall)',meta:'Lettere · ned til −10°',img:'../../illustrations/garments/vinterdress.png'},
        {key:'ulldress-tykk',name:'Tykk ulldress',meta:'Pustende · ned til −15°',img:'../../illustrations/garments/ullsett-tykt.png'}
      ]
    },
    'fleecejakke':{
      name:'Fleecejakke', lag:'mellom', lagLabel:'Mellom',
      img:'../../illustrations/garments/ull-jakke.png',
      material:'Fleece (polyester)', weight:'180 g', category:'Mellom overdel',
      pros:['Tørker raskt etter aktivitet','Lav vekt — lett å bevege seg i'],
      cons:['Klam over 0° når brukt over ullsett','Vindgjennomgang uten ytterlag'],
      alternatives:[
        {key:'ulljakke-tynn',name:'Tynn ulljakke',meta:'Varmere · tregere tørk',img:'../../illustrations/garments/ull-jakke.png'},
        {key:'dunvest',name:'Dunvest',meta:'Kropp-fokus · armer fri',img:'../../illustrations/garments/ull-jakke.png'}
      ]
    },
    'ullsett-tykt':{
      name:'Ullsett tykt', lag:'mellom', lagLabel:'Mellom',
      img:'../../illustrations/garments/ullsett-tykt.png',
      material:'100% merino 280 g/m²', weight:'220 g', category:'Mellomlag sett',
      pros:['Isolerer godt selv litt fuktig','Hovedvarme under −15°'],
      cons:['Tar lang tid å tørke','For varmt over −5°'],
      alternatives:[
        {key:'ullsett-medium',name:'Ullsett medium',meta:'200 g/m² · til −10°',img:'../../illustrations/garments/ullsett-tykt.png'},
        {key:'fleecesett',name:'Fleecesett',meta:'Lett · tørker raskt',img:'../../illustrations/garments/ull-jakke.png'}
      ]
    },
    'ullbody':{
      name:'Ullbody langermet', lag:'innerst', lagLabel:'Innerst',
      img:'../../illustrations/garments/langermet-ullbody.png',
      material:'100% merino 160 g/m²', weight:'85 g', category:'Innerlag overdel',
      pros:['Transporterer svette vekk fra hud','Body-form hindrer kuldebro over magen'],
      cons:['Krever skånsom vask','Tregere tørketid enn syntetisk'],
      alternatives:[
        {key:'ullbody-tykk',name:'Tykk ullbody',meta:'200 g/m² · ekstra varme',img:'../../illustrations/garments/langermet-ullbody.png'},
        {key:'syntetisk-body',name:'Syntetisk body',meta:'Raskere tørk',img:'../../illustrations/garments/langermet-ullbody.png'}
      ]
    },
    'tynn-bukse':{
      name:'Tynn ullbukse', lag:'innerst', lagLabel:'Innerst',
      img:'../../illustrations/garments/tynn-bukse.png',
      material:'100% merino 160 g/m²', weight:'70 g', category:'Innerlag underdel',
      pros:['Hindrer kald luft mot huden','Fukt-transport når hun går i snø'],
      cons:['Liten varme alene','Klam under tett bukse i mildvær'],
      alternatives:[
        {key:'ullbukse-tykk',name:'Tykk ullbukse',meta:'240 g/m² · varmere',img:'../../illustrations/garments/tynn-bukse.png'},
        {key:'syntetisk-bukse',name:'Syntetisk bukse',meta:'Rask tørk',img:'../../illustrations/garments/tynn-bukse.png'}
      ]
    },
    'lue':{
      name:'Lue med ull', lag:'tilbehor', lagLabel:'Tilbehør',
      img:'../../illustrations/garments/lue-m-ull.png',
      material:'Ull/akryl m/ fôr', weight:'45 g', category:'Hode',
      pros:['Dekker øret og pannen','Obligatorisk under −10°'],
      cons:['Glir av ved aktiv lek','Litt klam over 0°'],
      alternatives:[
        {key:'balaklava',name:'Balaklava',meta:'Dekker hals + ansikt',img:'../../illustrations/garments/balaklava.png'},
        {key:'lue-tynn',name:'Tynn ullue',meta:'Mildvær (0° til −5°)',img:'../../illustrations/garments/lue-tynn.png'}
      ]
    },
    'votter':{
      name:'Vindvotter med skall', lag:'tilbehor', lagLabel:'Tilbehør',
      img:'../../illustrations/garments/vindvotter-skall.png',
      material:'Ull-fôr + vindskall', weight:'55 g', category:'Hender',
      pros:['Vindtett skall stopper kuldebro','Lange mansjetter dekker håndledd'],
      cons:['Vanskelig å ta av/på alene','Klam over 0°'],
      alternatives:[
        {key:'ullvotter',name:'Ullvotter',meta:'Mer fingerføling',img:'../../illustrations/garments/votter.png'},
        {key:'lobbevanter',name:'Lobbevanter',meta:'Strikket · til −5°',img:'../../illustrations/garments/votter-tynne.png'}
      ]
    },
    'ullsokker':{
      name:'Ullsokker', lag:'tilbehor', lagLabel:'Tilbehør',
      img:'../../illustrations/garments/ullsokker.png',
      material:'80% merino, 20% nylon', weight:'40 g', category:'Føtter',
      pros:['Isolerer i vinterskoene','Nylon-andel gir slitestyrke'],
      cons:['Krymper ved feil vask','Tykk modell kan stramme i støvel'],
      alternatives:[
        {key:'ullsokker-tynn',name:'Tynn ullsokk',meta:'Mildvær · 200 g/m²',img:'../../illustrations/garments/ullsokker.png'},
        {key:'ulldobbel-sokk',name:'Ulldobbel sokk',meta:'Til −25° · ekstra fôr',img:'../../illustrations/garments/ullsokker.png'}
      ]
    }
  };

  /* Ikke-destruktiv override: behold original, render via activeKey (tiltak iter-2 #4) */
  const originals = {};
  const activeKeys = {};
  Object.keys(garments).forEach(k=>{
    originals[k] = { name:garments[k].name, img:garments[k].img, weight:garments[k].weight };
    activeKeys[k] = null; // null = original
  });

  const dialog = document.getElementById('detail-sheet');
  const elTag = document.getElementById('sheet-lag-tag');
  const elTitle = document.getElementById('sheet-title');
  const elHeroWrap = document.getElementById('sheet-hero');
  const elHero = document.getElementById('sheet-hero-img');
  const elMat = document.getElementById('sheet-material');
  const elWei = document.getElementById('sheet-weight');
  const elCat = document.getElementById('sheet-category');
  const elPros = document.getElementById('sheet-pros');
  const elCons = document.getElementById('sheet-cons');
  const elSwapCards = document.getElementById('swap-cards');
  const elSwapHint = document.getElementById('swap-hint');
  const closeBtn = document.getElementById('sheet-close');
  const footerOkBtn = document.getElementById('footer-ok-btn');
  const resetBtn = document.getElementById('reset-btn');
  const toast = document.getElementById('undo-toast');
  const toastName = document.getElementById('undo-name');
  const undoBtn = document.getElementById('undo-btn');

  let currentKey = null;
  let currentItem = null;
  let lastSwap = null;
  let toastTimer = null;

  function renderDetail(key){
    const g = garments[key];
    if(!g) return;
    elTag.textContent = g.lagLabel.toUpperCase();
    elTag.className = 'lag-tag ' + g.lag;
    elTitle.textContent = g.name;
    elHero.style.backgroundImage = `url(${g.img})`;
    elMat.textContent = g.material;
    elWei.textContent = g.weight;
    elCat.textContent = g.category;

    elPros.innerHTML = '';
    g.pros.slice(0,2).forEach(text=>{
      const li = document.createElement('li');
      li.innerHTML = `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l3 3 7-7"/></svg><span>${text}</span>`;
      elPros.appendChild(li);
    });
    elCons.innerHTML = '';
    g.cons.slice(0,2).forEach(text=>{
      const li = document.createElement('li');
      li.innerHTML = `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"/></svg><span>${text}</span>`;
      elCons.appendChild(li);
    });

    elSwapCards.innerHTML = '';
    elSwapHint.textContent = `${(g.alternatives||[]).length} alternativ${(g.alternatives||[]).length===1?'':'er'}`;

    const cur = document.createElement('button');
    cur.type='button'; cur.className='swap-card current';
    cur.setAttribute('aria-label', `Valgt: ${g.name}`);
    cur.innerHTML = `<div class="swap-card-img" style="background-image:url(${g.img});"></div>
      <div class="swap-card-name">${g.name}</div>
      <div class="swap-card-meta">${g.weight}</div>`;
    elSwapCards.appendChild(cur);

    (g.alternatives||[]).forEach(alt=>{
      const c = document.createElement('button');
      c.type='button'; c.className='swap-card';
      c.setAttribute('aria-label', `Bytt til ${alt.name}`);
      c.innerHTML = `<div class="swap-card-img" style="background-image:url(${alt.img});"></div>
        <div class="swap-card-name">${alt.name}</div>
        <div class="swap-card-meta">${alt.meta}</div>`;
      c.addEventListener('click', ()=>swapTo(alt));
      elSwapCards.appendChild(c);
    });

    // Reset-knapp synlig kun hvis aktivt avvik fra original
    if(activeKeys[key]){
      resetBtn.classList.add('visible');
    } else {
      resetBtn.classList.remove('visible');
    }
  }

  function swapTo(alt){
    if(!currentKey || !currentItem) return;
    const g = garments[currentKey];

    lastSwap = { key: currentKey, prevName: g.name, prevImg: g.img, prevWeight: g.weight };

    const imgEl = currentItem.querySelector('.garment-img');
    if(imgEl) imgEl.style.backgroundImage = `url(${alt.img})`;

    elHeroWrap.classList.add('swapping');
    setTimeout(()=>{
      elHero.style.backgroundImage = `url(${alt.img})`;
      elHeroWrap.classList.remove('swapping');
    }, 180);

    g.name = alt.name;
    g.img = alt.img;
    if(/g$/.test(alt.meta)) g.weight = alt.meta;
    activeKeys[currentKey] = alt.key;

    renderDetail(currentKey);

    currentItem.classList.remove('swapping');
    void currentItem.offsetWidth;
    currentItem.classList.add('swapping');
    setTimeout(()=>currentItem.classList.remove('swapping'), 600);

    showUndoToast(alt.name);
  }

  function resetToOriginal(){
    if(!currentKey) return;
    const g = garments[currentKey];
    const o = originals[currentKey];
    g.name = o.name; g.img = o.img; g.weight = o.weight;
    activeKeys[currentKey] = null;

    const imgEl = currentItem?.querySelector('.garment-img');
    if(imgEl) imgEl.style.backgroundImage = `url(${g.img})`;
    elHero.style.backgroundImage = `url(${g.img})`;

    renderDetail(currentKey);
    hideUndoToast();
    lastSwap = null;
  }

  function undoSwap(){
    if(!lastSwap || !currentItem) return;
    const g = garments[lastSwap.key];
    g.name = lastSwap.prevName;
    g.img = lastSwap.prevImg;
    g.weight = lastSwap.prevWeight;

    // Sjekk om vi er tilbake på original etter undo
    const o = originals[lastSwap.key];
    if(g.name===o.name && g.img===o.img) activeKeys[lastSwap.key] = null;

    const imgEl = currentItem.querySelector('.garment-img');
    if(imgEl) imgEl.style.backgroundImage = `url(${g.img})`;
    elHero.style.backgroundImage = `url(${g.img})`;

    renderDetail(lastSwap.key);
    hideUndoToast();
    lastSwap = null;
  }

  function showUndoToast(name){
    toastName.textContent = name;
    toast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(hideUndoToast, 4500);
  }
  function hideUndoToast(){
    toast.classList.remove('show');
    if(toastTimer){clearTimeout(toastTimer);toastTimer=null;}
  }

  function openDetail(key, sourceItem){
    currentKey = key; currentItem = sourceItem;
    renderDetail(key);

    if(sourceItem && sourceItem.classList.contains('stack-item')){
      sourceItem.classList.remove('pulsing');
      void sourceItem.offsetWidth;
      sourceItem.classList.add('pulsing');
      setTimeout(()=>sourceItem.classList.remove('pulsing'), 650);
    }

    if(typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open','');
    setTimeout(()=>closeBtn.focus(), 80);
  }

  function closeDetail(){
    if(typeof dialog.close === 'function') dialog.close();
    else dialog.removeAttribute('open');
  }

  document.querySelectorAll('.garment-btn[data-target]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.preventDefault();
      const key = btn.dataset.target;
      const item = btn.closest('.stack-item');
      openDetail(key, item);
    });
  });

  closeBtn.addEventListener('click', closeDetail);
  footerOkBtn.addEventListener('click', closeDetail);
  resetBtn.addEventListener('click', resetToOriginal);
  undoBtn.addEventListener('click', undoSwap);

  dialog.addEventListener('click', (e)=>{ if(e.target === dialog) closeDetail(); });
  dialog.addEventListener('cancel', (e)=>{ e.preventDefault(); closeDetail(); });
})();
</script>
</body>
</html>
