<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Påkledning · P4-Superpower (card-rader)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Brand C-hybrid — låst per PRODUCT.md F60.8 */
  --bg-canvas:#DBD8D2;
  --bg-canvas-soft:#E5E2DC;
  --cta-orange-500:#FF6B35;
  --cta-orange-600:#F25A22;
  --cta-orange-700:#D9491A;

  --terracotta-500:#C0632F;
  --terracotta-700:#A9492A;
  --terracotta-100:#F4E4D8;
  --terracotta-700-on-100:#8A3618;

  /* Lag-farger */
  --layer-ytterst:#C0632F;
  --layer-mellom:#5E8C6A;
  --layer-innerst:#3F5A78;
  --layer-tilbehor:#7A6E5D;

  --ink-900:#2B2B2B;
  --ink-700:#5A514C;
  --ink-500:#A89E97;
  --ink-300:#C9C3BD;
  --ink-200:#E1DDD6;

  --card-bg:#FFFFFF;
  --card-shadow:0 1px 2px rgba(43,37,34,.04),0 4px 10px rgba(43,37,34,.06);

  --font-sans:'Schibsted Grotesk',-apple-system,system-ui,sans-serif;
  --font-serif:'DM Serif Display',Georgia,serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#1a1a1a;font-family:var(--font-sans);}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink-900);}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* iPhone-frame 390×844 */
.frame{
  position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 12px #1f1f1f, 0 0 0 13px #333;
  background:linear-gradient(180deg,#C7D6E1 0%,#DEE1DD 45%,#E9E1D6 100%);
}

.screen{
  position:relative;height:100%;width:100%;display:flex;flex-direction:column;
  font-family:var(--font-sans);color:var(--ink-900);
  padding-top:env(safe-area-inset-top,0px);
}
.screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 46% at 50% -8%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%);
}

/* Topbar */
.topbar{
  position:relative;z-index:5;flex:none;
  height:calc(44px + 8px);
  margin-top:46px;
  padding:0 16px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(43,43,43,.08);
}
.back-btn{
  width:44px;height:44px;flex:none;border-radius:13px;
  background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.06);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  padding:0;
}
.back-btn:active{transform:scale(.96);}
.topbar-title{
  flex:1;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.3px;
  color:var(--ink-900);
}
.meta-pill{
  flex:none;display:flex;align-items:center;gap:6px;
  padding:7px 11px;border-radius:11px;
  background:rgba(255,255,255,.55);border:1px solid rgba(43,43,43,.06);
  font-size:12px;font-weight:600;color:var(--ink-700);letter-spacing:.1px;
}
.meta-pill .temp-fig{font-family:var(--font-serif);font-weight:400;font-size:13.5px;letter-spacing:-.2px;color:var(--ink-900);}

/* Kontekst-band — kompakt for å gi rom til mange cards */
.context-band{
  position:relative;z-index:4;flex:none;
  display:flex;align-items:center;gap:12px;
  padding:14px 18px 10px;
}
.context-avatar{
  width:46px;height:46px;flex:none;border-radius:50%;
  background:rgba(255,255,255,.55);
  border:1px solid rgba(43,43,43,.06);
  box-shadow:inset 0 2px 6px rgba(43,37,34,.06);
  display:flex;align-items:flex-end;justify-content:center;
  overflow:hidden;
}
.context-avatar img{
  width:42px;height:42px;object-fit:contain;object-position:center bottom;
  filter:drop-shadow(0 3px 5px rgba(74,68,58,.22));
}
.context-line{flex:1;min-width:0;}
.context-line .name{font-size:14px;font-weight:600;color:var(--ink-900);letter-spacing:-.1px;}
.context-line .mode{font-size:12.5px;font-weight:500;color:var(--ink-700);margin-top:1px;}

.section-eyebrow{
  display:flex;align-items:center;gap:8px;
  font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--ink-500);
  padding:6px 18px 8px;
}
.section-eyebrow .line{flex:1;height:1px;background:rgba(43,43,43,.10);}

/* Scroll-area — ingen snap, naturlig scroll */
.scroll-area{
  position:relative;z-index:3;
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:0 18px 120px;
  scrollbar-width:none;
}
.scroll-area::-webkit-scrolling{display:none;}
.scroll-area::-webkit-scrollbar{display:none;}

/* Card-rad — Superpower Protocol-pattern */
.card-row{
  display:grid;
  grid-template-columns:44px 1fr 16px;
  align-items:center;
  column-gap:14px;
  width:100%;
  padding:14px;
  margin-bottom:10px;
  background:var(--card-bg);
  border:1px solid var(--ink-200);
  border-radius:14px;
  box-shadow:var(--card-shadow);
  cursor:pointer;
  text-align:left;
  font-family:var(--font-sans);
  transition:transform 120ms ease, border-color 120ms ease;
}
.card-row:active{transform:scale(.99);border-color:var(--ink-300);}

/* Sirkulær thumbnail 44×44 */
.thumb{
  width:44px;height:44px;flex:none;border-radius:50%;
  background:var(--bg-canvas-soft);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  border:1px solid rgba(43,43,43,.04);
}
.thumb img{
  width:34px;height:34px;object-fit:contain;object-position:center;
  filter:drop-shadow(0 1px 2px rgba(74,68,58,.22));
}
.thumb .emoji-fallback{
  font-size:22px;line-height:1;
}

/* Tekst-blokk */
.row-text{min-width:0;}
.row-eyebrow{
  font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  margin-bottom:2px;
}
.row-eyebrow.ytterst{color:var(--layer-ytterst);}
.row-eyebrow.mellom{color:var(--layer-mellom);}
.row-eyebrow.innerst{color:var(--layer-innerst);}
.row-eyebrow.tilbehor{color:var(--layer-tilbehor);}

.row-name{
  font-size:15px;font-weight:600;letter-spacing:-.15px;color:var(--ink-900);
  line-height:1.25;
}
.row-spec{
  font-size:12px;font-weight:500;color:var(--ink-500);
  margin-top:2px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* Chevron */
.chevron{
  width:16px;height:16px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-500);
}

/* PLUSS-seksjon — mini-cards i samme stil, 36×36 thumbs */
.pluss-section{margin-top:6px;}
.pluss-row{
  display:grid;
  grid-template-columns:36px 1fr 16px;
  align-items:center;
  column-gap:12px;
  width:100%;
  padding:11px 13px;
  margin-bottom:8px;
  background:var(--card-bg);
  border:1px solid var(--ink-200);
  border-radius:12px;
  box-shadow:0 1px 2px rgba(43,37,34,.03),0 2px 6px rgba(43,37,34,.04);
  cursor:pointer;
  text-align:left;
  font-family:var(--font-sans);
  transition:transform 120ms ease, border-color 120ms ease;
}
.pluss-row:active{transform:scale(.99);border-color:var(--ink-300);}

.thumb-sm{
  width:36px;height:36px;flex:none;border-radius:50%;
  background:var(--bg-canvas-soft);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  border:1px solid rgba(43,43,43,.04);
}
.thumb-sm img{
  width:28px;height:28px;object-fit:contain;object-position:center;
  filter:drop-shadow(0 1px 2px rgba(74,68,58,.22));
}

.pluss-row .row-name{font-size:14px;}
.pluss-row .row-spec{font-size:11.5px;margin-top:1px;}

/* Sticky CTA — warm orange #FF6B35 per brand-lock */
.sticky-cta{
  position:absolute;left:0;right:0;bottom:0;
  z-index:10;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:linear-gradient(180deg,rgba(219,216,210,0) 0%, rgba(219,216,210,.92) 28%, rgba(219,216,210,.98) 100%);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.cta-btn{
  width:100%;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:17px 24px;border-radius:18px;border:none;cursor:pointer;
  background:linear-gradient(140deg,var(--cta-orange-500) 0%,var(--cta-orange-700) 100%);
  box-shadow:0 1px 2px rgba(43,43,43,.06),0 12px 24px rgba(217,73,26,.32);
  font-family:var(--font-sans);
  transition:transform 120ms ease;
}
.cta-btn:active{transform:translateY(1px) scale(.99);}
.cta-btn span{font-size:16px;font-weight:600;color:#FFF;letter-spacing:.1px;}
.cta-btn svg{flex:none;}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  .card-row,.pluss-row,.cta-btn,.back-btn{transition:none !important;}
}
</style>
</head>
<body>
  <div class="frame">
    <main class="screen" aria-label="Slik kler du Liv">
      <h1 class="sr-only">Påkledning — Slik kler du Liv</h1>

      <!-- Topbar -->
      <div class="topbar" role="banner">
        <button class="back-btn" aria-label="Tilbake">
          <svg width="9" height="16" viewBox="0 0 12 20" fill="none" stroke="#2B2B2B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2L2 10l8 8"/></svg>
        </button>
        <div class="topbar-title">Slik kler du Liv</div>
        <div class="meta-pill" aria-label="Minus 6 grader, lett snø">
          <span class="temp-fig">−6°</span>
          <span aria-hidden="true">·</span>
          <span>Lett snø</span>
        </div>
      </div>

      <!-- Kontekst — kompakt -->
      <div class="context-band" aria-label="Kontekst: Liv, utenfor vogn">
        <div class="context-avatar" aria-hidden="true">
          <img src="../avatars/avatar-A6.png" alt="" onerror="this.style.display='none'">
        </div>
        <div class="context-line">
          <div class="name">Liv · 14 mnd</div>
          <div class="mode">Utenfor vogn · −6°</div>
        </div>
      </div>

      <div class="section-eyebrow" aria-hidden="true">
        <span>Anbefalt protokoll</span>
        <span class="line"></span>
      </div>

      <!-- Scroll-area — alle 5 hoved-cards i uniform stil -->
      <div class="scroll-area" role="list" aria-label="Anbefalte plagg i tre lag">

        <!-- 1. YTTERST: Vinterdress -->
        <button class="card-row" type="button" role="listitem" aria-label="Ytterst: Vinterdress, vind- og vanntett">
          <div class="thumb" aria-hidden="true">
            <img src="../illustrations/garments/vinterdress.png" alt="" onerror="this.outerHTML='<span class=&quot;emoji-fallback&quot;>🧥</span>'">
          </div>
          <div class="row-text">
            <div class="row-eyebrow ytterst">Ytterst</div>
            <div class="row-name">Vinterdress</div>
            <div class="row-spec">Vind- og vanntett</div>
          </div>
          <div class="chevron" aria-hidden="true">
            <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 6-5 6"/></svg>
          </div>
        </button>

        <!-- 2. MELLOM: Ullsett tykt -->
        <button class="card-row" type="button" role="listitem" aria-label="Mellom: Ullsett tykt, holder på varmen">
          <div class="thumb" aria-hidden="true">
            <img src="../illustrations/garments/ullsett-tykt.png" alt="" onerror="this.outerHTML='<span class=&quot;emoji-fallback&quot;>🧶</span>'">
          </div>
          <div class="row-text">
            <div class="row-eyebrow mellom">Mellom</div>
            <div class="row-name">Ullsett tykt</div>
            <div class="row-spec">Holder på varmen, puster</div>
          </div>
          <div class="chevron" aria-hidden="true">
            <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 6-5 6"/></svg>
          </div>
        </button>

        <!-- 3. MELLOM: Fleecejakke (ekstra isolasjon) -->
        <button class="card-row" type="button" role="listitem" aria-label="Mellom: Fleecejakke, ekstra isolasjon">
          <div class="thumb" aria-hidden="true">
            <img src="../illustrations/garments/ull-jakke.png" alt="" onerror="this.outerHTML='<span class=&quot;emoji-fallback&quot;>🧥</span>'">
          </div>
          <div class="row-text">
            <div class="row-eyebrow mellom">Mellom</div>
            <div class="row-name">Fleecejakke</div>
            <div class="row-spec">Ekstra isolasjon ved −22°</div>
          </div>
          <div class="chevron" aria-hidden="true">
            <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 6-5 6"/></svg>
          </div>
        </button>

        <!-- 4. INNERST: Ullbody langermet -->
        <button class="card-row" type="button" role="listitem" aria-label="Innerst: Ullbody langermet, mykt mot huden">
          <div class="thumb" aria-hidden="true">
            <img src="../illustrations/garments/langermet-ullbody.png" alt="" onerror="this.outerHTML='<span class=&quot;emoji-fallback&quot;>👕</span>'">
          </div>
          <div class="row-text">
            <div class="row-eyebrow innerst">Innerst</div>
            <div class="row-name">Ullbody langermet</div>
            <div class="row-spec">Mykt mot huden</div>
          </div>
          <div class="chevron" aria-hidden="true">
            <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 6-5 6"/></svg>
          </div>
        </button>

        <!-- 5. INNERST: Tynn bukse -->
        <button class="card-row" type="button" role="listitem" aria-label="Innerst: Tynn bukse">
          <div class="thumb" aria-hidden="true">
            <img src="../illustrations/garments/tynn-bukse.png" alt="" onerror="this.outerHTML='<span class=&quot;emoji-fallback&quot;>👖</span>'">
          </div>
          <div class="row-text">
            <div class="row-eyebrow innerst">Innerst</div>
            <div class="row-name">Tynn bukse</div>
            <div class="row-spec">Base-lag for bena</div>
          </div>
          <div class="chevron" aria-hidden="true">
            <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 6-5 6"/></svg>
          </div>
        </button>

        <!-- PLUSS-seksjon — 3 mini-cards med samme stil, mindre thumbs -->
        <div class="pluss-section" role="list" aria-label="Tilbehør">
          <div class="section-eyebrow" aria-hidden="true" style="padding:14px 0 8px;">
            <span>Tilbehør</span>
            <span class="line"></span>
          </div>

          <!-- Lue -->
          <button class="pluss-row" type="button" role="listitem" aria-label="Lue med ull">
            <div class="thumb-sm" aria-hidden="true">
              <img src="../illustrations/garments/lue-m-ull.png" alt="" onerror="this.outerHTML='<span class=&quot;emoji-fallback&quot;>🧢</span>'">
            </div>
            <div class="row-text">
              <div class="row-eyebrow tilbehor">Hode</div>
              <div class="row-name">Lue</div>
              <div class="row-spec">Med ull</div>
            </div>
            <div class="chevron" aria-hidden="true">
              <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 6-5 6"/></svg>
            </div>
          </button>

          <!-- Votter -->
          <button class="pluss-row" type="button" role="listitem" aria-label="Vindvotter med skall">
            <div class="thumb-sm" aria-hidden="true">
              <img src="../illustrations/garments/vindvotter-skall.png" alt="" onerror="this.outerHTML='<span class=&quot;emoji-fallback&quot;>🧤</span>'">
            </div>
            <div class="row-text">
              <div class="row-eyebrow tilbehor">Hender</div>
              <div class="row-name">Votter</div>
              <div class="row-spec">Vindtett skall</div>
            </div>
            <div class="chevron" aria-hidden="true">
              <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 6-5 6"/></svg>
            </div>
          </button>

          <!-- Ullsokker -->
          <button class="pluss-row" type="button" role="listitem" aria-label="Ullsokker">
            <div class="thumb-sm" aria-hidden="true">
              <img src="../illustrations/garments/ullsokker.png" alt="" onerror="this.outerHTML='<span class=&quot;emoji-fallback&quot;>🧦</span>'">
            </div>
            <div class="row-text">
              <div class="row-eyebrow tilbehor">Føtter</div>
              <div class="row-name">Ullsokker</div>
              <div class="row-spec">Holder tær varme</div>
            </div>
            <div class="chevron" aria-hidden="true">
              <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 6-5 6"/></svg>
            </div>
          </button>
        </div>

      </div>

      <!-- Sticky CTA — warm orange per brand-lock -->
      <div class="sticky-cta">
        <button class="cta-btn" type="button" aria-label="Klar for tur">
          <span>Klar for tur</span>
          <svg width="22" height="13" viewBox="0 0 26 14" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7h20"/><path d="M17 2l5 5-5 5"/></svg>
        </button>
      </div>
    </main>
  </div>
</body>
</html>
