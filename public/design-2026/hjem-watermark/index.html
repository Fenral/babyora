<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Babyora — Hjem: watermark-temp test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-canvas:#DFDCEF; --surface-pure:#FFFFFF; --surface-soft:#EDEBF6;
    --ink-900:#241E38; --ink-700:#56506F; --ink-500:#8A83A0; --ink-100:#D9D5E7;
    --cta:#1F6B3E; --cta-ink:#F1FBF4; --focus:#C0632F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Schibsted Grotesk',system-ui,sans-serif;background:#0b0b10;display:grid;place-items:center;min-height:100dvh;color:var(--ink-900);}
  .phone{position:relative;width:min(430px,100vw);height:min(932px,100dvh);background:var(--bg-canvas);overflow:hidden;}
  .home{position:absolute;inset:0;display:flex;flex-direction:column;padding:50px 22px 92px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .pill{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;background:var(--surface-pure);border:1px solid var(--ink-100);min-height:44px;font-weight:600;font-size:.86rem;}
  .clock{font-variant-numeric:tabular-nums;font-weight:600;font-size:.875rem;color:var(--ink-700);}
  .meta{font-size:.9375rem;color:var(--ink-700);margin-top:12px;max-width:66%;}
  .meta b{color:var(--ink-900);font-weight:600;}
  .wx{position:absolute;top:92px;right:22px;font-size:30px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.16));}
  .seg{position:relative;display:flex;margin-top:10px;padding:4px;border-radius:13px;background:var(--surface-soft);min-height:44px;}
  .seg button{flex:1;border:none;background:transparent;font:inherit;font-weight:600;font-size:.84rem;color:var(--ink-500);border-radius:10px;}
  .seg button[aria-selected="true"]{background:var(--surface-pure);color:var(--ink-900);box-shadow:0 1px 2px rgba(36,30,56,.12);}
  .scene{flex:1;display:flex;flex-direction:column;margin-top:2px;min-height:0;}
  .scene-label{text-align:center;font-size:.8125rem;font-weight:600;letter-spacing:.02em;color:var(--ink-700);margin:0 0 4px;}
  .stagew{position:relative;flex:1;display:block;}

  /* Temp-mast — to modi */
  .temp{position:relative;z-index:0;text-align:center;font-family:'Fraunces',serif;font-weight:600;
        font-size:clamp(88px,33vw,156px);line-height:.8;letter-spacing:-.03em;color:var(--ink-900);
        font-variant-numeric:tabular-nums;margin:-4px 0 -24px;transition:opacity .35s ease,transform .35s ease,color .35s ease;}
  .temp sup{font-size:.32em;font-weight:600;vertical-align:.9em;}
  /* WATERMARK: dempet, tynnere, bak avataren, sentrert bak ansiktet */
  .phone.wm .temp{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);z-index:0;
    font-weight:400;font-size:clamp(150px,52vw,240px);opacity:.15;color:var(--ink-900);margin:0;
  }

  .avatar{position:relative;z-index:2;display:block;width:264px;height:264px;margin:-26px auto 0;object-fit:contain;
           filter:drop-shadow(-8px 14px 18px rgba(175,83,49,.22));}
  .phone.wm .avatar{margin:8px auto 0;}
  .lag{margin-top:auto;text-align:center;font-weight:700;font-size:1.0625rem;padding-top:6px;position:relative;z-index:2;}
  .cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;margin-top:14px;border:none;
       border-radius:24px 24px 24px 8px;background:var(--cta);color:var(--cta-ink);font-weight:700;font-size:.9375rem;
       box-shadow:0 10px 24px -8px rgba(31,107,62,.5);position:relative;z-index:2;}
  .nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface-pure);border-top:1px solid var(--ink-100);}
  .nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--ink-500);text-decoration:none;padding:6px 12px;border-radius:12px;}
  .nav a[aria-current]{color:var(--cta);background:#E3F0E8;}
  .nav svg{width:22px;height:22px;}

  /* Test-kontroll (kun for denne mocken) */
  .wmtoggle{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;
            padding:7px 14px;border-radius:999px;background:rgba(20,16,32,.82);color:#fff;border:none;font:inherit;font-weight:600;font-size:.78rem;backdrop-filter:blur(4px);}
  .wmtoggle .dot{width:9px;height:9px;border-radius:999px;background:#8A83A0;}
  .phone.wm .wmtoggle .dot{background:#65D097;}
</style>
</head>
<body>
  <div class="phone" id="phone">
    <button class="wmtoggle" id="toggle" type="button"><span class="dot"></span><span id="tlabel">Watermark: AV</span></button>
    <main class="home">
      <div class="topbar">
        <span class="pill"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg>Oslo</span>
        <time class="clock">08:12</time>
      </div>
      <span class="wx" aria-hidden="true">⛅</span>
      <p class="meta"><b>Delvis skyet</b> · føles som <b>23°</b> · vind 2 m/s</p>
      <div class="seg" role="tablist" aria-label="Velg situasjon">
        <button role="tab" aria-selected="true">Utenfor vogn</button>
        <button role="tab" aria-selected="false">I vogn</button>
      </div>
      <div class="scene">
        <h2 class="scene-label">Dagens påkledning</h2>
        <div class="stagew">
          <div class="temp" aria-hidden="true">23<sup>°</sup></div>
          <img class="avatar" src="../../avatars/f79-poc/stage-2-solhatt.png" alt="" draggable="false" />
        </div>
        <p class="lag">2 lag</p>
        <button class="cta" type="button">Se dagens antrekk</button>
      </div>
    </main>
  </div>
<script>
  var phone=document.getElementById('phone'), t=document.getElementById('toggle'), lbl=document.getElementById('tlabel');
  // start med watermark PÅ (så Sivert ser det han vil teste med en gang)
  phone.classList.add('wm'); lbl.textContent='Watermark: PÅ';
  t.addEventListener('click', function(){
    var on=phone.classList.toggle('wm'); lbl.textContent='Watermark: '+(on?'PÅ':'AV');
  });
</script>
</body>
</html>
