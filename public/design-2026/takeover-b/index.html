<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Babyora — Ring + påkledning-animasjon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-canvas:#DFDCEF; --surface-pure:#FFFFFF; --surface-soft:#EDEBF6;
    --ink-900:#241E38; --ink-700:#56506F; --ink-500:#8A83A0; --ink-100:#D9D5E7;
    --lag:#AF5331; --tilbehor:#285E6A; --focus:#C0632F; --accent:#AF5331;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Schibsted Grotesk',system-ui,sans-serif;background:#0b0b10;display:grid;place-items:center;min-height:100dvh;color:var(--ink-900);}
  .phone{position:relative;width:min(430px,100vw);height:min(932px,100dvh);background:radial-gradient(120% 60% at 50% 30%, #F3F1FB 0%, var(--bg-canvas) 70%);overflow:hidden;}
  .inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:54px 20px calc(18px + env(safe-area-inset-bottom,0px));}

  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;opacity:0;transform:translateY(-6px);transition:opacity .4s cubic-bezier(.16,1,.3,1),transform .4s cubic-bezier(.16,1,.3,1);}
  .revealed .head{opacity:1;transform:none;}
  .title{font-family:'Fraunces',serif;font-weight:600;font-size:1.6rem;letter-spacing:-.01em;}
  .eyebrow{font-size:.8125rem;font-weight:600;color:var(--ink-700);margin-top:2px;}
  .close{width:44px;height:44px;flex:none;border-radius:999px;border:1px solid var(--ink-100);background:var(--surface-pure);display:grid;place-items:center;color:var(--ink-900);}

  .stage{position:relative;flex:1;min-height:0;margin-top:8px;}
  .ring-guide{position:absolute;border:1.5px dashed var(--ink-100);border-radius:50%;pointer-events:none;opacity:0;transition:opacity .5s ease;}
  .revealed .ring-guide{opacity:1;}
  .avatar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:210px;height:246px;z-index:2;}
  .avatar .stg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;opacity:0;transition:opacity .34s cubic-bezier(.16,1,.3,1);filter:drop-shadow(-8px 14px 22px rgba(175,83,49,.22));}
  .avatar .stg.on{opacity:1;}
  .avatar.pulse{animation:pop .34s cubic-bezier(.22,1,.36,1);}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(1);}45%{transform:translate(-50%,-50%) scale(1.03);}100%{transform:translate(-50%,-50%) scale(1);}}

  .chip{position:absolute;z-index:3;transform:translate(-50%,-50%) scale(.5);opacity:0;transition:opacity .4s cubic-bezier(.16,1,.3,1),transform .44s cubic-bezier(.34,1.4,.5,1);}
  .chip.in{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .chip .thumb{position:relative;border-radius:20px;background:var(--surface-pure);border:1px solid var(--ink-100);box-shadow:0 12px 26px -10px rgba(36,30,56,.28);display:grid;place-items:center;}
  .chip .thumb img{width:100%;height:100%;object-fit:contain;}
  .chip .badge{position:absolute;top:-8px;left:-8px;width:25px;height:25px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:.76rem;color:#fff;border:2px solid var(--surface-pure);}
  .badge.b-lag{background:var(--lag);} .badge.b-tilbehor{background:var(--tilbehor);}

  .loader{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:14%;transition:opacity .35s ease;}
  .loader.hide{opacity:0;pointer-events:none;}
  .loader .glass{display:flex;align-items:center;gap:11px;padding:11px 18px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--ink-100);box-shadow:0 10px 26px -12px rgba(36,30,56,.3);backdrop-filter:blur(3px);font-weight:600;font-size:.94rem;color:var(--ink-900);}
  .loader .dots{display:inline-flex;gap:4px;}
  .loader .dots i{width:6px;height:6px;border-radius:999px;background:var(--accent);animation:blink 1s infinite ease-in-out;}
  .loader .dots i:nth-child(2){animation-delay:.16s;} .loader .dots i:nth-child(3){animation-delay:.32s;}
  @keyframes blink{0%,80%,100%{opacity:.28;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}

  .rekke{flex:none;margin-top:6px;max-height:36%;overflow-y:auto;opacity:0;transform:translateY(10px);transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1);}
  .revealed .rekke{opacity:1;transform:none;}
  .rekke h3{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500);margin:0 2px 7px;position:sticky;top:0;}
  .rekke ol{list-style:none;display:flex;flex-direction:column;gap:7px;}
  .rekke button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surface-pure);border:1px solid var(--ink-100);border-radius:14px;padding:8px 12px;min-height:52px;font:inherit;color:var(--ink-900);}
  .rekke .num{width:24px;height:24px;flex:none;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:.76rem;color:#fff;}
  .rekke .num.b-lag{background:var(--lag);} .rekke .num.b-tilbehor{background:var(--tilbehor);}
  .rekke .rthumb{width:38px;height:38px;flex:none;border-radius:10px;background:var(--surface-soft);display:grid;place-items:center;padding:4px;}
  .rekke .rthumb img{width:100%;height:100%;object-fit:contain;}
  .rekke .rtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .rekke .rname{font-weight:700;font-size:.9rem;line-height:1.2;} .rekke .rrole{font-size:.8rem;color:var(--ink-700);line-height:1.2;}
  .rekke .chev{color:var(--ink-500);flex:none;}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }
</style>
</head>
<body>
  <div class="phone">
    <div class="inner" id="root">
      <div class="head">
        <div><div class="title">Dagens antrekk</div><div class="eyebrow" id="eyebrow"></div></div>
        <div class="close" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      </div>
      <div class="stage" id="stage">
        <div class="ring-guide" id="guide"></div>
        <div class="avatar" id="avatar"></div>
        <div class="loader" id="loader"><div class="glass"><span>Analyserer været</span><span class="dots"><i></i><i></i><i></i></span></div></div>
      </div>
      <nav class="rekke" aria-label="Rekkefølge">
        <h3>Rekkefølge · innerst først</h3>
        <ol id="list"></ol>
      </nav>
    </div>
  </div>

<script>
  var G = '../../illustrations/garments/';
  var A = '../../avatars/f79-poc/';
  var SETS = {
    mild: {
      eyebrow:'Delvis skyet · 23° · 2 lag',
      avatarSeq:[A+'stage-0.png',A+'stage-1.png',A+'stage-2.png',A+'stage-2-solhatt.png'],
      // plagg-index → avatar-frame: hatt (frame 3) KUN ved solhatt-chipen (#3)
      stageForChip:[1,2,3],
      items:[
        {n:'Langermet ullbody tynn', role:'Innerst · mot huden', kind:'lag', img:'langermet-ullbody-tynn'},
        {n:'Lett bukse', role:'Innerst · bein', kind:'lag', img:'lett-bukse'},
        {n:'Caps eller solhatt', role:'Tilbehør · hode · sist', kind:'tilbehor', img:'solhatt'},
      ],
    },
    kald: {
      eyebrow:'Snø · −12° · 7 lag',
      // Lue-løse stager for kropps-plaggene; lua KUN på siste frame (stage-4-lue).
      avatarSeq:[A+'stage-0.png',A+'stage-1.png',A+'stage-2.png',A+'stage-3.png',A+'stage-4.png',A+'stage-4-lue.png'],
      // 7 plagg → frame: body1,sokker2,mellom3,dress4,hals(hold4),votter(hold4),LUE→5(hatt)
      stageForChip:[1,2,3,4,4,4,5],
      items:[
        {n:'Langermet ullbody', role:'Innerst · mot huden', kind:'lag', img:'langermet-ullbody'},
        {n:'Ullsokker', role:'Innerst · føtter', kind:'lag', img:'ullsokker'},
        {n:'Ull-mellomlag', role:'Mellomlag', kind:'lag', img:'ull-mellomlag'},
        {n:'Vinterdress', role:'Ytterst', kind:'lag', img:'vinterdress'},
        {n:'Hals', role:'Tilbehør · hals', kind:'tilbehor', img:'hals'},
        {n:'Votter, tykke', role:'Tilbehør · hender', kind:'tilbehor', img:'votter-tykke'},
        {n:'Lue med ull', role:'Tilbehør · hode · sist', kind:'tilbehor', img:'lue-m-ull'},
      ],
    },
  };

  var params = new URLSearchParams(location.search);
  var set = SETS[params.get('set')] || SETS.mild;
  var N = set.items.length;
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var chipSize = N <= 3 ? 96 : (N <= 5 ? 80 : 68);
  var thumbPad = N <= 3 ? 12 : (N <= 5 ? 9 : 7);

  document.getElementById('eyebrow').textContent = set.eyebrow;

  // Avatar-stages (crossfade)
  var avatar = document.getElementById('avatar');
  set.avatarSeq.forEach(function(src,i){
    var img = document.createElement('img'); img.className='stg'; img.dataset.i=i; img.src=src; img.alt='';
    avatar.appendChild(img);
  });
  var stg = [].slice.call(avatar.querySelectorAll('.stg'));
  function showStage(i){ stg.forEach(function(s){ s.classList.toggle('on', +s.dataset.i <= i); }); }
  function pulse(){ avatar.classList.remove('pulse'); void avatar.offsetWidth; avatar.classList.add('pulse'); }

  // Liste (interaktiv kilde)
  var list = document.getElementById('list');
  set.items.forEach(function(it,i){
    var cls = it.kind==='tilbehor'?'b-tilbehor':'b-lag';
    var li=document.createElement('li');
    li.innerHTML='<button type="button"><span class="num '+cls+'">'+(i+1)+'</span><span class="rthumb"><img src="'+G+it.img+'.png" alt=""></span><span class="rtext"><span class="rname">'+it.n+'</span><span class="rrole">'+it.role+'</span></span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>';
    list.appendChild(li);
  });

  // Ring-posisjoner
  var chips = [];
  function layout(){
    var stage=document.getElementById('stage'); var W=stage.clientWidth,H=stage.clientHeight;
    var cx=W/2, cy=H*0.46; var rx=Math.min(W*0.46,165), ry=Math.min(H*0.44,210);
    var guide=document.getElementById('guide');
    guide.style.width=(rx*2)+'px'; guide.style.height=(ry*2)+'px'; guide.style.left=(cx-rx)+'px'; guide.style.top=(cy-ry)+'px';
    if(!chips.length){
      set.items.forEach(function(it,i){
        var cls=it.kind==='tilbehor'?'b-tilbehor':'b-lag';
        var chip=document.createElement('div'); chip.className='chip';
        chip.innerHTML='<div class="thumb" style="width:'+chipSize+'px;height:'+chipSize+'px;padding:'+thumbPad+'px"><span class="badge '+cls+'">'+(i+1)+'</span><img src="'+G+it.img+'.png" alt=""></div>';
        stage.appendChild(chip); chips.push(chip);
      });
    }
    chips.forEach(function(chip,i){
      var ang=-Math.PI/2 + i*(2*Math.PI/N);
      chip.style.left=(cx+rx*Math.cos(ang))+'px'; chip.style.top=(cy+ry*Math.sin(ang))+'px';
    });
  }
  layout(); window.addEventListener('resize', layout);

  var root=document.getElementById('root'), loader=document.getElementById('loader');

  if(rm){
    loader.classList.add('hide'); showStage(stg.length-1);
    chips.forEach(function(c){ c.classList.add('in'); }); root.classList.add('revealed');
  } else {
    showStage(0);
    setTimeout(function(){ loader.classList.add('hide'); }, 820);
    var step = N<=3 ? 430 : 340;
    var STAGE_DELAY = 250; // avatar får plagget PÅ først når chipen har (nesten) landet — synk
    for(var i=0;i<N;i++){ (function(i){
      var t0 = 1000 + i*step;
      setTimeout(function(){ chips[i].classList.add('in'); }, t0);                        // plagget flyr inn
      setTimeout(function(){ showStage(set.stageForChip[i]); pulse(); }, t0 + STAGE_DELAY); // så får avataren det på
    })(i); }
    setTimeout(function(){ root.classList.add('revealed'); }, 1000 + (N-1)*step + STAGE_DELAY + 340);
  }
</script>
</body>
</html>
